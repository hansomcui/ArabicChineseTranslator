name: Build Arabic Chinese Translator V7 Hotfix

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Reuse V7 generator
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/build-apk-v7-online-accurate.yml')
          lines = p.read_text(encoding='utf-8').splitlines()
          start = None
          for i, line in enumerate(lines):
              if line.strip() == '- name: Generate Android project':
                  for j in range(i + 1, min(i + 10, len(lines))):
                      if lines[j].strip() == 'run: |':
                          start = j + 1
                          break
                  break
          if start is None:
              raise SystemExit('Could not find V7 generator block')

          out = []
          for line in lines[start:]:
              if line.startswith('      - name: '):
                  break
              if line.startswith('          '):
                  out.append(line[10:])
              elif line.strip() == '':
                  out.append('')
              else:
                  raise SystemExit('Unexpected indentation: ' + repr(line))

          Path('/tmp/generate-v7.sh').write_text('\n'.join(out) + '\n', encoding='utf-8')
          PY
          bash /tmp/generate-v7.sh

      - name: Apply compile hotfix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/hansom/arzhv7/MainActivity.java')
          s = p.read_text(encoding='utf-8')

          old = 'aiSettings.setOnClickListener(v -> showAiSettings());'
          new = 'aiSettings.setOnClickListener(v -> Toast.makeText(this, "在线高精度翻译已启用，无需额外设置", Toast.LENGTH_SHORT).show());'

          if old not in s:
              raise SystemExit('Hotfix target not found')

          p.write_text(s.replace(old, new), encoding='utf-8')
          PY

      - name: Build APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk ArabicChineseTranslator-V7-Online-Accurate.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ArabicChineseTranslator-V7-Online-Accurate-APK
          path: ArabicChineseTranslator-V7-Online-Accurate.apk
