name: Build V13.2 Final Verified

on:
  push:
    paths:
      - '.github/workflows/V13.2-final-verified.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout pinned V13.2 source snapshot
        uses: actions/checkout@v4
        with:
          ref: 46ec75c5c1a47770753c21d540f0d7e1103d9a8b
          fetch-depth: 1

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Install YAML parser
        shell: bash
        run: python3 -m pip install --disable-pip-version-check 'PyYAML>=6,<7'

      - name: Build and independently verify V13.2
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import os
          import shutil
          import subprocess
          import zipfile
          import yaml

          SNAPSHOT = '46ec75c5c1a47770753c21d540f0d7e1103d9a8b'
          EXPECTED_CERT_SHA256 = (
              '219b74c6ce62e1e2bf38e4b0173b910a'
              '99370e2de303296399ebfdc76c5ecd40'
          )
          EXPECTED_RUN_STEPS = [
              'Install Android native toolchain',
              'Reuse proven V13.1 project generator',
              'Apply V13.1 transcript regex fixes',
              'Install V13.2 microphone diagnostic engine',
              'Give V13.2 a clean package and persistent test signature',
              'Add V13.2 regression tests',
              'Static acceptance checks',
              'Unit tests pass 1',
              'Unit tests pass 2 fresh',
              'Build signed V13.2 APK',
          ]

          workflow_path = Path('.github/workflows/V13.2-final.yml')
          v131_path = Path('.github/workflows/V13.1.yml')
          EXPECTED_V132_BLOB = 'fc629e8d8407a9a20562c3cdc8a90051225cf0c4'
          EXPECTED_V131_BLOB = '39385a9d1b546e7fe44f95b1af162e13fa617954'

          if not workflow_path.is_file():
              raise SystemExit(f'Missing pinned V13.2 workflow at snapshot {SNAPSHOT}')
          if not v131_path.is_file():
              raise SystemExit(f'Missing pinned V13.1 dependency at snapshot {SNAPSHOT}')

          actual_head = subprocess.run(
              ['git', 'rev-parse', 'HEAD'],
              check=True,
              capture_output=True,
              text=True,
          ).stdout.strip()
          if actual_head != SNAPSHOT:
              raise SystemExit(f'Checkout mismatch: expected {SNAPSHOT}, got {actual_head}')

          def git_blob_sha(path):
              return subprocess.run(
                  ['git', 'hash-object', str(path)],
                  check=True,
                  capture_output=True,
                  text=True,
              ).stdout.strip()

          v132_blob = git_blob_sha(workflow_path)
          v131_blob = git_blob_sha(v131_path)
          if v132_blob != EXPECTED_V132_BLOB:
              raise SystemExit(f'V13.2 workflow blob mismatch: {v132_blob}')
          if v131_blob != EXPECTED_V131_BLOB:
              raise SystemExit(f'V13.1 workflow blob mismatch: {v131_blob}')
          print('PASS pinned commit and workflow blob identities')

          workflow = yaml.safe_load(workflow_path.read_text(encoding='utf-8'))
          steps = workflow['jobs']['build']['steps']

          selected = []
          for step in steps:
              name = step.get('name')
              if name in EXPECTED_RUN_STEPS:
                  if 'run' not in step:
                      raise SystemExit(f'Expected run script missing for step: {name}')
                  selected.append((name, str(step['run'])))

          found_names = [name for name, _ in selected]
          if found_names != EXPECTED_RUN_STEPS:
              raise SystemExit(
                  'Pinned V13.2 run-step order mismatch.\n'
                  f'Expected: {EXPECTED_RUN_STEPS}\n'
                  f'Found: {found_names}'
              )

          print(f'Pinned snapshot: {SNAPSHOT}')
          print(f'Validated {len(selected)} original V13.2 build/test steps.')

          for index, (name, script) in enumerate(selected, 1):
              print(f'\n===== [{index}/{len(selected)}] {name} =====', flush=True)
              subprocess.run(
                  ['bash', '-c', 'set -euo pipefail\n' + script],
                  check=True,
                  env=os.environ.copy(),
              )

          source_apk = Path('app/build/outputs/apk/debug/app-debug.apk')
          if not source_apk.is_file():
              raise SystemExit('Gradle reported success but app-debug.apk is missing.')
          if source_apk.stat().st_size <= 10_000_000:
              raise SystemExit(
                  f'APK is unexpectedly small: {source_apk.stat().st_size} bytes'
              )

          # Independent ZIP integrity and native-library checks.
          with zipfile.ZipFile(source_apk, 'r') as zf:
              bad_member = zf.testzip()
              if bad_member is not None:
                  raise SystemExit(f'APK ZIP integrity failed at: {bad_member}')
              names = zf.namelist()

          required_checks = {
              'AndroidManifest.xml': 'AndroidManifest.xml' in names,
              'classes.dex': any(
                  n == 'classes.dex' or (n.startswith('classes') and n.endswith('.dex'))
                  for n in names
              ),
              'arm64 ABI directory': any(n.startswith('lib/arm64-v8a/') for n in names),
              'Whisper native library': any(
                  n.startswith('lib/arm64-v8a/') and 'libwhisper' in n for n in names
              ),
              'sherpa-onnx JNI': 'lib/arm64-v8a/libsherpa-onnx-jni.so' in names,
          }
          failed_native = [k for k, ok in required_checks.items() if not ok]
          for label, ok in required_checks.items():
              print(('PASS ' if ok else 'FAIL ') + label)
          if failed_native:
              raise SystemExit(
                  'APK native library verification failed: ' + ', '.join(failed_native)
              )

          android_home = Path(os.environ['ANDROID_HOME'])
          build_tools = android_home / 'build-tools' / '35.0.0'
          apksigner = build_tools / 'apksigner'
          aapt = build_tools / 'aapt'

          for tool in (apksigner, aapt):
              if not tool.is_file():
                  raise SystemExit(f'Required Android build tool missing: {tool}')

          # Independent package/version verification.
          badging = subprocess.run(
              [str(aapt), 'dump', 'badging', str(source_apk)],
              check=True,
              capture_output=True,
              text=True,
          ).stdout
          expected_badging = [
              "package: name='com.hansom.arzhv132'",
              "versionCode='132'",
              "versionName='13.2'",
          ]
          missing_badging = [x for x in expected_badging if x not in badging]
          if missing_badging:
              raise SystemExit(
                  'APK package/version mismatch: ' + ', '.join(missing_badging)
              )
          print('PASS package com.hansom.arzhv132 / versionCode 132 / versionName 13.2')

          dist = Path('dist')
          dist.mkdir(parents=True, exist_ok=True)
          final_apk = dist / 'ArabicLiveInterpreter-V13.2-Mic-Diagnostic.apk'
          shutil.copy2(source_apk, final_apk)

          digest = hashlib.sha256(final_apk.read_bytes()).hexdigest()
          (dist / 'SHA256.txt').write_text(
              f'{digest}  {final_apk.name}\n',
              encoding='utf-8',
          )

          # Independent APK signature verification.
          verify = subprocess.run(
              [
                  str(apksigner),
                  'verify',
                  '--verbose',
                  '--print-certs',
                  str(final_apk),
              ],
              check=True,
              capture_output=True,
              text=True,
          )
          signature_text = (verify.stdout or '') + (verify.stderr or '')
          (dist / 'SIGNATURE.txt').write_text(signature_text, encoding='utf-8')

          lower_sig = signature_text.lower()
          normalized_sig = lower_sig.replace(':', '')
          if 'verified using v2 scheme' not in lower_sig:
              raise SystemExit('APK v2 signing verification did not pass.')
          if EXPECTED_CERT_SHA256 not in normalized_sig:
              raise SystemExit('APK certificate SHA-256 fingerprint mismatch.')
          if 'cn=arabicliveinterpreter v13.2' not in lower_sig:
              raise SystemExit('APK certificate subject mismatch.')
          print('PASS APK v2 signature')
          print('PASS certificate SHA-256 fingerprint')
          print('PASS certificate subject CN=ArabicLiveInterpreter V13.2')

          # Re-read the copied artifact to ensure the uploaded file is identical.
          copied_digest = hashlib.sha256(final_apk.read_bytes()).hexdigest()
          if copied_digest != digest:
              raise SystemExit('Final APK changed after verification.')

          summary = (
              f'V13.2 FINAL VERIFIED\n'
              f'Snapshot: {SNAPSHOT}\n'
              f'APK: {final_apk}\n'
              f'Size: {final_apk.stat().st_size} bytes\n'
              f'SHA256: {digest}\n'
              f'Package: com.hansom.arzhv132\n'
              f'Version: 13.2 (132)\n'
          )
          (dist / 'VERIFICATION.txt').write_text(summary, encoding='utf-8')
          print('\n' + summary)
          PY

      - name: Upload verified V13.2 APK
        uses: actions/upload-artifact@v4
        with:
          name: ArabicLiveInterpreter-V13.2-Final-Verified
          path: |
            dist/ArabicLiveInterpreter-V13.2-Mic-Diagnostic.apk
            dist/SHA256.txt
            dist/SIGNATURE.txt
            dist/VERIFICATION.txt
          if-no-files-found: error
          retention-days: 30
