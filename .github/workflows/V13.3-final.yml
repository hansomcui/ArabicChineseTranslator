              'same package for in-place upgrade': "applicationId 'com.hansom.arzhv132'" in gradle,
              'Android SpeechRecognizer main path': 'SpeechRecognizer.createSpeechRecognizer' in hybrid,
              'Kuwait Arabic first': '"ar-KW", "ar-SA", "ar-AE", "ar-IQ", "ar-EG", "ar"' in hybrid,
              'partial results enabled': 'RecognizerIntent.EXTRA_PARTIAL_RESULTS' in hybrid,
              'automatic session restart': 'scheduleStart(220L)' in hybrid,
              'stale recognizer isolation': 'recognizerToken' in hybrid and 'destroyRecognizer()' in hybrid,
              'awaiting-final guard': 'isAwaitingFinal()' in hybrid and 'awaitingFinal' in hybrid,
              'network circuit breaker': 'NETWORK_FAILURE_LIMIT' in hybrid,
              'default recognizer endpointer': 'EXTRA_SPEECH_INPUT_COMPLETE_SILENCE_LENGTH_MILLIS' not in hybrid,
              'language fallback': 'ERROR_LANGUAGE_NOT_SUPPORTED' in hybrid and 'languageIndex++' in hybrid,
              'recognition service visibility': 'android.speech.RecognitionService' in manifest,
              'direct dialect online translation': 'onlineTranslate(job.raw)' in main,
              'ML Kit MSA fallback': 'translator.translate(job.msa.ifBlank { job.raw })' in main,
              'MSA display only': 'msaHistory.append(normalized.msa)' in main,
              'latest-only translation backlog': 'translationQueue.size >= 1' in main,
              'pause ASR during TTS': 'hybridAsr.pauseForTts()' in main,
              'resume ASR after TTS': 'hybridAsr.resumeAfterTts(250L)' in main,
              'TTS waits for final': 'hybridAsr.isAwaitingFinal()' in main,
              'async epoch guard': 'job.epoch != translationEpoch' in main,
              'translation source telemetry': '翻译[$source]' in main,
              'translation diagnostic button': '测试翻译链路（不使用麦克风）' in main,
              'lazy Whisper': 'Whisper备用模型：已下载（按需加载）' in main,
              'Whisper fallback retained': 'asr.start()' in main,
              'mic self-test retained': 'asr.startMicSelfTest()' in main,
              'translation telemetry': '翻译[$source] ${translateMs}ms' in main,
          }
          failed = [k for k, v in checks.items() if not v]
          for k, v in checks.items():
              print(('PASS ' if v else 'FAIL ') + k)
          if failed:
              raise SystemExit('Static acceptance failed: ' + ', '.join(failed))
          PY

      - name: Unit tests pass 1
        shell: bash
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Unit tests pass 2 fresh
        shell: bash
        run: gradle :app:testDebugUnitTest --rerun-tasks --stacktrace

      - name: Build signed V13.3 APK
        shell: bash
        run: gradle :app:assembleDebug --stacktrace

      - name: Independently verify V13.3 APK
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import os
          import shutil
          import subprocess
          import zipfile

          source = Path('app/build/outputs/apk/debug/app-debug.apk')
          if not source.is_file() or source.stat().st_size <= 10_000_000:
              raise SystemExit('V13.3 APK missing or unexpectedly small')

          with zipfile.ZipFile(source, 'r') as zf:
              bad = zf.testzip()
              if bad is not None:
                  raise SystemExit(f'APK ZIP corruption at {bad}')
              names = zf.namelist()

          required = [
              'AndroidManifest.xml',
              'lib/arm64-v8a/libsherpa-onnx-jni.so',
          ]
          for item in required:
              if item not in names:
                  raise SystemExit(f'Missing APK member: {item}')
          if not any(
              n.startswith('lib/arm64-v8a/') and 'libwhisper' in n
              for n in names
          ):
              raise SystemExit('Whisper fallback native library missing')

          android_home = Path(os.environ['ANDROID_HOME'])
          bt = android_home / 'build-tools' / '35.0.0'
          aapt = bt / 'aapt'
          apksigner = bt / 'apksigner'

          badging = subprocess.run(
              [str(aapt), 'dump', 'badging', str(source)],
              check=True,
              capture_output=True,
              text=True,
          ).stdout
          expected = [
              "package: name='com.hansom.arzhv132'",
              "versionCode='133'",
              "versionName='13.3'",
          ]
          for item in expected:
              if item not in badging:
                  raise SystemExit(f'Badging mismatch: {item}')

          sig = subprocess.run(
              [str(apksigner), 'verify', '--verbose', '--print-certs', str(source)],
              check=True,
              capture_output=True,
              text=True,
          )
          sig_text = (sig.stdout or '') + (sig.stderr or '')
          normalized = sig_text.lower().replace(':', '')
          expected_cert = (
              '219b74c6ce62e1e2bf38e4b0173b910a'
              '99370e2de303296399ebfdc76c5ecd40'
          )
          if 'verified using v2 scheme' not in sig_text.lower():
              raise SystemExit('APK v2 signature verification failed')
          if expected_cert not in normalized:
              raise SystemExit('Signing certificate fingerprint mismatch')

          dist = Path('dist')
          dist.mkdir(exist_ok=True)
          final = dist / 'ArabicLiveInterpreter-V13.3-Hybrid-RealTime.apk'
          shutil.copy2(source, final)
          digest = hashlib.sha256(final.read_bytes()).hexdigest()
          (dist / 'SHA256-V13.3.txt').write_text(
              f'{digest}  {final.name}\n',
              encoding='utf-8',
          )
          (dist / 'SIGNATURE-V13.3.txt').write_text(sig_text, encoding='utf-8')
          (dist / 'VERIFICATION-V13.3.txt').write_text(
              'V13.3 Hybrid Real-Time VERIFIED\n'
              'Package: com.hansom.arzhv132\n'
              'Version: 13.3 (133)\n'
              f'Size: {final.stat().st_size} bytes\n'
              f'SHA256: {digest}\n'
              'Main ASR: Android SpeechRecognizer\n'
              'Primary locale: ar-KW\n'
              'Translation: original dialect -> Chinese\n'
              'MSA: display-only\n'
              'Whisper: fallback\n',
              encoding='utf-8',
          )
          print(f'V13.3 VERIFIED: {final} SHA256={digest}')
          PY

      - name: Upload V13.3 APK
        uses: actions/upload-artifact@v4
        with:
          name: ArabicLiveInterpreter-V13.3-Hybrid-RealTime
          path: |
            dist/ArabicLiveInterpreter-V13.3-Hybrid-RealTime.apk
            dist/SHA256-V13.3.txt
            dist/SIGNATURE-V13.3.txt
            dist/VERIFICATION-V13.3.txt
          if-no-files-found: error
          retention-days: 30
