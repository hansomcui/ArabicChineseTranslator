          class MainActivity : Activity() {
              private lateinit var engine: AccuracyAsrEngine
              private lateinit var status: TextView
              private lateinit var mic: TextView
              private lateinit var modelBtn: Button
              private lateinit var recordBtn: Button
              private lateinit var reanalyzeBtn: Button
              private lateinit var rawSegments: TextView
              private lateinit var merged: TextView
              private lateinit var organized: TextView

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  buildUi()
                  engine = AccuracyAsrEngine(this, object : AccuracyAsrEngine.Listener {
                      override fun onStatus(text: String) {
                          status.text = text
                      }

                      override fun onModelReady(ready: Boolean) {
                          modelBtn.text = if (ready) {
                              "✅ Q4快速模型：已就绪"
                          } else {
                              "下载Q4快速阿语方言模型（约452MB）"
                          }
                          recordBtn.isEnabled = ready
                      }

                      override fun onRecordingChanged(recording: Boolean) {
                          recordBtn.text = if (recording) {
                              "■ 停止并快速分析"
                          } else {
                              "🎙 录一句完整阿语"
                          }
                      }

                      override fun onMic(dbfs: Float, seconds: Float) {
                          mic.text = "🎤 ${"%.1f".format(dbfs)} dBFS · 已录 ${"%.1f".format(seconds)} 秒"
                      }

                      override fun onDecodeStarted(audioMs: Int, windows: Int) {
                          status.text = "🧠 Beam2快速识别 ${audioMs / 1000.0} 秒 · ${windows}窗口"
                          rawSegments.text = "正在分析原始分段……"
                          merged.text = "正在整合……"
                          organized.text = "正在组织……"
                      }

                      override fun onDecodeFinished(
                          raw: List<SentenceAssembler.Segment>,
                          result: SentenceAssembler.Result,
                          latencyMs: Long,
                      ) {
                          rawSegments.text = if (raw.isEmpty()) {
                              "未识别到有效语音"
                          } else {
                              raw.joinToString("\n") {
                                  "[${"%.2f".format(it.startMs / 1000.0)}–${"%.2f".format(it.endMs / 1000.0)}] ${it.text}"
                              }
                          }
                          merged.text = result.merged.ifBlank { "—" }
                          organized.text = result.organized.ifBlank { "—" }
                          status.text =
                              "✅ V14.1完成 · ${result.segmentCount}段 · 推理 ${latencyMs / 1000.0} 秒"
                          reanalyzeBtn.isEnabled = engine.hasLastAudio()
                      }
                  })

                  if (checkSelfPermission(Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                      requestPermissions(arrayOf(Manifest.permission.RECORD_AUDIO), 1401)
                  }
                  engine.initializeIfPossible()
              }

              private fun buildUi() {
                  val scroll = ScrollView(this)
                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(dp(18), dp(20), dp(18), dp(28))
                      setBackgroundColor(Color.rgb(245, 245, 245))
                  }
                  scroll.addView(root)

                  root.addView(TextView(this).apply {
                      text = "V14.1 · Fast Accurate Arabic"
                      textSize = 25f
                      setTypeface(null, 1)
                      gravity = Gravity.CENTER
                      setTextColor(Color.BLACK)
                  })
                  root.addView(TextView(this).apply {
                      text = "先把手机跑顺 · Q4方言Whisper → Beam2 → 9秒窗口/2秒重叠 → 句子整合\n12秒保护上限 · 本版暂时不翻译"
                      textSize = 14f
                      gravity = Gravity.CENTER
                      setPadding(0, dp(8), 0, dp(12))
                  })

                  status = TextView(this).apply {
                      text = "● V14启动中"
                      textSize = 15f
                      gravity = Gravity.CENTER
                      setPadding(0, dp(6), 0, dp(8))
                  }
                  root.addView(status)

                  modelBtn = Button(this).apply {
                      text = "下载Q4快速阿语方言模型（约452MB）"
                      isAllCaps = false
                      setOnClickListener { engine.ensureModel() }
                  }
                  root.addView(modelBtn)

                  recordBtn = Button(this).apply {
                      text = "🎙 录一句完整阿语"
                      textSize = 20f
                      isAllCaps = false
                      isEnabled = false
                      setOnClickListener {
                          if (
                              checkSelfPermission(Manifest.permission.RECORD_AUDIO) !=
                              PackageManager.PERMISSION_GRANTED
                          ) {
                              requestPermissions(arrayOf(Manifest.permission.RECORD_AUDIO), 1401)
                          } else if (engine.isProcessing()) {
                              Toast.makeText(this@MainActivity, "正在分析上一句", Toast.LENGTH_SHORT).show()
                          } else if (engine.isRecording()) {
                              engine.stopSentence()
                          } else {
                              engine.startSentence()
                          }
                      }
                  }
                  root.addView(recordBtn)

                  reanalyzeBtn = Button(this).apply {
                      text = "🧪 重新分析上一次录音"
                      isAllCaps = false
                      isEnabled = false
                      setOnClickListener { engine.reanalyzeLast() }
                  }
                  root.addView(reanalyzeBtn)

                  mic = TextView(this).apply {
                      text = "🎤 等待录音"
                      textSize = 14f
                      setPadding(dp(4), dp(10), dp(4), dp(6))
                  }
                  root.addView(mic)

                  root.addView(section("① Whisper原始分段 + 时间戳"))
                  rawSegments = box("等待录音……", rtl = true)
                  root.addView(rawSegments)

                  root.addView(section("② 时间轴/重叠整合结果"))
                  merged = box("等待整合……", rtl = true)
                  root.addView(merged)

                  root.addView(section("③ 保守句子组织结果"))
                  organized = box("等待组织……", rtl = true)
                  root.addView(organized)

                  setContentView(scroll)
              }

              private fun section(s: String) = TextView(this).apply {
                  text = s
                  textSize = 17f
                  setTypeface(null, 1)
                  setPadding(0, dp(18), 0, dp(6))
              }

              private fun box(initial: String, rtl: Boolean) = TextView(this).apply {
                  text = initial
                  textSize = 20f
                  minHeight = dp(130)
                  setPadding(dp(14), dp(14), dp(14), dp(14))
                  setBackgroundColor(Color.WHITE)
                  gravity = if (rtl) Gravity.RIGHT else Gravity.LEFT
                  setTextIsSelectable(true)
              }

              private fun dp(v: Int): Int =
                  (v * resources.displayMetrics.density + 0.5f).toInt()

              override fun onResume() {
                  super.onResume()
                  if (::engine.isInitialized) engine.initializeIfPossible()
              }

              override fun onDestroy() {
                  if (::engine.isInitialized) engine.release()
                  super.onDestroy()
              }
          }
