name: Build V14.1 Fast Accurate Arabic

on:
  push:
    paths:
      - '.github/workflows/V14.1-fast-accurate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 70

    steps:
      - name: Checkout pinned proven base
        uses: actions/checkout@v4
        with:
          ref: 46ec75c5c1a47770753c21d540f0d7e1103d9a8b
          fetch-depth: 1

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check 'PyYAML>=6,<7'
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;25.2.9519653" "cmake;3.22.1"

      - name: Generate proven Android base
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os, subprocess, yaml

          source = Path('.github/workflows/V13.1.yml')
          data = yaml.safe_load(source.read_text(encoding='utf-8'))
          steps = data['jobs']['build']['steps']
          wanted = ['Fetch Whisper and sherpa runtimes', 'Generate Android project']
          found = []
          for step in steps:
              if step.get('name') in wanted:
                  found.append((step['name'], step['run']))
          if [x[0] for x in found] != wanted:
              raise SystemExit(f'V13.1 base steps mismatch: {[x[0] for x in found]}')
          for i, (name, script) in enumerate(found, 1):
              print(f'===== BASE {i}/2: {name} =====', flush=True)
              subprocess.run(
                  ['bash', '-c', 'set -euo pipefail\n' + script],
                  check=True,
                  env=os.environ.copy(),
              )
          PY

      - name: Install V14 accuracy-first engine
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          # ---- Gradle / package ----
          g = Path('app/build.gradle')
          s = g.read_text(encoding='utf-8')
          s = s.replace("namespace 'com.hansom.arzhv13'", "namespace 'com.hansom.arzhv141'")
          s = s.replace("applicationId 'com.hansom.arzhv13'", "applicationId 'com.hansom.arzhv141'")
          s = s.replace("versionCode 131", "versionCode 141")
          s = s.replace("versionName '13.1'", "versionName '14.1'")
          g.write_text(s, encoding='utf-8')

          # ---- Manifest ----
          m = Path('app/src/main/AndroidManifest.xml')
          ms = m.read_text(encoding='utf-8')
          ms = ms.replace('阿语方言同传 V13.1', '阿语快速高精度识别 V14.1')
          m.write_text(ms, encoding='utf-8')

          # ---- whisper.cpp JNI: accuracy-first decoding ----
          j = Path('vendor/whisper.cpp/examples/whisper.android.java/app/src/main/jni/whisper/jni.c')
          js = j.read_text(encoding='utf-8')

          checks = {
              'greedy default': 'whisper_full_default_params(WHISPER_SAMPLING_GREEDY)' in js,
              'Arabic language': 'params.language = "ar";' in js,
              'no context': 'params.no_context = true;' in js,
              'single segment': 'params.single_segment = true;' in js,
              'thread anchor': 'params.n_threads = num_threads;' in js,
          }
          bad = [k for k,v in checks.items() if not v]
          if bad:
              raise SystemExit('JNI base mismatch: ' + ', '.join(bad))

          js = js.replace(
              'whisper_full_default_params(WHISPER_SAMPLING_GREEDY)',
              'whisper_full_default_params(WHISPER_SAMPLING_BEAM_SEARCH)',
              1,
          )
          js = js.replace('params.no_context = true;', 'params.no_context = false;', 1)
          js = js.replace('params.single_segment = true;', 'params.single_segment = false;', 1)

          anchor = '    params.n_threads = num_threads;\n'
          accuracy = (
              '    params.token_timestamps = false;\n'
              '    params.beam_search.beam_size = 2;\n'
              '    params.beam_search.patience = 1.0f;\n'
              '    params.temperature = 0.0f;\n'
              '    params.split_on_word = false;\n'
              '    params.initial_prompt = "هذه محادثة عربية خليجية أو كويتية في مجال النفط والغاز. كلمات محتملة: KOC، جهاز الحفر، الحفارة، رأس البئر، مضخة الطين، مانع الانفجار، الأنابيب الملفوفة، ESP، VSD، SCADA، مناقصة، عرض سعر.";\n'
              '    params.carry_initial_prompt = false;\n'
          )
          if js.count(anchor) != 1:
              raise SystemExit(f'JNI thread anchor count={js.count(anchor)}')
          js = js.replace(anchor, anchor + accuracy, 1)
          j.write_text(js, encoding='utf-8')
          PY

          cat > app/src/main/java/com/hansom/arzhv13/SentenceAssembler.kt <<'EOFK'
          package com.hansom.arzhv141

          object SentenceAssembler {
              data class Segment(
                  val startMs: Long,
                  val endMs: Long,
                  val text: String,
              )

              data class Result(
                  val merged: String,
                  val organized: String,
                  val segmentCount: Int,
              )

              fun assemble(segments: List<Segment>): Result {
                  val clean = segments
                      .map { it.copy(text = cleanText(it.text)) }
                      .filter { it.text.isNotBlank() }

                  if (clean.isEmpty()) {
                      return Result("", "", 0)
                  }

                  val mergedWords = ArrayList<String>()

                  for (seg in clean) {
                      val words = words(seg.text)
                      if (words.isEmpty()) continue

                      if (mergedWords.isEmpty()) {
                          mergedWords.addAll(words)
                          continue
                      }

                      // Exact/normalized suffix-prefix consensus.
                      val overlap = longestSuffixPrefix(mergedWords, words)
                      if (overlap > 0) {
                          mergedWords.addAll(words.drop(overlap))
                          continue
                      }

                      // If a whole segment is already present near the tail, do not duplicate it.
                      val tail = mergedWords.takeLast(minOf(20, mergedWords.size))
                      if (containsSequence(tail, words)) continue

                      mergedWords.addAll(words)
                  }

                  val merged = fixPunctuationSpacing(mergedWords.joinToString(" "))
                  val organized = conservativeOrganize(merged)
                  return Result(merged, organized, clean.size)
              }

              private fun cleanText(s0: String): String =
                  s0.replace(Regex("""\[[^\]]+]"""), " ")
                      .replace(Regex("""\([^)]*(music|applause|laughter)[^)]*\)""", RegexOption.IGNORE_CASE), " ")
                      .replace(Regex("""\s+"""), " ")
                      .trim()

              private fun words(s: String): List<String> =
                  s.split(Regex("""\s+""")).filter { it.isNotBlank() }

              private fun norm(s: String): String =
                  s.replace(Regex("""[^\p{L}\p{N}]"""), "")
                      .replace("أ", "ا")
                      .replace("إ", "ا")
                      .replace("آ", "ا")
                      .replace("ى", "ي")
                      .replace("ة", "ه")
                      .lowercase()

              private fun same(a: String, b: String): Boolean =
                  norm(a) == norm(b) && norm(a).isNotBlank()

              private fun longestSuffixPrefix(a: List<String>, b: List<String>): Int {
                  val max = minOf(a.size, b.size, 16)
                  for (k in max downTo 1) {
                      var ok = true
                      for (i in 0 until k) {
                          if (!same(a[a.size - k + i], b[i])) {
                              ok = false
                              break
                          }
                      }
                      if (ok) return k
                  }
                  return 0
              }

              private fun containsSequence(hay: List<String>, needle: List<String>): Boolean {
                  if (needle.isEmpty() || needle.size > hay.size) return false
                  for (start in 0..hay.size - needle.size) {
                      var ok = true
                      for (i in needle.indices) {
                          if (!same(hay[start + i], needle[i])) {
                              ok = false
                              break
                          }
                      }
                      if (ok) return true
                  }
                  return false
              }

              private fun fixPunctuationSpacing(s0: String): String =
                  s0.replace(Regex("""\s+([،؛؟.!,:;])"""), "$1")
                      .replace(Regex("""([،؛؟.!,:;])(?=[\p{L}\p{N}])"""), "$1 ")
                      .replace(Regex("""\s+"""), " ")
                      .trim()

              private fun conservativeOrganize(s0: String): String {
                  var s = fixPunctuationSpacing(s0)
                  if (s.isBlank()) return s

                  // Never rewrite vocabulary. Only add a terminal mark when Whisper omitted one.
                  if (!s.matches(Regex(""".*[.؟?!؛]$"""))) {
                      val first = words(s).firstOrNull()?.let(::norm).orEmpty()
                      val question = first in setOf(
                          "هل", "ليش", "شنو", "وش", "ايش", "كيف", "شلون",
                          "كم", "وين", "متي", "من", "منو", "ماذا", "ما"
                      )
                      s += if (question) "؟" else "."
                  }
                  return s
              }
          }
          EOFK

          cat > app/src/main/java/com/hansom/arzhv13/FastWindowPlanner.kt <<'EOFK'
          package com.hansom.arzhv141

          object FastWindowPlanner {
              data class Range(val start: Int, val endExclusive: Int)

              fun ranges(
                  totalSamples: Int,
                  sampleRate: Int = 16000,
                  windowMs: Int = 9000,
                  overlapMs: Int = 2000,
              ): List<Range> {
                  if (totalSamples <= 0) return emptyList()
                  val window = (sampleRate * windowMs / 1000).coerceAtLeast(1)
                  val overlap = (sampleRate * overlapMs / 1000).coerceIn(0, window - 1)
                  val step = window - overlap
                  val out = ArrayList<Range>()
                  var start = 0
                  while (start < totalSamples) {
                      val end = minOf(totalSamples, start + window)
                      out.add(Range(start, end))
                      if (end >= totalSamples) break
                      start += step
                  }
                  return out
              }
          }
          EOFK

          cat > app/src/main/java/com/hansom/arzhv13/AccuracyAsrEngine.kt <<'EOFK'
          package com.hansom.arzhv141

          import android.Manifest
          import android.content.Context
          import android.content.pm.PackageManager
          import android.media.AudioFormat
          import android.media.AudioRecord
          import android.media.MediaRecorder
          import android.os.Handler
          import android.os.Looper
          import com.whispercpp.java.whisper.WhisperLib
          import java.io.File
          import java.io.FileOutputStream
          import java.net.HttpURLConnection
          import java.net.URL
          import java.util.concurrent.atomic.AtomicBoolean
          import kotlin.concurrent.thread
          import kotlin.math.log10
          import kotlin.math.sqrt

          class AccuracyAsrEngine(
              private val context: Context,
              private val listener: Listener,
          ) {
              interface Listener {
                  fun onStatus(text: String)
                  fun onModelReady(ready: Boolean)
                  fun onRecordingChanged(recording: Boolean)
                  fun onMic(dbfs: Float, seconds: Float)
                  fun onDecodeStarted(audioMs: Int, windows: Int)
                  fun onDecodeFinished(
                      rawSegments: List<SentenceAssembler.Segment>,
                      result: SentenceAssembler.Result,
                      latencyMs: Long,
                  )
              }

              companion object {
                  private const val SAMPLE_RATE = 16000
                  private const val MAX_RECORD_MS = 12_000L
                  private const val MIN_RECORD_MS = 700L
                  private const val AUTO_SILENCE_MS = 850L
                  private const val CALIBRATION_MS = 650L
                  private const val MODEL_FILE = "ggml-model-q4_k.bin"
                  private const val MODEL_URL =
                      "https://huggingface.co/dmouayad/whisper-large-v3-turbo-arabic-dialectal-v2-gguf/resolve/main/ggml-model-q4_k.bin?download=true"
                  private const val MIN_MODEL_BYTES = 430_000_000L
                  private const val THREADS = 6
                  private const val WINDOW_MS = 9_000
                  private const val OVERLAP_MS = 2_000
                  private const val MIN_SPEECH_RMS = 0.0065f
              }

              private val main = Handler(Looper.getMainLooper())
              private val modelDir = File(context.filesDir, "v141_fast_asr")
              private val modelFile = File(modelDir, MODEL_FILE)
              private val recording = AtomicBoolean(false)
              private val processing = AtomicBoolean(false)
              private val modelBusy = AtomicBoolean(false)
              private val initBusy = AtomicBoolean(false)

              @Volatile private var recorder: AudioRecord? = null
              @Volatile private var contextPtr = 0L
              @Volatile private var lastAudio: FloatArray? = null

              fun isModelReady(): Boolean =
                  modelFile.isFile && modelFile.length() >= MIN_MODEL_BYTES

              fun isReady(): Boolean = isModelReady() && contextPtr != 0L
              fun isRecording(): Boolean = recording.get()
              fun isProcessing(): Boolean = processing.get()
              fun hasLastAudio(): Boolean = lastAudio?.isNotEmpty() == true

              fun initializeIfPossible() {
                  if (!isModelReady()) {
                      listenerModel(false)
                      status("🧠 V14.1 Q4快速方言模型未下载 · 首次约452MB")
                      return
                  }
                  if (contextPtr != 0L) {
                      listenerModel(true)
                      return
                  }
                  if (!initBusy.compareAndSet(false, true)) return
                  status("● 正在加载Q4快速阿语方言模型…")
                  thread(name = "v14-model-init") {
                      try {
                          val ptr = WhisperLib.initContext(modelFile.absolutePath)
                          if (ptr == 0L) error("模型加载失败")
                          contextPtr = ptr
                          listenerModel(true)
                          status("✅ V14.1 Fast-Accurate 已就绪 · Beam2 / Q4 / 9秒窗口")
                      } catch (t: Throwable) {
                          contextPtr = 0L
                          listenerModel(false)
                          status("❌ 模型加载失败：${short(t)}")
                      } finally {
                          initBusy.set(false)
                      }
                  }
              }

              fun ensureModel() {
                  if (isModelReady()) {
                      initializeIfPossible()
                      return
                  }
                  if (!modelBusy.compareAndSet(false, true)) return
                  thread(name = "v14-model-download") {
                      try {
                          modelDir.mkdirs()
                          downloadResumable()
                          if (!isModelReady()) {
                              modelFile.delete()
                              error("模型文件大小异常")
                          }
                          status("✅ Q4模型下载完成，正在加载…")
                          initializeIfPossible()
                      } catch (t: Throwable) {
                          listenerModel(false)
                          status("❌ 模型下载失败：${short(t)}")
                      } finally {
                          modelBusy.set(false)
                      }
                  }
              }

              fun startSentence() {
                  if (processing.get()) {
                      status("⚠ 正在分析上一句，请等待")
                      return
                  }
                  if (!isReady()) {
                      status("⚠ 请先下载并加载Q4快速模型")
                      return
                  }
                  if (
                      context.checkSelfPermission(Manifest.permission.RECORD_AUDIO) !=
                      PackageManager.PERMISSION_GRANTED
                  ) {
                      status("⚠ 请允许麦克风权限")
                      return
                  }
                  if (!recording.compareAndSet(false, true)) return
                  listenerRecording(true)
                  thread(name = "v14-accuracy-record") { captureSentence() }
              }

              fun stopSentence() {
                  if (!recording.compareAndSet(true, false)) return
                  runCatching { recorder?.stop() }
                  status("■ 已停止收音，准备高精度分析…")
              }

              fun reanalyzeLast() {
                  val audio = lastAudio
                  if (audio == null || audio.isEmpty()) {
                      status("⚠ 还没有可重新分析的录音")
                      return
                  }
                  analyze(audio.copyOf())
              }

              private fun captureSentence() {
                  val min = AudioRecord.getMinBufferSize(
                      SAMPLE_RATE,
                      AudioFormat.CHANNEL_IN_MONO,
                      AudioFormat.ENCODING_PCM_16BIT,
                  )
                  if (min <= 0) {
                      recording.set(false)
                      listenerRecording(false)
                      status("❌ AudioRecord初始化失败")
                      return
                  }

                  val rec = AudioRecord(
                      MediaRecorder.AudioSource.VOICE_RECOGNITION,
                      SAMPLE_RATE,
                      AudioFormat.CHANNEL_IN_MONO,
                      AudioFormat.ENCODING_PCM_16BIT,
                      maxOf(min * 2, 8192),
                  )
                  if (rec.state != AudioRecord.STATE_INITIALIZED) {
                      rec.release()
                      recording.set(false)
                      listenerRecording(false)
                      status("❌ 麦克风初始化失败")
                      return
                  }

                  recorder = rec
                  val chunks = ArrayList<ShortArray>()
                  val calibration = ArrayList<Float>()
                  val buf = ShortArray(maxOf(4096, min / 2))
                  val started = System.currentTimeMillis()
                  var calibrated = false
                  var noiseFloor = 0.0035f
                  var speechThreshold = MIN_SPEECH_RMS
                  var lastSignalAt = started
                  var seenSignal = false
                  var total = 0

                  try {
                      rec.startRecording()
                      status("🎛 约0.7秒环境校准，然后正常说一句阿语")
                      while (recording.get()) {
                          val n = rec.read(buf, 0, buf.size)
                          if (n <= 0) continue

                          chunks.add(buf.copyOf(n))
                          total += n
                          val now = System.currentTimeMillis()
                          val elapsed = now - started
                          val frameRms = rms(buf, n)

                          if (!calibrated) {
                              calibration.add(frameRms)
                              if (elapsed >= CALIBRATION_MS) {
                                  val sorted = calibration.sorted()
                                  val idx = ((sorted.size - 1) * 0.35).toInt().coerceAtLeast(0)
                                  noiseFloor = sorted.getOrElse(idx) { 0.0035f }.coerceAtLeast(0.0015f)
                                  speechThreshold = maxOf(MIN_SPEECH_RMS, noiseFloor * 1.70f + 0.0015f)
                                  calibrated = true
                                  lastSignalAt = now
                                  status("🎙 开始讲话 · 自适应门限 ${"%.1f".format(dbfs(speechThreshold))} dBFS")
                              }
                          } else {
                              val speech = frameRms >= speechThreshold
                              if (speech) {
                                  seenSignal = true
                                  lastSignalAt = now
                              } else {
                                  noiseFloor = (noiseFloor * 0.96f + frameRms * 0.04f).coerceAtLeast(0.0015f)
                                  speechThreshold = maxOf(MIN_SPEECH_RMS, noiseFloor * 1.70f + 0.0015f)
                              }
                          }

                          emitMic(frameRms, total.toFloat() / SAMPLE_RATE)

                          if (
                              calibrated &&
                              seenSignal &&
                              elapsed >= 1_500L &&
                              now - lastSignalAt >= AUTO_SILENCE_MS
                          ) {
                              status("✓ 句末停顿确认，立即开始识别")
                              recording.set(false)
                              break
                          }

                          if (elapsed >= MAX_RECORD_MS) {
                              status("✓ 12秒保护上限，立即开始识别")
                              recording.set(false)
                              break
                          }
                      }
                  } catch (t: Throwable) {
                      status("❌ 录音异常：${short(t)}")
                  } finally {
                      runCatching { rec.stop() }
                      rec.release()
                      recorder = null
                      recording.set(false)
                      listenerRecording(false)
                  }

                  if (total * 1000L / SAMPLE_RATE < MIN_RECORD_MS) {
                      status("⚠ 录音太短，请重新说一句")
                      return
                  }

                  val audio = FloatArray(total)
                  var off = 0
                  for (chunk in chunks) {
                      for (x in chunk) audio[off++] = x / 32768.0f
                  }
                  lastAudio = audio
                  analyze(audio)
              }

              private fun analyze(audio: FloatArray) {
                  if (!processing.compareAndSet(false, true)) return
                  thread(name = "v141-fast-decode") {
                      val started = System.currentTimeMillis()
                      try {
                          val ptr = contextPtr
                          if (ptr == 0L) error("模型尚未加载")

                          val ranges = FastWindowPlanner.ranges(
                              totalSamples = audio.size,
                              sampleRate = SAMPLE_RATE,
                              windowMs = WINDOW_MS,
                              overlapMs = OVERLAP_MS,
                          )
                          val audioMs = audio.size * 1000 / SAMPLE_RATE
                          main.post { listener.onDecodeStarted(audioMs, ranges.size) }

                          val allSegments = ArrayList<SentenceAssembler.Segment>()
                          for ((windowIndex, range) in ranges.withIndex()) {
                              val window = audio.copyOfRange(range.start, range.endExclusive)
                              status(
                                  "🧠 快速识别 ${windowIndex + 1}/${ranges.size} · " +
                                  "${"%.1f".format(window.size.toDouble() / SAMPLE_RATE)}秒"
                              )

                              WhisperLib.fullTranscribe(ptr, THREADS, window)
                              val n = WhisperLib.getTextSegmentCount(ptr)
                              val offsetMs = range.start * 1000L / SAMPLE_RATE

                              for (i in 0 until n) {
                                  val text = WhisperLib.getTextSegment(ptr, i)?.trim().orEmpty()
                                  if (text.isBlank()) continue
                                  val t0 = offsetMs + WhisperLib.getTextSegmentT0(ptr, i) * 10L
                                  val t1 = offsetMs + WhisperLib.getTextSegmentT1(ptr, i) * 10L
                                  allSegments.add(
                                      SentenceAssembler.Segment(
                                          startMs = t0,
                                          endMs = t1,
                                          text = text,
                                      )
                                  )
                              }
                          }

                          val result = SentenceAssembler.assemble(
                              allSegments.sortedWith(
                                  compareBy<SentenceAssembler.Segment> { it.startMs }.thenBy { it.endMs }
                              )
                          )
                          val latency = System.currentTimeMillis() - started
                          main.post { listener.onDecodeFinished(allSegments, result, latency) }
                      } catch (t: Throwable) {
                          status("❌ 快速识别失败：${short(t)}")
                      } finally {
                          processing.set(false)
                      }
                  }
              }

              private fun downloadResumable() {
                  modelDir.mkdirs()
                  val part = File(modelFile.absolutePath + ".part")
                  val start = if (part.isFile) part.length() else 0L
                  var current = MODEL_URL
                  repeat(8) {
                      val c = (URL(current).openConnection() as HttpURLConnection).apply {
                          instanceFollowRedirects = false
                          connectTimeout = 15000
                          readTimeout = 120000
                          requestMethod = "GET"
                          setRequestProperty("User-Agent", "ArabicAccuracyLab-V14/1.0")
                          if (start > 0) setRequestProperty("Range", "bytes=$start-")
                      }
                      val code = c.responseCode
                      if (code in listOf(301, 302, 303, 307, 308)) {
                          val next = c.getHeaderField("Location") ?: error("重定向缺少Location")
                          c.disconnect()
                          current = URL(URL(current), next).toString()
                          return@repeat
                      }
                      if (code !in 200..299) {
                          c.disconnect()
                          error("HTTP $code")
                      }

                      val append = start > 0 && code == 206
                      if (!append && start > 0) part.delete()
                      var done = if (append) start else 0L
                      var lastUi = 0L

                      c.inputStream.use { input ->
                          FileOutputStream(part, append).use { out ->
                              val b = ByteArray(128 * 1024)
                              while (true) {
                                  val n = input.read(b)
                                  if (n < 0) break
                                  out.write(b, 0, n)
                                  done += n
                                  val now = System.currentTimeMillis()
                                  if (now - lastUi >= 700) {
                                      lastUi = now
                                      status("⬇ Q4模型：${"%.1f".format(done / 1024.0 / 1024.0)} MB")
                                  }
                              }
                          }
                      }
                      c.disconnect()

                      if (modelFile.exists()) modelFile.delete()
                      if (!part.renameTo(modelFile)) {
                          part.copyTo(modelFile, overwrite = true)
                          part.delete()
                      }
                      return
                  }
                  error("下载重定向次数过多")
              }

              fun release() {
                  recording.set(false)
                  runCatching { recorder?.stop() }
                  val ptr = contextPtr
                  contextPtr = 0L
                  if (ptr != 0L) runCatching { WhisperLib.freeContext(ptr) }
              }

              private fun rms(a: ShortArray, n: Int): Float {
                  var sum = 0.0
                  for (i in 0 until n) {
                      val x = a[i] / 32768.0
                      sum += x * x
                  }
                  return sqrt(sum / n.coerceAtLeast(1)).toFloat()
              }

              private fun dbfs(rms: Float): Float =
                  if (rms <= 0.000001f) -120f else (20.0 * log10(rms.toDouble())).toFloat()

              private fun emitMic(rms: Float, seconds: Float) =
                  main.post { listener.onMic(dbfs(rms), seconds) }

              private fun status(s: String) = main.post { listener.onStatus(s) }
              private fun listenerModel(v: Boolean) = main.post { listener.onModelReady(v) }
              private fun listenerRecording(v: Boolean) =
                  main.post { listener.onRecordingChanged(v) }

              private fun short(t: Throwable): String =
                  (t.message ?: t::class.java.simpleName).replace('\n', ' ').take(140)
          }
          EOFK

