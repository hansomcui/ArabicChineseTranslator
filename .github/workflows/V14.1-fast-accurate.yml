      - name: V14 static acceptance
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          j = Path('vendor/whisper.cpp/examples/whisper.android.java/app/src/main/jni/whisper/jni.c').read_text()
          e = Path('app/src/main/java/com/hansom/arzhv13/AccuracyAsrEngine.kt').read_text()
          a = Path('app/src/main/java/com/hansom/arzhv13/SentenceAssembler.kt').read_text()
          m = Path('app/src/main/java/com/hansom/arzhv13/MainActivity.kt').read_text()
          g = Path('app/build.gradle').read_text()

          checks = {
              'package v14': "applicationId 'com.hansom.arzhv141'" in g,
              'version 14.0': "versionCode 141" in g and "versionName '14.1'" in g,
              'Q4 model': 'ggml-model-q4_k.bin' in e and '430_000_000L' in e,
              'beam search': 'WHISPER_SAMPLING_BEAM_SEARCH' in j,
              'beam 2': 'params.beam_search.beam_size = 2;' in j,
              'context enabled': 'params.no_context = false;' in j,
              'multi segment': 'params.single_segment = false;' in j,
              'segment timestamps only': 'params.token_timestamps = false;' in j,
              'initial prompt': 'KOC' in j and 'مضخة الطين' in j,
              '12 sec guard': 'MAX_RECORD_MS = 12_000L' in e,
              'adaptive endpointing': 'CALIBRATION_MS' in e and 'speechThreshold' in e and 'AUTO_SILENCE_MS' in e,
              'timestamp assembly': 'getTextSegmentT0' in e and 'getTextSegmentT1' in e,
              'fast windows': 'FastWindowPlanner.ranges' in e and 'WINDOW_MS = 9_000' in e and 'OVERLAP_MS = 2_000' in e,
              'overlap consensus': 'longestSuffixPrefix' in a,
              'no Android SpeechRecognizer': 'SpeechRecognizer' not in (e + m),
              'no translation UI': '翻译' not in m or '本版暂时不翻译' in m,
          }
          bad = [k for k,v in checks.items() if not v]
          for k,v in checks.items():
              print(('PASS ' if v else 'FAIL ') + k)
          if bad:
              raise SystemExit('V14 static acceptance failed: ' + ', '.join(bad))
          PY

