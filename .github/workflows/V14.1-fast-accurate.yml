      - name: Verify V14 APK
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, os, shutil, subprocess, zipfile

          src = Path('app/build/outputs/apk/debug/app-debug.apk')
          if not src.is_file() or src.stat().st_size < 10_000_000:
              raise SystemExit('APK missing or too small')

          with zipfile.ZipFile(src, 'r') as zf:
              bad = zf.testzip()
              if bad:
                  raise SystemExit(f'ZIP corruption at {bad}')
              names = zf.namelist()

          if not any(n.startswith('lib/arm64-v8a/') and 'libwhisper' in n for n in names):
              raise SystemExit('libwhisper arm64 missing')

          bt = Path(os.environ['ANDROID_HOME']) / 'build-tools' / '35.0.0'
          aapt = bt / 'aapt'
          badging = subprocess.run(
              [str(aapt), 'dump', 'badging', str(src)],
              check=True, capture_output=True, text=True
          ).stdout

          for expected in [
              "package: name='com.hansom.arzhv141'",
              "versionCode='141'",
              "versionName='14.1'",
          ]:
              if expected not in badging:
                  raise SystemExit('Badging mismatch: ' + expected)

          dist = Path('dist')
          dist.mkdir(exist_ok=True)
          final = dist / 'ArabicFastAccurate-V14.1.apk'
          shutil.copy2(src, final)
          digest = hashlib.sha256(final.read_bytes()).hexdigest()
          (dist / 'V14-SHA256.txt').write_text(
              f'{digest}  {final.name}\n', encoding='utf-8'
          )
          (dist / 'V14-VERIFICATION.txt').write_text(
              'V14.1 Fast Accurate VERIFIED\n'
              'Package: com.hansom.arzhv141\n'
              'Version: 14.1 (141)\n'
              'Model: Arabic Dialectal Turbo Q4_K\n'
              'Decode: Beam Search 2\n'
              'Mode: <=12s adaptive endpoint, 9s windows / 2s overlap, segment timestamps\n'
              f'SHA256: {digest}\n',
              encoding='utf-8'
          )
          print('V14 VERIFIED', final, digest)
          PY

