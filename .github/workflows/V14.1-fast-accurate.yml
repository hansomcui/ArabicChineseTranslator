          package com.hansom.arzhv141

          import org.junit.Assert.assertEquals
          import org.junit.Assert.assertTrue
          import org.junit.Test

          class FastWindowPlannerTest {
              @Test fun shortSentenceUsesOneWindow() {
                  val r = FastWindowPlanner.ranges(8 * 16000)
                  assertEquals(1, r.size)
                  assertEquals(0, r[0].start)
                  assertEquals(8 * 16000, r[0].endExclusive)
              }

              @Test fun twelveSecondsUsesOverlapWithoutGap() {
                  val r = FastWindowPlanner.ranges(12 * 16000)
                  assertEquals(2, r.size)
                  assertEquals(0, r[0].start)
                  assertEquals(9 * 16000, r[0].endExclusive)
                  assertEquals(7 * 16000, r[1].start)
                  assertEquals(12 * 16000, r[1].endExclusive)
                  assertTrue(r[1].start < r[0].endExclusive)
              }

              @Test fun allWindowsAreBounded() {
                  val total = 30 * 16000
                  val r = FastWindowPlanner.ranges(total)
                  assertTrue(r.isNotEmpty())
                  assertEquals(0, r.first().start)
                  assertEquals(total, r.last().endExclusive)
                  assertTrue(r.all { it.endExclusive > it.start })
                  assertTrue(r.all { it.endExclusive - it.start <= 9 * 16000 })
              }
          }
