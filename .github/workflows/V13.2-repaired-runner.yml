name: Build V13.2 Repaired

on:
  push:
    paths:
      - '.github/workflows/V13.2-repaired-runner.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Run repaired V13.2 build steps
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os
          import re
          import subprocess
          import textwrap

          workflow = Path('.github/workflows/V13.2-final.yml')
          src = workflow.read_text(encoding='utf-8')

          old_fp = (
              '21:9b:74:c6:ce:62:e1:e2:bf:38:e4:b0:17:3b:91:0a:'
              '99:37:0e:2d:e3:03:29:63:99:eb:fd:c7:6c:5e:cd:40'
          )
          new_fp = '219b74c6ce62e1e2bf38e4b0173b910a99370e2de303296399ebfdc76c5ecd40'
          if old_fp in src:
              src = src.replace(old_fp, new_fp)
          elif new_fp not in src:
              raise SystemExit('Expected V13.2 signing fingerprint check was not found')

          step_matches = list(
              re.finditer(r'^      - name: (.+)$', src, flags=re.MULTILINE)
          )
          run_steps = []

          for idx, match in enumerate(step_matches):
              name = match.group(1).strip()
              start = match.start()
              end = (
                  step_matches[idx + 1].start()
                  if idx + 1 < len(step_matches)
                  else len(src)
              )
              block = src[start:end]
              marker = re.search(r'^        run: \|\n', block, flags=re.MULTILINE)
              if not marker:
                  continue

              script = textwrap.dedent(block[marker.end():]).rstrip() + '\n'
              run_steps.append((name, script))

          if len(run_steps) < 9:
              raise SystemExit(
                  f'Unexpected V13.2 structure: only {len(run_steps)} run steps found'
              )

          print(
              f'Executing {len(run_steps)} original V13.2 shell steps '
              'with repaired signature verification.'
          )

          for index, (name, script) in enumerate(run_steps, 1):
              print(
                  f'\n===== [{index}/{len(run_steps)}] {name} =====',
                  flush=True,
              )
              subprocess.run(
                  ['bash', '-c', 'set -euo pipefail\n' + script],
                  check=True,
                  env=os.environ.copy(),
              )

          apk = Path('dist/ArabicLiveInterpreter-V13.2-Mic-Diagnostic.apk')
          if not apk.is_file() or apk.stat().st_size <= 10_000_000:
              raise SystemExit('Repaired V13.2 APK was not produced correctly')

          print(
              f'REPAIRED V13.2 READY: {apk} '
              f'({apk.stat().st_size} bytes)'
          )
          PY

      - name: Upload repaired V13.2 APK
        uses: actions/upload-artifact@v4
        with:
          name: ArabicLiveInterpreter-V13.2-Mic-Diagnostic-APK
          path: |
            dist/ArabicLiveInterpreter-V13.2-Mic-Diagnostic.apk
            dist/SHA256.txt
            dist/SIGNATURE.txt
          if-no-files-found: error
          retention-days: 30
