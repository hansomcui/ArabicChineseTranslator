name: Build V13.2 Final Fixed V2

on:
  push:
    paths:
      - '.github/workflows/V13.2-final-fixed-runner-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Execute all original V13.2 build steps in correct order
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import os
          import re
          import subprocess
          import textwrap

          workflow = Path('.github/workflows/V13.2-final.yml')
          src = workflow.read_text(encoding='utf-8')

          old_fp = (
              '21:9b:74:c6:ce:62:e1:e2:bf:38:e4:b0:17:3b:91:0a:'
              '99:37:0e:2d:e3:03:29:63:99:eb:fd:c7:6c:5e:cd:40'
          )
          compact_fp = (
              '219b74c6ce62e1e2bf38e4b0173b910a'
              '99370e2de303296399ebfdc76c5ecd40'
          )
          src = src.replace(old_fp, compact_fp)

          # Fix false exit 141 caused by pipefail + grep -q closing early.
          old_verify = """          unzip -l \"$APK\" | grep -q 'lib/arm64-v8a/'
          unzip -l \"$APK\" | grep -q 'lib/arm64-v8a/libwhisper'
          unzip -l \"$APK\" | grep -q 'lib/arm64-v8a/libsherpa-onnx-jni.so'
"""
          new_verify = """          unzip -l \"$APK\" > /tmp/v132-list.txt
          grep -q 'lib/arm64-v8a/' /tmp/v132-list.txt
          grep -q 'lib/arm64-v8a/libwhisper' /tmp/v132-list.txt
          grep -q 'lib/arm64-v8a/libsherpa-onnx-jni.so' /tmp/v132-list.txt
"""
          if old_verify not in src:
              raise SystemExit('Verify APK round 1 block not found')
          src = src.replace(old_verify, new_verify, 1)

          matches = list(
              re.finditer(r'^      - name: (.+)$', src, flags=re.MULTILINE)
          )
          run_steps = []

          for idx, m in enumerate(matches):
              name = m.group(1).strip()
              start = m.start()
              end = matches[idx + 1].start() if idx + 1 < len(matches) else len(src)
              block = src[start:end]

              mm = re.search(r'^        run: \|\n', block, flags=re.MULTILINE)
              if mm:
                  script = textwrap.dedent(block[mm.end():]).rstrip() + '\n'
                  run_steps.append((name, script))
                  continue

              mi = re.search(r'^        run:\s+(.+)$', block, flags=re.MULTILINE)
              if mi:
                  script = mi.group(1).strip()
                  if (
                      len(script) >= 2
                      and script[0] == script[-1]
                      and script[0] in ("'", '"')
                  ):
                      script = script[1:-1]
                  run_steps.append((name, script + '\n'))

          expected = [
              'Install Android native toolchain',
              'Reuse proven V13.1 project generator',
              'Apply V13.1 transcript regex fixes',
              'Install V13.2 microphone diagnostic engine',
              'Give V13.2 a clean package and persistent test signature',
              'Add V13.2 regression tests',
              'Static acceptance checks',
              'Unit tests pass 1',
              'Unit tests pass 2 fresh',
              'Build signed V13.2 APK',
              'Verify APK round 1',
              'Verify APK round 2 and signing',
          ]

          names = [n for n, _ in run_steps]
          missing = [n for n in expected if n not in names]
          if missing:
              raise SystemExit('Missing original V13.2 run steps: ' + ', '.join(missing))

          selected = [(n, s) for n, s in run_steps if n in expected]
          if [n for n, _ in selected] != expected:
              raise SystemExit(
                  'V13.2 step order mismatch.\nFound: ' +
                  ' -> '.join(n for n, _ in selected)
              )

          print(f'Executing all {len(selected)} required V13.2 steps in original order.')

          for i, (name, script) in enumerate(selected, 1):
              print(f'\n===== [{i}/{len(selected)}] {name} =====', flush=True)
              subprocess.run(
                  ['bash', '-c', 'set -euo pipefail\n' + script],
                  check=True,
                  env=os.environ.copy(),
              )

          apk = Path('dist/ArabicLiveInterpreter-V13.2-Mic-Diagnostic.apk')
          sha = Path('dist/SHA256.txt')
          sig = Path('dist/SIGNATURE.txt')

          if not apk.is_file():
              raise SystemExit('Final V13.2 APK missing')
          if apk.stat().st_size <= 10_000_000:
              raise SystemExit(f'APK unexpectedly small: {apk.stat().st_size} bytes')
          if not sha.is_file():
              raise SystemExit('SHA256.txt missing')
          if not sig.is_file():
              raise SystemExit('SIGNATURE.txt missing')

          sig_text = sig.read_text(encoding='utf-8', errors='ignore').lower().replace(':', '')
          if compact_fp not in sig_text:
              raise SystemExit('Expected V13.2 signing certificate fingerprint missing')

          print(f'V13.2 FINAL APK READY: {apk} ({apk.stat().st_size} bytes)')
          PY

      - name: Upload final V13.2 APK
        uses: actions/upload-artifact@v4
        with:
          name: ArabicLiveInterpreter-V13.2-Final-APK
          path: |
            dist/ArabicLiveInterpreter-V13.2-Mic-Diagnostic.apk
            dist/SHA256.txt
            dist/SIGNATURE.txt
          if-no-files-found: error
          retention-days: 30
