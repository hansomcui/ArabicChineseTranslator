              private fun loadReferencePcm(): FloatArray {
                  val bytes = referenceFile.readBytes()
                  val n = bytes.size / 2
                  val out = FloatArray(n)
                  for (i in 0 until n) {
                      val lo = bytes[i * 2].toInt() and 0xff
                      val hi = bytes[i * 2 + 1].toInt()
                      val s = ((hi shl 8) or lo).toShort()
                      out[i] = s / 32768.0f
                  }
                  return out
              }

              private fun playBlocking(samples: FloatArray, sampleRate: Int) {
                  val minBuf = AudioTrack.getMinBufferSize(
                      sampleRate,
                      AudioFormat.CHANNEL_OUT_MONO,
                      AudioFormat.ENCODING_PCM_16BIT,
                  )
                  val track = AudioTrack.Builder()
                      .setAudioAttributes(
                          AudioAttributes.Builder()
                              .setUsage(AudioAttributes.USAGE_MEDIA)
                              .setContentType(AudioAttributes.CONTENT_TYPE_SPEECH)
                              .build(),
                      )
                      .setAudioFormat(
                          AudioFormat.Builder()
                              .setEncoding(AudioFormat.ENCODING_PCM_16BIT)
                              .setSampleRate(sampleRate)
                              .setChannelMask(AudioFormat.CHANNEL_OUT_MONO)
                              .build(),
                      )
                      .setBufferSizeInBytes(max(minBuf, 16384))
                      .setTransferMode(AudioTrack.MODE_STREAM)
                      .build()

                  try {
                      track.play()
                      val chunk = ShortArray(4096)
                      var offset = 0
                      while (offset < samples.size) {
                          val n = minOf(chunk.size, samples.size - offset)
                          for (i in 0 until n) {
                              val x = samples[offset + i].coerceIn(-1.0f, 1.0f)
                              chunk[i] = (x * 32767.0f).toInt().toShort()
                          }
                          var written = 0
                          while (written < n) {
                              val w = track.write(chunk, written, n - written, AudioTrack.WRITE_BLOCKING)
                              if (w <= 0) throw IllegalStateException("音频播放失败：$w")
                              written += w
                          }
                          offset += n
                      }

                      val targetFrames = samples.size.toLong()
                      val durationMs = (targetFrames * 1000L / sampleRate).coerceAtLeast(500L)
                      val deadline = System.currentTimeMillis() + durationMs + 3000L
                      while (System.currentTimeMillis() < deadline) {
                          val played = track.playbackHeadPosition.toLong() and 0xffffffffL
                          if (played >= targetFrames - 256) break
                          Thread.sleep(25)
                      }
                  } finally {
                      runCatching { track.stop() }
                      runCatching { track.release() }
                  }
              }

              private fun downloadFile(url: String, target: File, label: String) {
                  target.parentFile?.mkdirs()
                  val part = File(target.absolutePath + ".part")
                  part.delete()
                  val conn = openFollowingRedirects(url)
                  try {
                      val total = conn.contentLengthLong
                      conn.inputStream.use { input ->
                          FileOutputStream(part).use { output ->
                              val buf = ByteArray(128 * 1024)
                              var done = 0L
                              var lastUi = 0L
                              while (true) {
                                  val n = input.read(buf)
                                  if (n < 0) break
                                  output.write(buf, 0, n)
                                  done += n
                                  val now = System.currentTimeMillis()
                                  if (now - lastUi > 700) {
                                      lastUi = now
                                      val mb = done / 1024.0 / 1024.0
                                      if (total > 0) {
                                          val pct = (done * 100 / total).coerceIn(0, 100)
                                          status("⬇ $label 下载中：$pct% · ${"%.1f".format(mb)} MB")
                                      } else {
                                          status("⬇ $label 下载中：${"%.1f".format(mb)} MB")
                                      }
                                  }
                              }
                              output.flush()
                          }
                      }
                      if (part.length() < 1024) throw IllegalStateException("下载文件异常")
                      if (target.exists()) target.delete()
                      if (!part.renameTo(target)) {
                          part.copyTo(target, overwrite = true)
                          part.delete()
                      }
                  } finally {
                      conn.disconnect()
                  }
              }

              private fun openFollowingRedirects(urlText: String): HttpURLConnection {
                  var current = urlText
                  repeat(8) {
                      val c = (URL(current).openConnection() as HttpURLConnection).apply {
                          instanceFollowRedirects = false
                          connectTimeout = 15000
                          readTimeout = 120000
                          requestMethod = "GET"
                          setRequestProperty("User-Agent", "ArabicChineseTranslator-V12/1.0")
                          setRequestProperty("Accept", "*/*")
                      }
                      val code = c.responseCode
                      if (code in 200..299) return c
                      if (code in listOf(301, 302, 303, 307, 308)) {
                          val location = c.getHeaderField("Location") ?: error("下载重定向缺少地址")
                          c.disconnect()
                          current = URL(URL(current), location).toString()
                      } else {
                          val msg = runCatching { c.errorStream?.bufferedReader()?.readText() }.getOrNull()
                          c.disconnect()
                          error("下载失败 HTTP $code ${msg.orEmpty().take(80)}")
                      }
                  }
                  error("下载重定向次数过多")
              }

              private fun extractTarBz2(archive: File, destination: File) {
                  val baseCanonical = destination.canonicalFile
                  BZip2CompressorInputStream(BufferedInputStream(FileInputStream(archive))).use { bz ->
                      TarArchiveInputStream(bz).use { tar ->
                          var entry = tar.nextTarEntry
                          while (entry != null) {
                              val out = File(destination, entry.name)
                              val outCanonical = out.canonicalFile
                              if (!outCanonical.path.startsWith(baseCanonical.path + File.separator)) {
                                  throw SecurityException("非法模型压缩包路径")
                              }
                              if (entry.isDirectory) {
                                  outCanonical.mkdirs()
                              } else if (entry.isSymbolicLink || entry.isLink) {
                                  // Upstream model bundles are regular files/directories; ignore links defensively.
                              } else {
                                  outCanonical.parentFile?.mkdirs()
                                  FileOutputStream(outCanonical).use { output -> tar.copyTo(output) }
                              }
                              entry = tar.nextTarEntry
                          }
                      }
                  }
              }

              fun release() {
                  stopReferenceRecording()
                  setReady(false)
                  val engine = tts
                  tts = null
                  runCatching { engine?.release() }
              }

              private fun status(text: String) {
                  main.post { listener.onStatus(text) }
              }

              private fun setReady(value: Boolean) {
                  ready = value
                  main.post { listener.onReadyChanged(value) }
              }

              private fun notifyRecording(value: Boolean) {
                  main.post { listener.onRecordingChanged(value) }
              }

              private fun notifySpeakDone(text: String, success: Boolean, message: String) {
                  main.post { listener.onSpeakDone(text, success, message) }
              }

              private fun shortMessage(t: Throwable): String =
                  (t.message ?: t::class.java.simpleName).replace('\n', ' ').take(120)
          }
          EOF

