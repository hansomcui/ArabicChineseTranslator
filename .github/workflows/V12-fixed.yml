          j = Path('app/src/main/java/com/hansom/arzhv12/MainActivity.java').read_text(encoding='utf-8')
          k = Path('app/src/main/java/com/hansom/arzhv12/LocalZipVoiceEngine.kt').read_text(encoding='utf-8')
          g = Path('app/build.gradle').read_text(encoding='utf-8')
          checks = {
              'V12 All-in-One': 'V12 · All-in-One' in j,
              'No ElevenLabs': 'elevenlabs' not in (j+k).lower(),
              'No HayaiTTS runtime package': 'dev.ahmedmohamed.hayaitts' not in (j+k).lower(),
              'ZipVoice model URL': 'zipvoice-distill-int8-zh-en-emilia.tar.bz2' in k,
              'Vocoder bundled candidate': 'vocos_24khz.onnx' in k and 'vocoderInModel' in k,
              'sherpa OfflineTts': 'OfflineTts' in k,
              'GenerationConfig cloning': 'referenceAudio' in k and 'referenceText' in k,
              'Local mic reference': 'AudioRecord' in k,
              'Local playback': 'AudioTrack' in k,
              'In-app extraction': 'BZip2CompressorInputStream' in k and 'TarArchiveInputStream' in k,
              'System TTS fallback': 'systemTts' in j,
              'Kuwait Arabic': '"ar-KW"' in j,
              'Online translation': 'translate.googleapis.com' in j,
              'MLKit fallback': 'translator.translate(ar)' in j,
              'Kotlin plugin': 'org.jetbrains.kotlin.android' in g,
              'sherpa AAR': "sherpa-onnx-1.13.2.aar" in g,
          }
          bad=[]
          for name, ok in checks.items():
              print(('PASS ' if ok else 'FAIL ') + name)
              if not ok: bad.append(name)
          if bad:
              raise SystemExit('Sanity checks failed: ' + ', '.join(bad))
          PY

      - name: Build APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk ArabicChineseTranslator-V12-All-in-One.apk

      - name: Verify APK
        shell: bash
        run: |
          test -s ArabicChineseTranslator-V12-All-in-One.apk
          unzip -l ArabicChineseTranslator-V12-All-in-One.apk | grep -q 'classes.dex'
          unzip -l ArabicChineseTranslator-V12-All-in-One.apk | grep -q 'lib/arm64-v8a/'
          ls -lh ArabicChineseTranslator-V12-All-in-One.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ArabicChineseTranslator-V12-All-in-One-APK
          path: ArabicChineseTranslator-V12-All-in-One.apk
