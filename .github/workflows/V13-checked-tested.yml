              private class FloatAccumulator(initialCapacity: Int) {
                  private var a = FloatArray(max(1024, initialCapacity))
                  var size: Int = 0
                      private set
          
                  fun clear() { size = 0 }
          
                  fun append(values: FloatArray) {
                      ensure(size + values.size)
                      values.copyInto(a, size)
                      size += values.size
                  }
          
