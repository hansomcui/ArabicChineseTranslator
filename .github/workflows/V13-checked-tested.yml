                      gravity = Gravity.CENTER
                      setTypeface(null, 1)
                  })
          
                  root.addView(TextView(this).apply {
                      text = "海湾/科威特 · 埃及 · 伊拉克 · 黎凡特 | 方言 ASR + 即时中文朗读"
                      textSize = 13.5f
                      gravity = Gravity.CENTER
                      setPadding(0, dp(8), 0, dp(12))
                  })
          
                  pipelineStatus = TextView(this).apply {
                      text = "● 正在检查方言识别模型"
                      textSize = 15f
                      gravity = Gravity.CENTER
                      setPadding(0, dp(6), 0, dp(10))
                  }
                  root.addView(pipelineStatus)
          
                  asrModelBtn = Button(this).apply {
                      text = "① 下载阿语方言识别模型（首次约 474 MB）"
                      isAllCaps = false
                      setOnClickListener { asr.ensureModel() }
                  }
                  root.addView(asrModelBtn)
          
                  startBtn = Button(this).apply {
                      text = "🎙 开始方言同传"
                      textSize = 20f
                      isAllCaps = false
                      isEnabled = false
                      setOnClickListener {
                          if (asr.isListening()) asr.stop() else {
                              if (checkSelfPermission(Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                                  requestPermissions(arrayOf(Manifest.permission.RECORD_AUDIO), 1301)
                              } else if (!asr.isReady()) {
                                  Toast.makeText(this@MainActivity, "请先等待方言模型加载完成", Toast.LENGTH_SHORT).show()
                                  asr.initializeIfPossible()
                              } else {
                                  asr.start()
                              }
                          }
                      }
                  }
                  root.addView(startBtn)
          
                  dialectStatus = TextView(this).apply {
                      text = "当前判断：等待语音"
                      textSize = 14f
                      setPadding(dp(4), dp(10), dp(4), dp(8))
                  }
                  root.addView(dialectStatus)
          
                  voiceStatus = TextView(this).apply {
                      text = "🔊 正在检查本人音色…"
                      textSize = 14f
                      setPadding(dp(4), dp(8), dp(4), dp(6))
                  }
                  root.addView(voiceStatus)
          
                  voiceModelBtn = Button(this).apply {
                      text = "下载本人音色模型（首次）"
                      isAllCaps = false
                      setOnClickListener { localVoice.ensureModel() }
                  }
                  root.addView(voiceModelBtn)
          
                  root.addView(TextView(this).apply {
                      text = "本人音色录音请完整朗读：\n“${LocalZipVoiceEngine.VOICE_PROMPT}”"
                      textSize = 13f
                      setTextColor(Color.DKGRAY)
                      setPadding(dp(4), dp(8), dp(4), dp(6))
                  })
          
                  recordVoiceBtn = Button(this).apply {
                      text = "录制我的声音（8–12 秒）"
                      isAllCaps = false
                      setOnClickListener { toggleVoiceRecording() }
                  }
                  root.addView(recordVoiceBtn)
          
                  autoSpeakBtn = Button(this).apply {
                      isAllCaps = false
                      text = if (autoSpeak) "🔊 中文即时朗读：开" else "🔇 中文即时朗读：关"
                      setOnClickListener {
                          autoSpeak = !autoSpeak
                          getSharedPreferences("v13", MODE_PRIVATE)
                              .edit().putBoolean("auto_speak", autoSpeak).apply()
                          updateAutoSpeakLabel()
                      }
                  }
                  root.addView(autoSpeakBtn)
          
                  root.addView(Button(this).apply {
                      text = "测试本人声音"
                      isAllCaps = false
                      setOnClickListener {
                          enqueueSpeechText("你好，这是 V13 方言实时同传测试。中文稳定以后会立即用我的声音朗读。")
                      }
                  })
          
                  root.addView(sectionLabel("方言原文（实时）"))
                  rawText = textBox("等待对方说阿拉伯语……", rtl = true)
                  root.addView(rawText)
          
                  root.addView(sectionLabel("标准阿拉伯语 MSA"))
                  msaText = textBox("方言会在这里被规范成标准阿拉伯语（MSA）。", rtl = true)
                  root.addView(msaText)
          
                  root.addView(sectionLabel("中文翻译（稳定片段即时朗读）"))
                  zhText = textBox("中文稳定片段会立即显示并朗读。", rtl = false)
                  root.addView(zhText)
          
                  root.addView(Button(this).apply {
                      text = "清空屏幕"
                      isAllCaps = false
                      setOnClickListener { clearAll() }
                  })
          
                  setContentView(scroll)
              }
          
              private fun sectionLabel(s: String) = TextView(this).apply {
                  text = s
                  textSize = 16f
                  setTypeface(null, 1)
                  setPadding(0, dp(18), 0, dp(6))
              }
          
              private fun textBox(initial: String, rtl: Boolean) = TextView(this).apply {
                  text = initial
                  textSize = 19f
                  setPadding(dp(14), dp(14), dp(14), dp(14))
                  setBackgroundColor(Color.WHITE)
                  minHeight = dp(125)
                  gravity = if (rtl) Gravity.RIGHT else Gravity.LEFT
                  setTextIsSelectable(true)
              }
          
              private fun updateAutoSpeakLabel() {
                  if (::autoSpeakBtn.isInitialized) {
                      autoSpeakBtn.text = if (autoSpeak) {
                          "🔊 中文即时朗读：开"
                      } else {
                          "🔇 中文即时朗读：关"
                      }
                  }
              }
          
              private fun dp(v: Int): Int = (v * resources.displayMetrics.density + 0.5f).toInt()
          
              override fun onRequestPermissionsResult(
                  requestCode: Int,
                  permissions: Array<out String>,
                  grantResults: IntArray,
              ) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults)
                  if (requestCode == 1301 && (grantResults.isEmpty() || grantResults[0] != PackageManager.PERMISSION_GRANTED)) {
                      pipelineStatus.text = "⚠ 没有麦克风权限，无法进行方言同传"
                  }
              }
          
              override fun onResume() {
                  super.onResume()
                  if (::asr.isInitialized) asr.initializeIfPossible()
                  if (::localVoice.isInitialized) localVoice.initializeIfPossible()
              }
          
              override fun onDestroy() {
                  runCatching { if (::asr.isInitialized) asr.release() }
                  runCatching { if (::translator.isInitialized) translator.close() }
                  runCatching { if (::localVoice.isInitialized) localVoice.release() }
                  runCatching {
                      systemTts?.stop()
                      systemTts?.shutdown()
                  }
                  super.onDestroy()
              }
          }
          EOF

          mkdir -p app/src/test/java/com/hansom/arzhv13
          cat > app/src/test/java/com/hansom/arzhv13/ArabicDialectNormalizerTest.kt <<'EOF'
          package com.hansom.arzhv13

          import org.junit.Assert.assertEquals
          import org.junit.Assert.assertFalse
          import org.junit.Assert.assertTrue
          import org.junit.Test

          class ArabicDialectNormalizerTest {
              @Test fun gulfToMsaKeepsWordBoundaries() {
                  val r = ArabicDialectNormalizer.normalize("أبي أعرف شكثر السعر الحين")
                  assertEquals("أريد أعرف كم السعر الآن", r.msa)
                  assertTrue(r.dialect.contains("海湾"))
                  assertFalse(r.msa.contains("أريدأعرف"))
              }

              @Test fun egyptianPrefixedWordsNormalize() {
                  val r = ArabicDialectNormalizer.normalize("عايز أعرف السعر دلوقتي ومفيش وقت")
                  assertEquals("أريد أعرف السعر الآن ولا يوجد وقت", r.msa)
                  assertTrue(r.dialect.contains("埃及"))
              }

              @Test fun iraqiAndLevantKeywordsNormalize() {
                  assertEquals("الآن لا يوجد وقت", ArabicDialectNormalizer.normalize("هسه ماكو وقت").msa)
                  assertEquals("أريد أعرف أين جهاز الحفر الآن", ArabicDialectNormalizer.normalize("بدي أعرف وين الريج هلق").msa)
              }
          }
          EOF

      - name: Static architecture checks
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          a = Path('app/src/main/java/com/hansom/arzhv13/DialectAsrEngine.kt').read_text()
          n = Path('app/src/main/java/com/hansom/arzhv13/ArabicDialectNormalizer.kt').read_text()
          m = Path('app/src/main/java/com/hansom/arzhv13/MainActivity.kt').read_text()
          v = Path('app/src/main/java/com/hansom/arzhv13/LocalZipVoiceEngine.kt').read_text()
          jni = Path('vendor/whisper.cpp/examples/whisper.android.java/app/src/main/jni/whisper/jni.c').read_text()
          g = Path('app/build.gradle').read_text()

          checks = {
              'V13 UI': 'V13 · Live Interpreter' in m,
              'No Android SpeechRecognizer': 'SpeechRecognizer' not in (a + m),
              'Dialect Whisper model': 'whisper-large-v3-turbo-arabic-dialectal-v2' in a and 'ggml-model-q4_k.bin' in a,
              'Whisper Arabic mode': 'params.language = "ar";' in jni,
              'Whisper optimized native': 'CMAKE_BUILD_TYPE=Release' in g,
              'arm64 only': "abiFilters 'arm64-v8a'" in g,
              'Noise suppression': 'NoiseSuppressor' in a,
              'Echo cancellation': 'AcousticEchoCanceler' in a,
              'Auto gain control': 'AutomaticGainControl' in a,
              'Pre-roll capture': 'PREROLL_MS' in a and 'ShortRing' in a,
              'Partial correction': 'commonPrefix' in a and 'onStable' in a,
              'Gulf normalization': '"شنو"' in n and '"الحين"' in n and '"وايد"' in n,
              'MSA preserves spaces': 'joinToString(" ")' in n and 'tokenForms' in n,
              'Egyptian normalization': '"عايز"' in n and '"دلوقتي"' in n and '"مفيش"' in n,
              'Iraqi normalization': '"ماكو"' in n and '"هواية"' in n,
              'Levant normalization': '"بدي"' in n and '"هلق"' in n,
              'MSA display': '标准阿拉伯语 MSA' in m,
              'Immediate speech': 'flushStableForTranslation' in m and 'enqueueSpeechText' in m,
              'Auto speech defaults on': 'private var autoSpeak = true' in m,
              'ML Kit fallback': 'translator.translate(job.msa)' in m,
              'Local ZipVoice': 'OfflineTtsZipVoiceModelConfig' in v and 'referenceAudio' in v,
              'No paid voice API': 'elevenlabs' not in (m + v + a).lower(),
          }
          bad = []
          for name, ok in checks.items():
              print(('PASS ' if ok else 'FAIL ') + name)
              if not ok: bad.append(name)
          if bad:
              raise SystemExit('V13 sanity checks failed: ' + ', '.join(bad))
          PY

      - name: Unit test + Build V13 APK
        run: gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk ArabicLiveInterpreter-V13.apk

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          test -s ArabicLiveInterpreter-V13.apk
          unzip -t ArabicLiveInterpreter-V13.apk >/dev/null
          unzip -l ArabicLiveInterpreter-V13.apk | grep -q 'classes.dex'
          unzip -l ArabicLiveInterpreter-V13.apk | grep -q 'lib/arm64-v8a/'
          unzip -l ArabicLiveInterpreter-V13.apk | grep -q 'lib/arm64-v8a/libwhisper'
          unzip -l ArabicLiveInterpreter-V13.apk | grep -q 'lib/arm64-v8a/libsherpa-onnx-jni.so'
          if unzip -l ArabicLiveInterpreter-V13.apk | grep -q 'lib/armeabi-v7a/'; then
            echo "Unexpected 32-bit ABI in arm64-only build" >&2
            exit 1
          fi
          ls -lh ArabicLiveInterpreter-V13.apk
          sha256sum ArabicLiveInterpreter-V13.apk

      - name: Upload V13 APK
        uses: actions/upload-artifact@v4
        with:
          name: ArabicLiveInterpreter-V13-APK
          path: ArabicLiveInterpreter-V13.apk
          retention-days: 90
          compression-level: 6
