              private fun notifyRecording(value: Boolean) {
                  main.post { listener.onRecordingChanged(value) }
              }
          
              private fun notifySpeakDone(text: String, success: Boolean, message: String) {
                  main.post { listener.onSpeakDone(text, success, message) }
              }
          
              private fun shortMessage(t: Throwable): String =
                  (t.message ?: t::class.java.simpleName).replace('\n', ' ').take(120)
          }
