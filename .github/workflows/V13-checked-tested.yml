name: Build Arabic Live Interpreter V13 Checked

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Install Android native toolchain
        shell: bash
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;25.2.9519653" "cmake;3.22.1"

      - name: Fetch Whisper and sherpa runtimes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p vendor app/libs app/src/main/java/com/hansom/arzhv13 app/src/main/java/com/whispercpp/java/whisper app/src/main/res/values

          git init vendor/whisper.cpp
          git -C vendor/whisper.cpp remote add origin https://github.com/ggml-org/whisper.cpp.git
          git -C vendor/whisper.cpp fetch --depth 1 origin 1d549b3cecc2d98d76d4ddc2edca0d1512f5d7a0
          git -C vendor/whisper.cpp checkout --detach FETCH_HEAD

          python3 - <<'PY'
          from pathlib import Path
          p = Path("vendor/whisper.cpp/examples/whisper.android.java/app/src/main/jni/whisper/jni.c")
          s = p.read_text()
          s = s.replace('params.print_realtime = true;', 'params.print_realtime = false;')
          s = s.replace('params.print_timestamps = true;', 'params.print_timestamps = false;')
          s = s.replace('params.language = "en";', 'params.language = "ar";')
          s = s.replace('params.single_segment = false;', 'params.single_segment = true;')
          p.write_text(s)

          c = Path("vendor/whisper.cpp/examples/whisper.android.java/app/src/main/jni/whisper/CMakeLists.txt")
          cs = c.read_text()
          # Keep native Whisper optimized even though we package an installable debug APK.
          cs = cs.replace('if (NOT ${CMAKE_BUILD_TYPE} STREQUAL "Debug")', 'if (TRUE)')
          c.write_text(cs)
          PY

          cp vendor/whisper.cpp/examples/whisper.android.java/app/src/main/java/com/whispercpp/java/whisper/WhisperLib.java              app/src/main/java/com/whispercpp/java/whisper/WhisperLib.java
          cp vendor/whisper.cpp/examples/whisper.android.java/app/src/main/java/com/whispercpp/java/whisper/WhisperUtils.java              app/src/main/java/com/whispercpp/java/whisper/WhisperUtils.java

          echo "Downloading sherpa-onnx runtime for local cloned voice..."
          curl -L --fail --retry 4 --retry-delay 2             -o app/libs/sherpa-onnx-1.13.2.aar             https://raw.githubusercontent.com/HayaiApp/HayaiTTS/v2.5.1/app/libs/sherpa-onnx-1.13.2.aar
          test $(stat -c%s app/libs/sherpa-onnx-1.13.2.aar) -gt 50000000

      - name: Generate Android project
        shell: bash
        run: |
          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = 'ArabicLiveInterpreterV13'
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.24' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          android.suppressUnsupportedCompileSdk=35
          org.gradle.jvmargs=-Xmx5g -Dfile.encoding=UTF-8
          kotlin.code.style=official
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          
          android {
              namespace 'com.hansom.arzhv13'
              compileSdk 35
              ndkVersion '25.2.9519653'
          
              defaultConfig {
                  applicationId 'com.hansom.arzhv13'
                  minSdk 26
                  targetSdk 35
                  versionCode 130
                  versionName '13.0'
          
                  ndk {
                      abiFilters 'arm64-v8a'
                  }
              }
          
              buildTypes {
                  debug {
                      externalNativeBuild {
                          cmake {
                              arguments '-DCMAKE_BUILD_TYPE=Release'
                          }
                      }
                  }
              }
          
              externalNativeBuild {
                  cmake {
                      path file('../vendor/whisper.cpp/examples/whisper.android.java/app/src/main/jni/whisper/CMakeLists.txt')
                      version '3.22.1'
                  }
              }
          
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }
          
          dependencies {
              implementation 'androidx.annotation:annotation:1.8.2'
              implementation 'com.google.mlkit:translate:17.0.3'
              implementation 'org.apache.commons:commons-compress:1.27.1'
              implementation files('libs/sherpa-onnx-1.13.2.aar')
              testImplementation 'junit:junit:4.13.2'
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.INTERNET" />
          
              <application
                  android:allowBackup="true"
                  android:label="阿语方言同传 V13"
                  android:theme="@style/AppTheme">
                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="portrait"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#C62828</item>
                  <item name="android:navigationBarColor">#111111</item>
                  <item name="android:statusBarColor">#111111</item>
                  <item name="android:windowLightStatusBar">false</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/java/com/hansom/arzhv13/ArabicDialectNormalizer.kt <<'EOF'
          package com.hansom.arzhv13
          
          object ArabicDialectNormalizer {
              data class Result(
                  val raw: String,
                  val msa: String,
                  val dialect: String,
              )
          
              private val gulf = setOf(
                  "ابي","أبي","ودي","نبي","تبي","تبين","شنو","وش","ايش","إيش","شلون","ليش",
                  "الحين","هالحين","وايد","جذي","شكثر","هني","هنيه","دز","دزلي","مب","مو","ابغى","أبغى"
              )
              private val egypt = setOf(
                  "عايز","عاوز","عايزة","عاوزه","ازاي","إزاي","ليه","دلوقتي","كده","مش","مفيش",
                  "احنا","إحنا","انتوا","إنتوا","لسه","بكره","امبارح","أوي","اوي","بتاع","بتاعة"
              )
              private val iraqi = setOf(
                  "هسه","هسع","هواية","أكو","اكو","ماكو","شلون","شنو","ليش","يمعود","زين"
              )
              private val levant = setOf(
                  "بدي","شو","هلق","هلأ","كتير","ليش","مو","لسا","لسه","مافي","وين"
              )
          
              private val wordMap = linkedMapOf(
                  // Gulf / Kuwait / Saudi
                  "ابي" to "أريد", "أبي" to "أريد", "ابغي" to "أريد", "أبغي" to "أريد",
                  "ابغى" to "أريد", "أبغى" to "أريد", "ودي" to "أريد",
                  "نبي" to "نريد", "تبي" to "تريد", "تبين" to "تريدين",
                  "شنو" to "ما", "وش" to "ما", "ايش" to "ما", "إيش" to "ما",
                  "شلون" to "كيف", "ليش" to "لماذا",
                  "الحين" to "الآن", "هالحين" to "الآن", "هسه" to "الآن", "هسع" to "الآن",
                  "وايد" to "كثيراً", "هواية" to "كثيراً", "كتير" to "كثيراً",
                  "جذي" to "هكذا", "كده" to "هكذا",
                  "شكثر" to "كم", "هني" to "هنا", "هنيه" to "هنا",
                  "دز" to "أرسل", "دزلي" to "أرسل لي",
                  "مو" to "ليس", "مب" to "ليس",
                  "أكو" to "يوجد", "اكو" to "يوجد", "ماكو" to "لا يوجد",
                  // Oilfield/business words often arrive with the Arabic definite article attached.
                  "ريج" to "جهاز الحفر", "الريج" to "جهاز الحفر",
                  "تندر" to "مناقصة", "التندر" to "مناقصة",
                  "كوتيشن" to "عرض سعر", "الكوتيشن" to "عرض سعر",
                  // Egyptian
                  "عايز" to "أريد", "عاوز" to "أريد", "عايزة" to "أريد", "عاوزه" to "أريد",
                  "ازاي" to "كيف", "إزاي" to "كيف", "دلوقتي" to "الآن",
                  "مش" to "ليس", "مفيش" to "لا يوجد",
                  "احنا" to "نحن", "إحنا" to "نحن", "انتوا" to "أنتم", "إنتوا" to "أنتم",
                  "لسه" to "ما زال", "لسا" to "ما زال",
                  "بكره" to "غداً", "بكرة" to "غداً", "امبارح" to "أمس", "إمبارح" to "أمس",
                  "أوي" to "جداً", "اوي" to "جداً",
                  // Levant
                  "بدي" to "أريد", "شو" to "ما", "هلق" to "الآن", "هلأ" to "الآن",
                  "وين" to "أين",
              )
          
              private val phraseMap = listOf(
                  Regex("""(?i)\b(k\s*o\s*c|koc)\b""") to " KOC ",
                  Regex("""كي\s*أو\s*سي|كي\s*او\s*سي|كيو\s*او\s*سي""") to " KOC ",
                  Regex("""كويل\s*(تيوبنج|تيوبينج|تيوبنغ|تيوبينغ)""") to " الأنابيب الملفوفة ",
                  Regex("""مود\s*بمب|مد\s*بمب""") to " مضخة الطين ",
                  Regex("""بي\s*او\s*بي|بي\s*أو\s*بي""") to " مانع الانفجار ",
                  Regex("""ويل\s*هيد""") to " رأس البئر ",
                  Regex("""\bريج\b""") to " جهاز الحفر ",
                  Regex("""تندر""") to " مناقصة ",
                  Regex("""كوتيشن|كوتيشن""") to " عرض سعر ",
                  Regex("""ما\s*فيش|مافيش|ما\s*في""") to " لا يوجد ",
              )
          
              fun normalize(input: String): Result {
                  val raw = cleanSpaces(input)
                  if (raw.isBlank()) return Result("", "", "—")
                  val dialect = detect(raw)
          
                  var s = raw
                  for ((r, replacement) in phraseMap) {
                      s = r.replace(s, replacement)
                  }
          
                  val pieces = s.split(Regex("""\s+""")).filter { it.isNotBlank() }
                  s = pieces.joinToString(" ") { mapTokenPreservingPunctuation(it) }
                  s = cleanSpaces(s)
                  s = repairCommonGrammar(s)
                  return Result(raw, s, dialect)
              }
          
              fun detect(input: String): String {
                  val tokens = tokenize(input)
                  var g = 0
                  var e = 0
                  var i = 0
                  var l = 0
                  for (t in tokens) {
                      val forms = tokenForms(t)
                      if (forms.any { it in gulf }) g++
                      if (forms.any { it in egypt }) e++
                      if (forms.any { it in iraqi }) i++
                      if (forms.any { it in levant }) l++
                  }
                  return when (maxOf(g, e, i, l)) {
                      0 -> "عربي / 阿拉伯语"
                      g -> "خليجي/كويتي · 海湾/科威特"
                      e -> "مصري · 埃及"
                      i -> "عراقي · 伊拉克"
                      else -> "شامي · 黎凡特"
                  }
              }
          
              private fun repairCommonGrammar(s0: String): String {
                  var s = s0
                  s = s.replace(Regex("""\bليس\s+فيه\b"""), "لا يوجد")
                  s = s.replace(Regex("""\bما\s+هو\s+السعر\b"""), "ما هو السعر")
                  s = s.replace(Regex("""\s+"""), " ").trim()
                  return s
              }
          
              private fun mapTokenPreservingPunctuation(token: String): String {
                  val m = Regex("""^([^\p{L}\p{N}]*)([\p{L}\p{N}_-]+)([^\p{L}\p{N}]*)$""").find(token)
                      ?: return token
                  val pre = m.groupValues[1]
                  val core = m.groupValues[2]
                  val post = m.groupValues[3]
                  val mapped = wordMap[core] ?: run {
                      val prefix = core.firstOrNull()?.toString().orEmpty()
                      if (prefix == "و" || prefix == "ف") {
                          val rest = core.drop(1)
                          wordMap[rest]?.let { prefix + it } ?: core
                      } else core
                  }
                  return pre + mapped + post
              }
          
              private fun tokenForms(token: String): List<String> {
                  val out = arrayListOf(token)
                  if (token.length > 1 && (token.startsWith("و") || token.startsWith("ف"))) {
                      out.add(token.drop(1))
                  }
                  return out
              }
          
              private fun tokenize(s: String): List<String> =
                  s.replace(Regex("""[^\p{L}\p{N}]+"""), " ")
                      .trim()
                      .split(Regex("""\s+"""))
                      .filter { it.isNotBlank() }
          
              private fun cleanSpaces(s: String): String =
                  s.replace(Regex("""\s+"""), " ").trim()
          }
          EOF

          cat > app/src/main/java/com/hansom/arzhv13/DialectAsrEngine.kt <<'EOF'
          package com.hansom.arzhv13
          
          import android.Manifest
          import android.content.Context
          import android.content.pm.PackageManager
          import android.media.AudioFormat
          import android.media.AudioRecord
          import android.media.MediaRecorder
          import android.media.audiofx.AcousticEchoCanceler
          import android.media.audiofx.AutomaticGainControl
          import android.media.audiofx.NoiseSuppressor
          import android.os.Handler
          import android.os.Looper
          import com.whispercpp.java.whisper.WhisperLib
          import java.io.File
          import java.io.FileOutputStream
          import java.net.HttpURLConnection
          import java.net.URL
          import java.util.concurrent.Executors
          import java.util.concurrent.atomic.AtomicBoolean
          import kotlin.concurrent.thread
          import kotlin.math.max
          import kotlin.math.sqrt
          
          class DialectAsrEngine(
              private val context: Context,
              private val listener: Listener,
          ) {
              interface Listener {
                  fun onStatus(text: String)
                  fun onModelReady(ready: Boolean)
                  fun onListeningChanged(listening: Boolean)
                  fun onPartial(text: String)
                  fun onStable(text: String)
                  fun onFinal(text: String)
              }
          
              companion object {
                  private const val SAMPLE_RATE = 16000
                  private const val MODEL_FILE = "ggml-model-q4_k.bin"
                  private const val MODEL_URL =
                      "https://huggingface.co/dmouayad/whisper-large-v3-turbo-arabic-dialectal-v2-gguf/resolve/main/ggml-model-q4_k.bin?download=true"
                  private const val MIN_MODEL_BYTES = 430_000_000L
          
                  // Conferencing-style segmentation: preserve short pauses, but do not wait for a whole paragraph.
                  private const val END_SILENCE_MS = 780
                  private const val MAX_UTTERANCE_MS = 9000
                  private const val MIN_UTTERANCE_MS = 320
                  private const val PARTIAL_EVERY_MS = 1900L
                  private const val PARTIAL_MIN_MS = 1100
                  private const val PREROLL_MS = 420
              }
          
              private val main = Handler(Looper.getMainLooper())
              private val modelDir = File(context.filesDir, "v13_dialect_asr")
              private val modelFile = File(modelDir, MODEL_FILE)
              private val modelBusy = AtomicBoolean(false)
              private val initBusy = AtomicBoolean(false)
              private val listening = AtomicBoolean(false)
              private val partialBusy = AtomicBoolean(false)
              private val decodeExecutor = Executors.newSingleThreadExecutor()
          
              @Volatile private var contextPtr = 0L
              @Volatile private var recorder: AudioRecord? = null
              @Volatile private var captureThread: Thread? = null
              @Volatile private var noiseSuppressor: NoiseSuppressor? = null
              @Volatile private var echoCanceler: AcousticEchoCanceler? = null
              @Volatile private var gainControl: AutomaticGainControl? = null
          
              // Accessed only by the single decode executor.
              private var previousPartialWords: List<String> = emptyList()
              private var committedWords = 0
          
              fun isModelReady(): Boolean = modelFile.isFile && modelFile.length() >= MIN_MODEL_BYTES
              fun isReady(): Boolean = isModelReady() && contextPtr != 0L
              fun isListening(): Boolean = listening.get()
          
              fun initializeIfPossible() {
                  if (!isModelReady()) {
                      notifyModelReady(false)
                      status("🧠 方言识别模型未下载 · 首次约 474 MB")
                      return
                  }
                  if (contextPtr != 0L) {
                      notifyModelReady(true)
                      status("✅ 海湾/科威特/埃及等阿语方言识别已就绪")
                      return
                  }
                  if (!initBusy.compareAndSet(false, true)) return
                  status("● 正在加载阿语方言识别模型…")
                  thread(name = "v13-asr-init") {
                      try {
                          val p = WhisperLib.initContext(modelFile.absolutePath)
                          if (p == 0L) throw IllegalStateException("Whisper 模型加载失败")
                          contextPtr = p
                          notifyModelReady(true)
                          status("✅ 方言 ASR 已就绪 · Gulf/Kuwait/Egypt/Iraq/Levant")
                      } catch (t: Throwable) {
                          contextPtr = 0L
                          notifyModelReady(false)
                          status("❌ 方言模型加载失败：${shortMessage(t)}")
                      } finally {
                          initBusy.set(false)
                      }
                  }
              }
          
              fun ensureModel() {
                  if (isModelReady()) {
                      status("✅ 方言识别模型已下载，正在加载…")
                      initializeIfPossible()
                      return
                  }
                  if (!modelBusy.compareAndSet(false, true)) {
                      status("● 方言模型正在下载，请稍等…")
                      return
                  }
                  thread(name = "v13-asr-model-download") {
                      try {
                          modelDir.mkdirs()
                          downloadResumable(MODEL_URL, modelFile, "阿语方言 ASR")
                          if (!isModelReady()) {
                              modelFile.delete()
                              throw IllegalStateException("模型文件大小异常，请重新下载")
                          }
                          status("✅ 方言模型下载完成，正在加载…")
                          initializeIfPossible()
                      } catch (t: Throwable) {
                          notifyModelReady(false)
                          status("❌ 方言模型下载失败：${shortMessage(t)}")
                      } finally {
                          modelBusy.set(false)
                      }
                  }
              }
          
              fun start() {
                  if (context.checkSelfPermission(Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                      status("⚠ 请先允许麦克风权限")
                      return
                  }
                  if (!isReady()) {
                      status("⚠ 请先下载并加载方言识别模型")
                      return
                  }
                  if (!listening.compareAndSet(false, true)) return
                  resetStableState()
                  notifyListening(true)
                  captureThread = thread(name = "v13-live-mic") {
                      try { captureLoop() } finally { captureThread = null }
                  }
              }
          
              fun stop() {
                  if (!listening.compareAndSet(true, false)) return
                  runCatching { recorder?.stop() }
                  notifyListening(false)
                  status("■ 同传已停止")
              }
          
              private fun captureLoop() {
                  val minBuf = AudioRecord.getMinBufferSize(
                      SAMPLE_RATE,
                      AudioFormat.CHANNEL_IN_MONO,
                      AudioFormat.ENCODING_PCM_16BIT,
                  )
                  if (minBuf <= 0) {
                      listening.set(false)
                      notifyListening(false)
                      status("❌ 手机录音初始化失败")
                      return
                  }
          
                  val bufferBytes = max(minBuf * 2, 8192)
                  var ar = runCatching {
                      AudioRecord(
                          MediaRecorder.AudioSource.VOICE_COMMUNICATION,
                          SAMPLE_RATE,
                          AudioFormat.CHANNEL_IN_MONO,
                          AudioFormat.ENCODING_PCM_16BIT,
                          bufferBytes,
                      )
                  }.getOrNull()
          
                  if (ar == null || ar.state != AudioRecord.STATE_INITIALIZED) {
                      runCatching { ar?.release() }
                      ar = runCatching {
                          AudioRecord(
                              MediaRecorder.AudioSource.VOICE_RECOGNITION,
                              SAMPLE_RATE,
                              AudioFormat.CHANNEL_IN_MONO,
                              AudioFormat.ENCODING_PCM_16BIT,
                              bufferBytes,
                          )
                      }.getOrNull()
                  }
          
                  if (ar == null || ar.state != AudioRecord.STATE_INITIALIZED) {
                      runCatching { ar?.release() }
                      listening.set(false)
                      notifyListening(false)
                      status("❌ 麦克风无法初始化")
                      return
                  }
          
                  val rec = ar
                  recorder = rec
                  attachAudioEffects(rec.audioSessionId)
                  val buf = ShortArray(bufferBytes / 2)
                  val utterance = FloatAccumulator(SAMPLE_RATE * 12)
                  val preroll = ShortRing(SAMPLE_RATE * PREROLL_MS / 1000)
          
                  var inSpeech = false
                  var silenceSamples = 0
                  var noiseFloor = 0.0035f
                  var lastPartialAt = 0L
          
                  try {
                      rec.startRecording()
                      status("🎙 正在听阿语方言 · 可连续说话")
                      while (listening.get()) {
                          val n = rec.read(buf, 0, buf.size)
                          if (n <= 0) continue
          
                          val rms = rms(buf, n)
                          val threshold = max(0.0055f, noiseFloor * 2.45f)
          
                          if (!inSpeech) {
                              if (rms < 0.025f) {
                                  noiseFloor = (noiseFloor * 0.965f + rms * 0.035f).coerceIn(0.0015f, 0.018f)
                              }
                              if (rms > threshold) {
                                  inSpeech = true
                                  silenceSamples = 0
                                  utterance.clear()
                                  utterance.append(preroll.toFloatArray())
                                  utterance.append(buf, n)
                                  lastPartialAt = System.currentTimeMillis()
                                  status("● 检测到说话 · 正在方言识别")
                              } else {
                                  preroll.append(buf, n)
                              }
                              continue
                          }
          
                          utterance.append(buf, n)
                          if (rms < threshold * 0.72f) {
                              silenceSamples += n
                          } else {
                              silenceSamples = 0
                          }
          
                          val now = System.currentTimeMillis()
                          val utteranceMs = utterance.size * 1000 / SAMPLE_RATE
          
