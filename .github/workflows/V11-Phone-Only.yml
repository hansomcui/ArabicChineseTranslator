name: Build Arabic Chinese Translator V11 Phone Only

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Generate Android project
        shell: bash
        run: |
          mkdir -p app/src/main/java/com/hansom/arzhv11
          mkdir -p app/src/main/res/values

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = 'ArabicChineseTranslatorV11'
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          android.suppressUnsupportedCompileSdk=35
          EOF

          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }

          android {
              namespace 'com.hansom.arzhv11'
              compileSdk 35
              defaultConfig {
                  applicationId 'com.hansom.arzhv11'
                  minSdk 26
                  targetSdk 35
                  versionCode 110
                  versionName '11.0'
              }
          }

          dependencies {
              implementation 'com.google.mlkit:translate:17.0.3'
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.INTERNET" />

              <queries>
                  <package android:name="dev.ahmedmohamed.hayaitts" />
                  <intent>
                      <action android:name="dev.ahmedmohamed.hayaitts.MANAGE_VOICES" />
                  </intent>
              </queries>

              <application
                  android:allowBackup="true"
                  android:label="阿语实时翻译 V11 Phone Only"
                  android:theme="@style/AppTheme">
                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="portrait"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#C62828</item>
                  <item name="android:navigationBarColor">#111111</item>
                  <item name="android:statusBarColor">#111111</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/java/com/hansom/arzhv11/MainActivity.java <<'EOF'
          package com.hansom.arzhv11;

          import android.Manifest;
          import android.app.Activity;
          import android.app.AlertDialog;
          import android.content.ActivityNotFoundException;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.content.pm.PackageManager;
          import android.graphics.Color;
          import android.net.Uri;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.speech.RecognitionListener;
          import android.speech.RecognizerIntent;
          import android.speech.SpeechRecognizer;
          import android.speech.tts.TextToSpeech;
          import android.speech.tts.UtteranceProgressListener;
          import android.view.Gravity;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;
          import android.widget.Toast;

          import com.google.mlkit.common.model.DownloadConditions;
          import com.google.mlkit.nl.translate.TranslateLanguage;
          import com.google.mlkit.nl.translate.Translation;
          import com.google.mlkit.nl.translate.Translator;
          import com.google.mlkit.nl.translate.TranslatorOptions;

          import org.json.JSONArray;

          import java.io.BufferedReader;
          import java.io.InputStreamReader;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.net.URLEncoder;
          import java.nio.charset.StandardCharsets;
          import java.util.ArrayList;
          import java.util.LinkedHashMap;
          import java.util.Locale;
          import java.util.Map;
          import java.util.UUID;
          import java.util.concurrent.ConcurrentLinkedQueue;
          import java.util.concurrent.atomic.AtomicBoolean;

          public class MainActivity extends Activity {
              private static final String LOCAL_VOICE_ENGINE = "dev.ahmedmohamed.hayaitts";
              private static final String MANAGE_VOICES_ACTION =
                      "dev.ahmedmohamed.hayaitts.MANAGE_VOICES";
              private static final String ENGINE_DOWNLOAD =
                      "https://github.com/HayaiApp/HayaiTTS/releases/latest";

              private final Handler handler = new Handler(Looper.getMainLooper());

              private SpeechRecognizer recognizer;
              private Intent speechIntent;
              private boolean listening = false;
              private boolean recognizerActive = false;
              private boolean restartPending = false;
              private boolean speaking = false;
              private int langIndex = 0;
              private int errorCount = 0;
              private final String[] arLocales = {"ar-KW", "ar-SA", "ar"};

              private TextView status;
              private TextView voiceStatus;
              private TextView arText;
              private TextView zhText;
              private Button startBtn;
              private Button autoBtn;

              private TextToSpeech myVoiceTts;
              private TextToSpeech systemTts;
              private boolean myVoiceReady = false;
              private boolean systemTtsReady = false;
              private boolean autoSpeak = true;
              private final ConcurrentLinkedQueue<String> speechQueue =
                      new ConcurrentLinkedQueue<>();
              private final AtomicBoolean speechBusy = new AtomicBoolean(false);

              private Translator translator;
              private boolean modelReady = false;
              private boolean modelLoading = false;
              private final ConcurrentLinkedQueue<String> translateQueue =
                      new ConcurrentLinkedQueue<>();
              private final AtomicBoolean translating = new AtomicBoolean(false);

              private final StringBuilder finalAr = new StringBuilder();
              private final StringBuilder finalZh = new StringBuilder();
              private String partialAr = "";

              private SharedPreferences prefs;
              private final Map<String,String> quick = new LinkedHashMap<>();

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  prefs = getSharedPreferences("v11", MODE_PRIVATE);
                  autoSpeak = prefs.getBoolean("auto_speak", true);

                  initQuickDict();
                  buildUi();
                  initTranslator();
                  initTts();

                  if (checkSelfPermission(Manifest.permission.RECORD_AUDIO)
                          != PackageManager.PERMISSION_GRANTED) {
                      requestPermissions(new String[]{Manifest.permission.RECORD_AUDIO}, 1001);
                      status.setText("● 请允许麦克风权限");
                  } else {
                      initRecognizer();
                  }
              }

              private void initQuickDict() {
                  quick.put("صباح الخير", "早上好");
                  quick.put("مساء الخير", "晚上好");
                  quick.put("شكرا", "谢谢");
                  quick.put("شكرا جزيلا", "非常感谢");
                  quick.put("لا تقلق", "别担心");
                  quick.put("لا داعي للعجلة", "不用着急");
                  quick.put("كم السعر", "多少钱");
                  quick.put("ما هو السعر", "价格是多少");
              }

              private void buildUi() {
                  ScrollView scroll = new ScrollView(this);
                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(28, 38, 28, 38);
                  root.setBackgroundColor(Color.rgb(245,245,245));
                  scroll.addView(root);

                  TextView title = new TextView(this);
                  title.setText("阿语 → 中文 实时翻译 V11 · Phone Only");
                  title.setTextSize(25);
                  title.setTextColor(Color.BLACK);
                  title.setGravity(Gravity.CENTER);
                  title.setTypeface(null, 1);
                  root.addView(title);

                  TextView sub = new TextView(this);
                  sub.setText("纯手机 · 不要电脑 · 不要 API Key · 本人音色离线运行");
                  sub.setTextSize(14);
                  sub.setGravity(Gravity.CENTER);
                  sub.setPadding(0,8,0,12);
                  root.addView(sub);

                  status = new TextView(this);
                  status.setText("● 正在准备翻译模型");
                  status.setTextSize(15);
                  status.setGravity(Gravity.CENTER);
                  status.setPadding(0,12,0,18);
                  root.addView(status);

                  startBtn = new Button(this);
                  startBtn.setText("🎙 开始实时翻译");
                  startBtn.setTextSize(20);
                  startBtn.setAllCaps(false);
                  startBtn.setEnabled(false);
                  startBtn.setOnClickListener(v -> toggleListening());
                  root.addView(startBtn);

                  voiceStatus = new TextView(this);
                  voiceStatus.setText("🔊 正在检测手机本人音色…");
                  voiceStatus.setTextSize(15);
                  voiceStatus.setPadding(0,18,0,8);
                  root.addView(voiceStatus);

                  Button setup = new Button(this);
                  setup.setText("① 设置 / 录制我的声音（只用手机）");
                  setup.setAllCaps(false);
                  setup.setOnClickListener(v -> openVoiceSetup());
                  root.addView(setup);

                  Button recheck = new Button(this);
                  recheck.setText("② 重新检测本人音色");
                  recheck.setAllCaps(false);
                  recheck.setOnClickListener(v -> {
                      resetMyVoiceEngine();
                      Toast.makeText(this, "正在重新检测本人音色", Toast.LENGTH_SHORT).show();
                  });
                  root.addView(recheck);

                  autoBtn = new Button(this);
                  updateAutoButton();
                  autoBtn.setAllCaps(false);
                  autoBtn.setOnClickListener(v -> {
                      autoSpeak = !autoSpeak;
                      prefs.edit().putBoolean("auto_speak", autoSpeak).apply();
                      updateAutoButton();
                  });
                  root.addView(autoBtn);

                  Button test = new Button(this);
                  test.setText("④ 测试我的声音");
                  test.setAllCaps(false);
                  test.setOnClickListener(v ->
                          enqueueSpeech("你好，这是我的声音测试。阿拉伯语翻译完成后，我会自动把中文读出来。"));
                  root.addView(test);

                  TextView arLabel = new TextView(this);
                  arLabel.setText("阿语原文");
                  arLabel.setTextSize(16);
                  arLabel.setPadding(0,25,0,8);
                  root.addView(arLabel);

                  arText = new TextView(this);
                  arText.setText("等待对方说阿拉伯语……");
                  arText.setTextSize(20);
                  arText.setPadding(22,22,22,22);
                  arText.setBackgroundColor(Color.WHITE);
                  arText.setMinHeight(220);
                  arText.setGravity(Gravity.RIGHT);
                  root.addView(arText);

                  TextView zhLabel = new TextView(this);
                  zhLabel.setText("中文翻译");
                  zhLabel.setTextSize(16);
                  zhLabel.setPadding(0,25,0,8);
                  root.addView(zhLabel);

                  zhText = new TextView(this);
                  zhText.setText("中文会自动显示并朗读。");
                  zhText.setTextSize(20);
                  zhText.setPadding(22,22,22,22);
                  zhText.setBackgroundColor(Color.WHITE);
                  zhText.setMinHeight(220);
                  zhText.setTextIsSelectable(true);
                  root.addView(zhText);

                  Button clear = new Button(this);
                  clear.setText("清空");
                  clear.setOnClickListener(v -> {
                      finalAr.setLength(0);
                      finalZh.setLength(0);
                      partialAr = "";
                      translateQueue.clear();
                      render();
                  });
                  root.addView(clear);

                  Button model = new Button(this);
                  model.setText("重新准备翻译模型");
                  model.setOnClickListener(v -> prepareModel());
                  root.addView(model);

                  setContentView(scroll);
              }

              private void updateAutoButton() {
                  if (autoBtn != null) {
                      autoBtn.setText(autoSpeak
                              ? "③ 自动朗读中文：开"
                              : "③ 自动朗读中文：关");
                  }
              }

              private boolean localEngineInstalled() {
                  try {
                      getPackageManager().getPackageInfo(LOCAL_VOICE_ENGINE, 0);
                      return true;
                  } catch (Exception e) {
                      return false;
                  }
              }

              private void openVoiceSetup() {
                  if (!localEngineInstalled()) {
                      new AlertDialog.Builder(this)
                              .setTitle("第一次只在手机上设置一次")
                              .setMessage("V11 不需要电脑，也不需要 API Key。\n\n"
                                      + "点击“下载安装”，在手机安装离线本人音色引擎。\n"
                                      + "安装后打开它：\n"
                                      + "1. 下载 ZipVoice 中文/英文 INT8 模型\n"
                                      + "2. 进入该声音详情，选择 Clone this voice\n"
                                      + "3. 用手机麦克风录 5–15 秒自己的中文声音并保存\n"
                                      + "4. 回到 V11，点“② 重新检测本人音色”\n\n"
                                      + "以后翻译和本人声音都直接在手机上运行。")
                              .setPositiveButton("下载安装", (d,w) -> {
                                  try {
                                      startActivity(new Intent(Intent.ACTION_VIEW,
                                              Uri.parse(ENGINE_DOWNLOAD)));
                                  } catch (Exception e) {
                                      Toast.makeText(this, "无法打开下载页",
                                              Toast.LENGTH_LONG).show();
                                  }
                              })
                              .setNegativeButton("先用系统声音", null)
                              .show();
                      return;
                  }

                  try {
                      Intent i = new Intent(MANAGE_VOICES_ACTION);
                      i.setPackage(LOCAL_VOICE_ENGINE);
                      startActivity(i);
                  } catch (ActivityNotFoundException e) {
                      Intent launch = getPackageManager()
                              .getLaunchIntentForPackage(LOCAL_VOICE_ENGINE);
                      if (launch != null) startActivity(launch);
                  }
              }

              private void initTts() {
                  systemTts = new TextToSpeech(this, s -> {
                      if (s == TextToSpeech.SUCCESS) {
                          int r = systemTts.setLanguage(Locale.SIMPLIFIED_CHINESE);
                          systemTtsReady = r != TextToSpeech.LANG_MISSING_DATA
                                  && r != TextToSpeech.LANG_NOT_SUPPORTED;
                          systemTts.setSpeechRate(1.0f);
                          setTtsListener(systemTts, false);
                          refreshVoiceStatus();
                      }
                  });

                  if (localEngineInstalled()) initMyVoiceEngine();
                  else refreshVoiceStatus();
              }

              private void initMyVoiceEngine() {
                  try {
                      myVoiceTts = new TextToSpeech(this, s -> {
                          if (s == TextToSpeech.SUCCESS) {
                              int r = myVoiceTts.setLanguage(Locale.SIMPLIFIED_CHINESE);
                              myVoiceReady = r != TextToSpeech.LANG_MISSING_DATA
                                      && r != TextToSpeech.LANG_NOT_SUPPORTED;
                              myVoiceTts.setSpeechRate(1.0f);
                              setTtsListener(myVoiceTts, true);
                          } else {
                              myVoiceReady = false;
                          }
                          refreshVoiceStatus();
                      }, LOCAL_VOICE_ENGINE);
                  } catch (Exception e) {
                      myVoiceReady = false;
                      refreshVoiceStatus();
                  }
              }

              private void resetMyVoiceEngine() {
                  try {
                      if (myVoiceTts != null) {
                          myVoiceTts.stop();
                          myVoiceTts.shutdown();
                      }
                  } catch (Exception ignored) {}
                  myVoiceTts = null;
                  myVoiceReady = false;
                  if (localEngineInstalled()) initMyVoiceEngine();
                  else refreshVoiceStatus();
              }

              private void refreshVoiceStatus() {
                  runOnUiThread(() -> {
                      if (myVoiceReady) {
                          voiceStatus.setText("✅ 本人音色已连接 · 手机本地离线");
                      } else if (localEngineInstalled()) {
                          voiceStatus.setText("⚠ 音色引擎已安装：请完成 ZipVoice 中文模型和本人录音设置");
                      } else {
                          voiceStatus.setText("🔊 当前用手机系统中文声音 · 点①启用本人音色");
                      }
                  });
              }

              private void setTtsListener(TextToSpeech tts, boolean mine) {
                  tts.setOnUtteranceProgressListener(new UtteranceProgressListener() {
                      public void onStart(String id) {}
                      public void onDone(String id) {
                          runOnUiThread(() -> finishSpeaking(
                                  mine ? "✅ 本人音色已就绪" : "🔊 手机系统中文声音"));
                      }
                      public void onError(String id) {
                          runOnUiThread(() -> {
                              if (mine) myVoiceReady = false;
                              finishSpeaking("⚠ 朗读失败");
                              refreshVoiceStatus();
                          });
                      }
                  });
              }

              private void enqueueSpeech(String text) {
                  if (text == null || text.trim().isEmpty()) return;
                  while (speechQueue.size() >= 3) speechQueue.poll();
                  speechQueue.offer(text.trim());
                  speakNext();
              }

              private void speakNext() {
                  if (!speechBusy.compareAndSet(false, true)) return;
                  String text = speechQueue.poll();
                  if (text == null) {
                      speechBusy.set(false);
                      return;
                  }

                  TextToSpeech tts = myVoiceReady ? myVoiceTts : systemTts;
                  boolean mine = myVoiceReady && tts == myVoiceTts;

                  if (tts == null || (!mine && !systemTtsReady)) {
                      speechBusy.set(false);
                      refreshVoiceStatus();
                      speakNext();
                      return;
                  }

                  speaking = true;
                  restartPending = false;
                  try {
                      if (recognizer != null) {
                          recognizer.cancel();
                          recognizerActive = false;
                      }
                  } catch (Exception ignored) {}

                  String id = "v11-" + UUID.randomUUID();
                  int r = tts.speak(text, TextToSpeech.QUEUE_FLUSH, null, id);
                  if (r == TextToSpeech.ERROR) {
                      if (mine) {
                          myVoiceReady = false;
                          speaking = false;
                          speechBusy.set(false);
                          speechQueue.offer(text);
                          refreshVoiceStatus();
                          speakNext();
                      } else {
                          finishSpeaking("⚠ 中文朗读启动失败");
                      }
                  } else {
                      voiceStatus.setText(mine
                              ? "🔊 正在用我的声音朗读中文"
                              : "🔊 正在用手机系统中文声音朗读");
                  }
              }

              private void finishSpeaking(String msg) {
                  speaking = false;
                  speechBusy.set(false);
                  voiceStatus.setText(msg);
                  if (listening) scheduleRestart(280);
                  speakNext();
              }

              private void initTranslator() {
                  TranslatorOptions opt = new TranslatorOptions.Builder()
                          .setSourceLanguage(TranslateLanguage.ARABIC)
                          .setTargetLanguage(TranslateLanguage.CHINESE)
                          .build();
                  translator = Translation.getClient(opt);
                  prepareModel();
              }

              private void prepareModel() {
                  if (translator == null || modelLoading) return;
                  modelLoading = true;
                  modelReady = false;
                  status.setText("● 正在准备本地备用翻译模型…");

                  translator.downloadModelIfNeeded(new DownloadConditions.Builder().build())
                          .addOnSuccessListener(x -> {
                              modelLoading = false;
                              modelReady = true;
                              if (SpeechRecognizer.isRecognitionAvailable(this))
                                  startBtn.setEnabled(true);
                              status.setText("● 翻译模型已就绪");
                          })
                          .addOnFailureListener(e -> {
                              modelLoading = false;
                              modelReady = false;
                              if (SpeechRecognizer.isRecognitionAvailable(this))
                                  startBtn.setEnabled(true);
                              status.setText("● 本地备用模型未就绪；在线翻译仍可用");
                          });
              }

              @Override
              public void onRequestPermissionsResult(
                      int requestCode, String[] permissions, int[] grantResults) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults);
                  if (requestCode == 1001
                          && grantResults.length > 0
                          && grantResults[0] == PackageManager.PERMISSION_GRANTED) {
                      initRecognizer();
                  } else if (requestCode == 1001) {
                      status.setText("● 没有麦克风权限，无法识别阿语");
                  }
              }

              private void initRecognizer() {
                  if (!SpeechRecognizer.isRecognitionAvailable(this)) {
                      status.setText("● 本机没有可用语音识别服务");
                      return;
                  }

                  recognizer = SpeechRecognizer.createSpeechRecognizer(this);
                  recognizer.setRecognitionListener(new RecognitionListener() {
                      public void onReadyForSpeech(Bundle b) {
                          recognizerActive = true;
                          restartPending = false;
                          errorCount = 0;
                          status.setText("● 正在听阿语 (" + arLocales[langIndex] + ")");
                      }
                      public void onBeginningOfSpeech() {
                          recognizerActive = true;
                          status.setText("● 对方正在说话");
                      }
                      public void onRmsChanged(float x) {}
                      public void onBufferReceived(byte[] b) {}
                      public void onEndOfSpeech() {
                          status.setText("● 正在整理识别结果");
                      }
                      public void onError(int error) {
                          recognizerActive = false;
                          restartPending = false;
                          if (speaking) return;

                          errorCount++;
                          if ((error == 12 || error == 13)
                                  && langIndex < arLocales.length - 1) {
                              langIndex++;
                              applyLocale();
                          } else if (errorCount >= 4
                                  && langIndex < arLocales.length - 1) {
                              langIndex++;
                              errorCount = 0;
                              applyLocale();
                          }

                          if (listening
                                  && error != SpeechRecognizer.ERROR_INSUFFICIENT_PERMISSIONS) {
                              scheduleRestart(
                                      error == SpeechRecognizer.ERROR_RECOGNIZER_BUSY ? 900 : 450);
                          }
                      }
                      public void onResults(Bundle results) {
                          recognizerActive = false;
                          restartPending = false;
                          errorCount = 0;
                          if (speaking) return;

                          ArrayList<String> r = results.getStringArrayList(
                                  SpeechRecognizer.RESULTS_RECOGNITION);
                          if (r != null && !r.isEmpty()) {
                              String ar = r.get(0).trim();
                              if (!ar.isEmpty()) {
                                  appendArabic(ar);
                                  partialAr = "";
                                  render();
                                  enqueueTranslation(ar);
                              }
                          }
                          if (listening && !speaking) scheduleRestart(280);
                      }
                      public void onPartialResults(Bundle results) {
                          ArrayList<String> r = results.getStringArrayList(
                                  SpeechRecognizer.RESULTS_RECOGNITION);
                          if (r != null && !r.isEmpty()) {
                              partialAr = r.get(0).trim();
                              render();
                          }
                      }
                      public void onEvent(int t, Bundle b) {}
                  });

                  speechIntent = new Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH);
                  speechIntent.putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL,
                          RecognizerIntent.LANGUAGE_MODEL_FREE_FORM);
                  speechIntent.putExtra(RecognizerIntent.EXTRA_PARTIAL_RESULTS, true);
                  speechIntent.putExtra(RecognizerIntent.EXTRA_MAX_RESULTS, 5);
                  speechIntent.putExtra(RecognizerIntent.EXTRA_PREFER_OFFLINE, false);
                  applyLocale();

                  startBtn.setEnabled(true);
                  status.setText("● 阿语语音识别已就绪");
              }

              private void applyLocale() {
                  if (speechIntent == null) return;
                  String l = arLocales[Math.max(0, Math.min(langIndex, arLocales.length - 1))];
                  speechIntent.putExtra(RecognizerIntent.EXTRA_LANGUAGE, l);
                  speechIntent.putExtra(RecognizerIntent.EXTRA_LANGUAGE_PREFERENCE, l);
              }

              private void toggleListening() {
                  if (checkSelfPermission(Manifest.permission.RECORD_AUDIO)
                          != PackageManager.PERMISSION_GRANTED) {
                      requestPermissions(new String[]{Manifest.permission.RECORD_AUDIO}, 1001);
                      return;
                  }

                  if (recognizer == null) initRecognizer();

                  if (!listening) {
                      listening = true;
                      langIndex = 0;
                      recognizerActive = false;
                      restartPending = false;
                      applyLocale();
                      startBtn.setText("■ 停止翻译");
                      startRecognition();
                  } else {
                      listening = false;
                      restartPending = false;
                      recognizerActive = false;
                      handler.removeCallbacksAndMessages(null);
                      startBtn.setText("🎙 开始实时翻译");
                      status.setText("● 已停止");
                      try { if (recognizer != null) recognizer.cancel(); }
                      catch (Exception ignored) {}
                  }
              }

              private void startRecognition() {
                  if (!listening || recognizer == null || recognizerActive || speaking) return;
                  try {
                      recognizer.startListening(speechIntent);
                      recognizerActive = true;
                      status.setText("● 正在连接阿语识别 (" + arLocales[langIndex] + ")");
                  } catch (Exception e) {
                      recognizerActive = false;
                      scheduleRestart(900);
                  }
              }

              private void scheduleRestart(long ms) {
                  if (!listening || restartPending || speaking) return;
                  restartPending = true;
                  handler.postDelayed(() -> {
                      restartPending = false;
                      startRecognition();
                  }, ms);
              }

              private void appendArabic(String s) {
                  if (finalAr.length() > 0) finalAr.append("\n\n");
                  finalAr.append(s);
              }

              private void appendChinese(String s) {
                  if (s == null || s.trim().isEmpty()) return;
                  if (finalZh.length() > 0) finalZh.append("\n\n");
                  finalZh.append(s.trim());
                  render();
                  if (autoSpeak && !s.startsWith("[")) enqueueSpeech(s.trim());
              }

              private void render() {
                  StringBuilder a = new StringBuilder(finalAr);
                  if (!partialAr.isEmpty()) {
                      if (a.length() > 0) a.append("\n\n");
                      a.append(partialAr);
                  }
                  arText.setText(a.length() == 0
                          ? "等待对方说阿拉伯语……" : a.toString());
                  zhText.setText(finalZh.length() == 0
                          ? "中文会自动显示并朗读。" : finalZh.toString());
              }

              private String norm(String s) {
                  return s.replace("أ","ا").replace("إ","ا").replace("آ","ا")
                          .replace("ى","ي").replace("ة","ه")
                          .replaceAll("[\\u064B-\\u065F]","").trim();
              }

              private String quickHit(String ar) {
                  String n = norm(ar);
                  for (Map.Entry<String,String> e : quick.entrySet()) {
                      if (n.equals(norm(e.getKey()))) return e.getValue();
                  }
                  return null;
              }

              private String correct(String ar, String zh) {
                  String n = norm(ar);
                  String r = zh;
                  if (n.contains("شاحن"))
                      r = r.replace("卡车","充电器").replace("货车","充电器");
                  if (n.contains("هاتف") || n.contains("جوال") || n.contains("تلفون"))
                      r = r.replace("电话","手机");
                  if (n.contains("حفار") || n.contains("جهاز الحفر") || n.contains("ريج"))
                      r = r.replace("挖掘机","钻机").replace("钻孔机","钻机");
                  if (n.contains("كويل"))
                      r = r.replace("盘管","连续油管").replace("线圈管","连续油管");
                  if (n.contains("مناقصة") || n.contains("تندر"))
                      r = r.replace("拍卖","招标");
                  return r;
              }

              private void enqueueTranslation(String ar) {
                  while (translateQueue.size() >= 2) translateQueue.poll();
                  translateQueue.offer(ar);
                  if (translating.compareAndSet(false, true)) translateNext();
              }

              private void translateNext() {
                  String ar = translateQueue.poll();
                  if (ar == null) {
                      translating.set(false);
                      return;
                  }

                  String q = quickHit(ar);
                  if (q != null) {
                      appendChinese(q);
                      translateNext();
                      return;
                  }

                  onlineTranslate(ar, online -> {
                      if (online != null && !online.isEmpty()) {
                          appendChinese(correct(ar, online));
                          translateNext();
                      } else if (modelReady) {
                          translator.translate(ar)
                                  .addOnSuccessListener(local -> {
                                      appendChinese(correct(ar, local));
                                      translateNext();
                                  })
                                  .addOnFailureListener(e -> {
                                      appendChinese("[暂时无法翻译]");
                                      translateNext();
                                  });
                      } else {
                          appendChinese("[在线翻译暂不可用]");
                          translateNext();
                      }
                  });
              }

              private interface OnlineCb { void done(String text); }

              private void onlineTranslate(String ar, OnlineCb cb) {
                  new Thread(() -> {
                      String out = "";
                      HttpURLConnection c = null;
                      try {
                          String q = URLEncoder.encode(ar, "UTF-8");
                          URL u = new URL("https://translate.googleapis.com/translate_a/single"
                                  + "?client=gtx&sl=ar&tl=zh-CN&dt=t&q=" + q);
                          c = (HttpURLConnection) u.openConnection();
                          c.setConnectTimeout(1800);
                          c.setReadTimeout(2600);
                          c.setRequestProperty("User-Agent","Mozilla/5.0");
                          int code = c.getResponseCode();
                          if (code >= 200 && code < 300) {
                              StringBuilder raw = new StringBuilder();
                              try (BufferedReader br = new BufferedReader(new InputStreamReader(
                                      c.getInputStream(), StandardCharsets.UTF_8))) {
                                  String line;
                                  while ((line = br.readLine()) != null) raw.append(line);
                              }
                              JSONArray root = new JSONArray(raw.toString());
                              JSONArray parts = root.getJSONArray(0);
                              StringBuilder zh = new StringBuilder();
                              for (int i=0; i<parts.length(); i++) {
                                  JSONArray seg = parts.optJSONArray(i);
                                  if (seg != null && seg.length() > 0)
                                      zh.append(seg.optString(0,""));
                              }
                              out = zh.toString().trim();
                          }
                      } catch (Exception ignored) {
                      } finally {
                          if (c != null) c.disconnect();
                      }
                      String finalOut = out;
                      runOnUiThread(() -> cb.done(finalOut));
                  }).start();
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  if (localEngineInstalled() && myVoiceTts == null) initMyVoiceEngine();
                  refreshVoiceStatus();
              }

              @Override
              protected void onDestroy() {
                  listening = false;
                  try { if (recognizer != null) recognizer.destroy(); } catch (Exception ignored) {}
                  try { if (translator != null) translator.close(); } catch (Exception ignored) {}
                  try {
                      if (myVoiceTts != null) {
                          myVoiceTts.stop();
                          myVoiceTts.shutdown();
                      }
                  } catch (Exception ignored) {}
                  try {
                      if (systemTts != null) {
                          systemTts.stop();
                          systemTts.shutdown();
                      }
                  } catch (Exception ignored) {}
                  super.onDestroy();
              }
          }
          EOF

      - name: Static sanity checks
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s = Path('app/src/main/java/com/hansom/arzhv11/MainActivity.java').read_text(encoding='utf-8')
          checks = {
              'V11 Phone Only': 'V11 · Phone Only' in s,
              'No ElevenLabs': 'elevenlabs' not in s.lower(),
              'Local voice engine': 'dev.ahmedmohamed.hayaitts' in s,
              'Voice management intent': 'MANAGE_VOICES' in s,
              'Chinese TTS': 'Locale.SIMPLIFIED_CHINESE' in s,
              'System fallback': 'systemTts' in s,
              'Kuwait Arabic': '"ar-KW"' in s,
              'Saudi fallback': '"ar-SA"' in s,
              'Generic Arabic': '"ar"' in s,
              'Online translation': 'onlineTranslate(ar' in s,
              'MLKit fallback': 'translator.translate(ar)' in s,
              'Auto speak': 'enqueueSpeech(s.trim())' in s,
              'Restart guard': 'restartPending' in s,
          }
          bad=[k for k,v in checks.items() if not v]
          for k,v in checks.items():
              print(('PASS ' if v else 'FAIL ') + k)
          if bad:
              raise SystemExit('Sanity checks failed: ' + ', '.join(bad))
          PY

