name: Build Arabic Chinese Translator V3 Free

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Generate Android project
        shell: bash
        run: |
          mkdir -p app/src/main/java/com/hansom/arzhv3
          mkdir -p app/src/main/res/values

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = 'ArabicChineseTranslatorV3'
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.hansom.arzhv3'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.hansom.arzhv3'
                  minSdk 26
                  targetSdk 35
                  versionCode 3
                  versionName '3.0'
              }
          }

          dependencies {
              implementation 'com.google.mlkit:translate:17.0.3'
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.INTERNET" />

              <application
                  android:allowBackup="true"
                  android:label="阿语实时翻译 免费版"
                  android:theme="@style/AppTheme">

                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="portrait"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#C62828</item>
                  <item name="android:navigationBarColor">#111111</item>
                  <item name="android:statusBarColor">#111111</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/java/com/hansom/arzhv3/MainActivity.java <<'EOF'
          package com.hansom.arzhv3;

          import android.Manifest;
          import android.app.Activity;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.graphics.Color;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.speech.RecognitionListener;
          import android.speech.RecognizerIntent;
          import android.speech.SpeechRecognizer;
          import android.view.Gravity;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;
          import android.widget.Toast;

          import com.google.mlkit.common.model.DownloadConditions;
          import com.google.mlkit.nl.translate.TranslateLanguage;
          import com.google.mlkit.nl.translate.Translation;
          import com.google.mlkit.nl.translate.Translator;
          import com.google.mlkit.nl.translate.TranslatorOptions;

          import java.util.ArrayList;
          import java.util.concurrent.ConcurrentLinkedQueue;
          import java.util.concurrent.atomic.AtomicBoolean;

          public class MainActivity extends Activity {

              private SpeechRecognizer recognizer;
              private Intent speechIntent;
              private boolean listening = false;

              private TextView arabicText;
              private TextView chineseText;
              private TextView statusText;
              private Button startButton;

              private final Handler handler = new Handler(Looper.getMainLooper());

              private Translator translator;
              private boolean modelReady = false;
              private boolean modelDownloading = false;

              private final ConcurrentLinkedQueue<String> queue = new ConcurrentLinkedQueue<>();
              private final AtomicBoolean translating = new AtomicBoolean(false);

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  buildUi();
                  setupTranslator();
                  setupRecognizer();

                  if (checkSelfPermission(Manifest.permission.RECORD_AUDIO)
                          != PackageManager.PERMISSION_GRANTED) {
                      requestPermissions(
                              new String[]{Manifest.permission.RECORD_AUDIO},
                              1001
                      );
                  }
              }

              private void buildUi() {
                  ScrollView scroll = new ScrollView(this);

                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(32, 42, 32, 42);
                  root.setBackgroundColor(Color.rgb(245,245,245));
                  scroll.addView(root);

                  TextView title = new TextView(this);
                  title.setText("阿语 → 中文 实时翻译");
                  title.setTextSize(26);
                  title.setTextColor(Color.BLACK);
                  title.setGravity(Gravity.CENTER);
                  title.setTypeface(null, 1);
                  root.addView(title);

                  TextView free = new TextView(this);
                  free.setText("免费本地翻译版 · 无需 API Key");
                  free.setTextSize(14);
                  free.setGravity(Gravity.CENTER);
                  free.setPadding(0, 8, 0, 12);
                  root.addView(free);

                  statusText = new TextView(this);
                  statusText.setText("● 正在准备离线翻译模型");
                  statusText.setTextSize(15);
                  statusText.setGravity(Gravity.CENTER);
                  statusText.setPadding(0,12,0,20);
                  root.addView(statusText);

                  startButton = new Button(this);
                  startButton.setText("🎙 开始实时翻译");
                  startButton.setTextSize(20);
                  startButton.setAllCaps(false);
                  startButton.setEnabled(false);
                  startButton.setOnClickListener(v -> toggleListening());
                  root.addView(startButton);

                  TextView arLabel = new TextView(this);
                  arLabel.setText("阿语原文");
                  arLabel.setTextSize(16);
                  arLabel.setPadding(0,28,0,8);
                  root.addView(arLabel);

                  arabicText = new TextView(this);
                  arabicText.setText("等待对方说阿拉伯语……");
                  arabicText.setTextSize(20);
                  arabicText.setPadding(24,24,24,24);
                  arabicText.setBackgroundColor(Color.WHITE);
                  arabicText.setMinHeight(220);
                  arabicText.setGravity(Gravity.RIGHT);
                  root.addView(arabicText);

                  TextView zhLabel = new TextView(this);
                  zhLabel.setText("中文翻译");
                  zhLabel.setTextSize(16);
                  zhLabel.setPadding(0,28,0,8);
                  root.addView(zhLabel);

                  chineseText = new TextView(this);
                  chineseText.setText("中文会自动显示在这里。");
                  chineseText.setTextSize(20);
                  chineseText.setPadding(24,24,24,24);
                  chineseText.setBackgroundColor(Color.WHITE);
                  chineseText.setMinHeight(220);
                  chineseText.setTextIsSelectable(true);
                  root.addView(chineseText);

                  Button clear = new Button(this);
                  clear.setText("清空");
                  clear.setOnClickListener(v -> {
                      arabicText.setText("");
                      chineseText.setText("");
                  });
                  root.addView(clear);

                  Button redownload = new Button(this);
                  redownload.setText("重新准备翻译模型");
                  redownload.setOnClickListener(v -> prepareModel());
                  root.addView(redownload);

                  setContentView(scroll);
              }

              private void setupTranslator() {
                  TranslatorOptions options =
                          new TranslatorOptions.Builder()
                                  .setSourceLanguage(TranslateLanguage.ARABIC)
                                  .setTargetLanguage(TranslateLanguage.CHINESE)
                                  .build();

                  translator = Translation.getClient(options);
                  prepareModel();
              }

              private void prepareModel() {
                  if (translator == null || modelDownloading) return;

                  modelDownloading = true;
                  modelReady = false;
                  startButton.setEnabled(false);
                  statusText.setText("● 首次使用：正在下载翻译模型…");

                  DownloadConditions conditions =
                          new DownloadConditions.Builder().build();

                  translator.downloadModelIfNeeded(conditions)
                          .addOnSuccessListener(unused -> {
                              modelDownloading = false;
                              modelReady = true;
                              startButton.setEnabled(true);
                              statusText.setText("● 翻译模型已就绪");
                              Toast.makeText(
                                      this,
                                      "免费翻译模型准备完成",
                                      Toast.LENGTH_SHORT
                              ).show();
                          })
                          .addOnFailureListener(e -> {
                              modelDownloading = false;
                              modelReady = false;
                              startButton.setEnabled(false);
                              statusText.setText("● 模型下载失败，请检查网络后重试");
                          });
              }

              private void setupRecognizer() {
                  if (!SpeechRecognizer.isRecognitionAvailable(this)) {
                      statusText.setText("本机没有可用语音识别服务");
                      return;
                  }

                  recognizer = SpeechRecognizer.createSpeechRecognizer(this);

                  recognizer.setRecognitionListener(new RecognitionListener() {
                      public void onReadyForSpeech(Bundle params) {
                          statusText.setText("● 正在听阿语");
                      }

                      public void onBeginningOfSpeech() {
                          statusText.setText("● 对方正在说话");
                      }

                      public void onRmsChanged(float rmsdB) {}
                      public void onBufferReceived(byte[] buffer) {}

                      public void onEndOfSpeech() {
                          statusText.setText("● 正在翻译");
                      }

                      public void onError(int error) {
                          if (listening) {
                              handler.postDelayed(() -> startRecognition(), 700);
                          }
                      }

                      public void onResults(Bundle results) {
                          ArrayList<String> list =
                                  results.getStringArrayList(
                                          SpeechRecognizer.RESULTS_RECOGNITION
                                  );

                          if (list != null && !list.isEmpty()) {
                              String ar = list.get(0).trim();
                              if (!ar.isEmpty()) {
                                  appendArabic(ar);
                                  queue.add(ar);
                                  processQueue();
                              }
                          }

                          if (listening) {
                              handler.postDelayed(() -> startRecognition(), 350);
                          }
                      }

                      public void onPartialResults(Bundle partialResults) {
                          ArrayList<String> list =
                                  partialResults.getStringArrayList(
                                          SpeechRecognizer.RESULTS_RECOGNITION
                                  );

                          if (list != null && !list.isEmpty()) {
                              statusText.setText("● " + list.get(0));
                          }
                      }

                      public void onEvent(int eventType, Bundle params) {}
                  });

                  speechIntent =
                          new Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH);

                  speechIntent.putExtra(
                          RecognizerIntent.EXTRA_LANGUAGE_MODEL,
                          RecognizerIntent.LANGUAGE_MODEL_FREE_FORM
                  );

                  speechIntent.putExtra(
                          RecognizerIntent.EXTRA_LANGUAGE,
                          "ar-KW"
                  );

                  speechIntent.putExtra(
                          RecognizerIntent.EXTRA_PARTIAL_RESULTS,
                          true
                  );

                  speechIntent.putExtra(
                          RecognizerIntent.EXTRA_MAX_RESULTS,
                          3
                  );
              }

              private void toggleListening() {
                  if (!modelReady) {
                      Toast.makeText(
                              this,
                              "翻译模型还没准备好",
                              Toast.LENGTH_SHORT
                      ).show();
                      prepareModel();
                      return;
                  }

                  if (!listening) {
                      listening = true;
                      startButton.setText("■ 停止翻译");
                      startRecognition();
                  } else {
                      listening = false;
                      startButton.setText("🎙 开始实时翻译");
                      statusText.setText("● 已停止");
                      try {
                          recognizer.cancel();
                      } catch (Exception ignored) {}
                  }
              }

              private void startRecognition() {
                  if (!listening || recognizer == null) return;

                  try {
                      recognizer.startListening(speechIntent);
                  } catch (Exception ignored) {}
              }

              private void appendArabic(String s) {
                  String old = arabicText.getText().toString();

                  if (old.startsWith("等待对方")) {
                      old = "";
                  }

                  arabicText.setText(
                          old +
                          (old.isEmpty() ? "" : "\n\n") +
                          s
                  );
              }

              private void appendChinese(String s) {
                  String old = chineseText.getText().toString();

                  if (old.startsWith("中文会自动")) {
                      old = "";
                  }

                  chineseText.setText(
                          old +
                          (old.isEmpty() ? "" : "\n\n") +
                          s
                  );
              }

              private void processQueue() {
                  if (!modelReady) return;
                  if (!translating.compareAndSet(false, true)) return;

                  translateNext();
              }

              private void translateNext() {
                  String text = queue.poll();

                  if (text == null) {
                      translating.set(false);

                      if (listening) {
                          statusText.setText("● 正在听阿语");
                      } else {
                          statusText.setText("● 待机");
                      }
                      return;
                  }

                  translator.translate(text)
                          .addOnSuccessListener(result -> {
                              appendChinese(result);
                              translateNext();
                          })
                          .addOnFailureListener(e -> {
                              appendChinese("[本地翻译失败]");
                              translateNext();
                          });
              }

              @Override
              protected void onDestroy() {
                  listening = false;

                  if (recognizer != null) {
                      recognizer.destroy();
                  }

                  if (translator != null) {
                      translator.close();
                  }

                  super.onDestroy();
              }
          }
          EOF

      - name: Build APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk ArabicChineseTranslator-V3-Free.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ArabicChineseTranslator-V3-Free-APK
          path: ArabicChineseTranslator-V3-Free.apk
