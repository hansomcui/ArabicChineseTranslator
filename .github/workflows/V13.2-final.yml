                      zh = zh.replace("KOC", "科威特石油公司（KOC）", ignoreCase = false)
                  }
                  return zh
              }
          
              private fun enqueueSpeechText(text: String) {
                  for (chunk in splitChineseForSpeech(text)) {
                      while (speechQueue.size >= 3) speechQueue.poll()
                      speechQueue.offer(chunk)
                  }
                  speakNext()
              }
          
              private fun splitChineseForSpeech(text: String): List<String> {
                  val pieces = text.split(Regex("""(?<=[。！？；，,!?;])"""))
                      .map { it.trim() }
                      .filter { it.isNotBlank() }
                  val out = ArrayList<String>()
                  val pending = StringBuilder()
          
                  fun flush() {
                      if (pending.isNotEmpty()) {
                          out.add(pending.toString())
                          pending.setLength(0)
                      }
                  }
          
                  for (p in pieces) {
                      if (pending.length + p.length <= 16) {
                          pending.append(p)
                      } else {
                          flush()
                          if (p.length <= 18) {
                              pending.append(p)
                          } else {
                              var i = 0
                              while (i < p.length) {
                                  val end = minOf(i + 14, p.length)
                                  out.add(p.substring(i, end))
                                  i = end
                              }
                          }
                      }
                  }
                  flush()
                  return out.filter { it.length >= 2 }
              }
          
              private fun speakNext() {
                  if (!speechBusy.compareAndSet(false, true)) return
                  val text = speechQueue.poll()
                  if (text == null) {
                      speechBusy.set(false)
                      return
                  }
          
                  if (localVoice.isReady() && localVoice.speak(text)) {
                      voiceStatus.text = "🧬 即时用本人音色朗读…"
                      return
                  }
                  if (systemTtsReady) {
                      speakSystem(text)
                  } else {
                      finishSpeech("⚠ 当前没有可用中文声音")
                  }
              }
          
              private fun speakSystem(text: String) {
                  val tts = systemTts
                  if (!systemTtsReady || tts == null) {
                      finishSpeech("⚠ 系统中文声音不可用")
                      return
                  }
                  voiceStatus.text = "🔊 本人音色未就绪，使用系统中文即时朗读"
                  val id = "v13-${UUID.randomUUID()}"
                  val r = tts.speak(text, TextToSpeech.QUEUE_FLUSH, null, id)
                  if (r == TextToSpeech.ERROR) finishSpeech("⚠ 中文朗读启动失败")
              }
          
              private fun finishSpeech(message: String) {
                  speechBusy.set(false)
                  if (message.isNotBlank()) voiceStatus.text = message
                  speakNext()
              }
          
              private fun toggleVoiceRecording() {
                  if (checkSelfPermission(Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                      requestPermissions(arrayOf(Manifest.permission.RECORD_AUDIO), 1301)
                      return
                  }
                  if (asr.isListening()) {
                      asr.stop()
                      Toast.makeText(this, "已暂停同传，先录制本人声音", Toast.LENGTH_SHORT).show()
                  }
                  localVoice.toggleRecording()
              }
          
              private fun renderRaw() {
                  val s = StringBuilder(rawHistory)
                  if (partialRaw.isNotBlank()) {
                      if (s.isNotEmpty()) s.append("\n\n")
                      s.append("… ").append(partialRaw)
                  }
                  rawText.text = if (s.isEmpty()) "等待对方说阿拉伯语……" else s.toString()
              }
          
              private fun clearAll() {
                  rawHistory.setLength(0)
                  msaHistory.setLength(0)
                  zhHistory.setLength(0)
                  pendingStableRaw.setLength(0)
                  partialRaw = ""
                  translationQueue.clear()
                  speechQueue.clear()
                  renderRaw()
                  msaText.text = "方言会在这里被规范成标准阿拉伯语（MSA）。"
                  zhText.text = "中文稳定片段会立即显示并朗读。"
              }
          
