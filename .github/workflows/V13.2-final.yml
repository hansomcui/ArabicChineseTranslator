      - name: Static acceptance checks
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYCHECK'
          from pathlib import Path
          gradle = Path('app/build.gradle').read_text()
          asr = Path('app/src/main/java/com/hansom/arzhv13/DialectAsrEngine.kt').read_text()
          main = Path('app/src/main/java/com/hansom/arzhv13/MainActivity.kt').read_text()
          rolling = Path('app/src/main/java/com/hansom/arzhv13/RollingTranscriptAssembler.kt').read_text()

          checks = {
              'new application id': "applicationId 'com.hansom.arzhv132'" in gradle,
              'version 13.2': "versionName '13.2'" in gradle,
              'persistent signing': 'signingConfig signingConfigs.v132Fixed' in gradle,
              'mic self test': 'startMicSelfTest()' in asr and '麦克风自检 5 秒' in main,
              'PCM telemetry': 'onMicTelemetry' in asr and 'PCM：' in main,
              'decode telemetry': 'onDecodeTelemetry' in asr and 'Whisper：' in main,
              'MIC source available': 'MediaRecorder.AudioSource.MIC' in asr,
              'no AEC': 'AcousticEchoCanceler' not in asr,
              'silent source auto switch': '近乎无声，自动切换' in asr,
              'dead read auto switch': '没有返回有效PCM，自动切换' in asr,
              'selftest dead read switch': '没有返回有效PCM，自检切换' in asr,
              'rolling whitespace fixed': r'Regex("""\s+""")' in rolling,
              'dialect ASR model': 'whisper-large-v3-turbo-arabic-dialectal-v2-gguf' in asr,
          }
          bad = [k for k,v in checks.items() if not v]
          for k,v in checks.items(): print(('PASS ' if v else 'FAIL ') + k)
          if bad: raise SystemExit('Static checks failed: ' + ', '.join(bad))
          PYCHECK

