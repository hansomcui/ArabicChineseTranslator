name: Build Arabic Live Interpreter V13.2 Mic Diagnostic

on:
  push:
    paths:
      - '.github/workflows/V13.2-mic-diagnostic.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Install Android native toolchain
        shell: bash
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;25.2.9519653" "cmake;3.22.1"

      - name: Reuse proven V13.1 project generator
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYGEN'
          from pathlib import Path
          import textwrap

          src = Path('.github/workflows/V13.1.yml').read_text(encoding='utf-8')

          def extract(name, out):
              marker = f"      - name: {name}\n"
              a = src.index(marker)
              r = src.index("        run: |\n", a) + len("        run: |\n")
              n = src.find("\n      - name:", r)
              if n < 0:
                  n = len(src)
              Path(out).write_text(textwrap.dedent(src[r:n]) + "\n", encoding='utf-8')

          extract('Fetch Whisper and sherpa runtimes', '/tmp/v131-fetch.sh')
          extract('Generate Android project', '/tmp/v131-generate.sh')
          PYGEN
          bash /tmp/v131-fetch.sh
          bash /tmp/v131-generate.sh

      - name: Apply V13.1 transcript regex fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYFIX'
          from pathlib import Path
          fixes = {
              Path('app/src/main/java/com/hansom/arzhv13/RollingTranscriptAssembler.kt'): [
                  (r'Regex("""\\s+""")', r'Regex("""\s+""")'),
                  (r'Regex("""[^\\p{L}\\p{N}]""")', r'Regex("""[^\p{L}\p{N}]""")'),
              ],
          }
          for path, replacements in fixes.items():
              s = path.read_text(encoding='utf-8')
              for old, new in replacements:
                  if old not in s:
                      raise SystemExit(f'Expected V13.1 pattern missing: {old}')
                  s = s.replace(old, new)
              path.write_text(s, encoding='utf-8')
          PYFIX

      - name: Install V13.2 microphone diagnostic engine
        shell: bash
        run: |
          set -euo pipefail
          cat > app/src/main/java/com/hansom/arzhv13/DialectAsrEngine.kt <<'EOFENGINE'
          package com.hansom.arzhv132
          
          import android.Manifest
          import android.content.Context
          import android.content.pm.PackageManager
          import android.media.AudioFormat
          import android.media.AudioAttributes
          import android.media.AudioRecord
          import android.media.AudioTrack
          import android.media.MediaRecorder
          import android.os.Handler
          import android.os.Looper
          import com.whispercpp.java.whisper.WhisperLib
          import java.io.File
          import java.io.FileOutputStream
          import java.net.HttpURLConnection
          import java.net.URL
          import java.util.ArrayDeque
          import java.util.concurrent.Executors
          import java.util.concurrent.atomic.AtomicBoolean
          import kotlin.concurrent.thread
          import kotlin.math.max
          import kotlin.math.sqrt
          
          class DialectAsrEngine(
              private val context: Context,
              private val listener: Listener,
          ) {
              interface Listener {
                  fun onStatus(text: String)
                  fun onModelReady(ready: Boolean)
                  fun onListeningChanged(listening: Boolean)
                  fun onMicTelemetry(source: String, levelPercent: Int, totalSamples: Long, lastRead: Int)
                  fun onDecodeTelemetry(audioMs: Int, latencyMs: Long, chars: Int)
                  fun onMicSelfTestChanged(running: Boolean, message: String)
                  fun onPartial(text: String)
                  fun onStable(text: String)
                  fun onFinal(text: String)
              }
          
              companion object {
                  private const val SAMPLE_RATE = 16000
                  private const val MODEL_FILE = "ggml-model-q4_k.bin"
                  private const val MODEL_URL =
                      "https://huggingface.co/dmouayad/whisper-large-v3-turbo-arabic-dialectal-v2-gguf/resolve/main/ggml-model-q4_k.bin?download=true"
                  private const val MIN_MODEL_BYTES = 430_000_000L
          
                  // V13.1: continuous capture. Audio is NEVER discarded by VAD.
                  private const val WINDOW_MS = 6200
                  private const val MIN_DECODE_MS = 1600
                  private const val HOP_MS = 1250L
                  private const val SILENCE_FLUSH_MS = 950L
                  private const val VERY_LOW_SIGNAL_RMS = 0.0018f
                  private const val SOURCE_LOCK_RMS = 0.0040f
                  private const val AUTO_SWITCH_RMS = 0.0012f
                  private const val AUTO_SWITCH_AFTER_MS = 2200L
                  private const val SELF_TEST_MS = 5000L
                  private const val WHISPER_THREADS = 6
              }
          
              private data class DecodeRequest(
                  val samples: FloatArray,
                  val segmentId: Long,
                  val flush: Boolean,
              )
          
              private val main = Handler(Looper.getMainLooper())
              private val modelDir = File(context.filesDir, "v132_dialect_asr")
              private val modelFile = File(modelDir, MODEL_FILE)
              private val modelBusy = AtomicBoolean(false)
              private val initBusy = AtomicBoolean(false)
              private val listening = AtomicBoolean(false)
              private val selfTestBusy = AtomicBoolean(false)
              private val workerActive = AtomicBoolean(false)
              private val decodeExecutor = Executors.newSingleThreadExecutor()
              private val pendingLock = Any()
              private val pendingFinals = ArrayDeque<DecodeRequest>()
              private var pendingLatest: DecodeRequest? = null
          
              @Volatile private var contextPtr = 0L
              @Volatile private var recorder: AudioRecord? = null
              @Volatile private var captureThread: Thread? = null
              private val micPrefs = context.getSharedPreferences("v132_mic", Context.MODE_PRIVATE)
          
              // Accessed only on decodeExecutor.
              private val transcriptAssembler = RollingTranscriptAssembler()
          
              fun isModelReady(): Boolean = modelFile.isFile && modelFile.length() >= MIN_MODEL_BYTES
              fun isReady(): Boolean = isModelReady() && contextPtr != 0L
              fun isListening(): Boolean = listening.get()
          
              fun initializeIfPossible() {
                  if (!isModelReady()) {
                      notifyModelReady(false)
                      status("🧠 方言识别模型未下载 · 首次约 474 MB")
                      return
                  }
                  if (contextPtr != 0L) {
                      notifyModelReady(true)
                      status("✅ V13.2 方言识别已就绪")
                      return
                  }
                  if (!initBusy.compareAndSet(false, true)) return
                  status("● 正在加载阿语方言识别模型…")
                  thread(name = "v132-asr-init") {
                      try {
                          val p = WhisperLib.initContext(modelFile.absolutePath)
                          if (p == 0L) throw IllegalStateException("Whisper 模型加载失败")
                          contextPtr = p
                          notifyModelReady(true)
                          status("✅ 连续 ASR 已就绪 · Gulf/Kuwait/Egypt/Iraq/Levant")
                      } catch (t: Throwable) {
                          contextPtr = 0L
                          notifyModelReady(false)
                          status("❌ 方言模型加载失败：${shortMessage(t)}")
                      } finally {
                          initBusy.set(false)
                      }
                  }
              }
          
              fun ensureModel() {
                  if (isModelReady()) {
                      status("✅ 方言识别模型已下载，正在加载…")
                      initializeIfPossible()
                      return
                  }
                  if (!modelBusy.compareAndSet(false, true)) {
                      status("● 方言模型正在下载，请稍等…")
                      return
                  }
                  thread(name = "v132-asr-model-download") {
                      try {
                          modelDir.mkdirs()
                          downloadResumable(MODEL_URL, modelFile, "阿语方言 ASR")
                          if (!isModelReady()) {
                              modelFile.delete()
                              throw IllegalStateException("模型文件大小异常，请重新下载")
                          }
                          status("✅ 方言模型下载完成，正在加载…")
                          initializeIfPossible()
                      } catch (t: Throwable) {
                          notifyModelReady(false)
                          status("❌ 方言模型下载失败：${shortMessage(t)}")
                      } finally {
                          modelBusy.set(false)
                      }
                  }
              }
          
              fun start() {
                  if (selfTestBusy.get()) {
                      status("⚠ 麦克风自检正在运行，请等待回放结束")
                      return
                  }
                  if (context.checkSelfPermission(Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                      status("⚠ 请先允许麦克风权限")
                      return
                  }
                  if (!isReady()) {
                      status("⚠ 请先下载并加载方言识别模型")
                      return
                  }
                  if (!listening.compareAndSet(false, true)) return
                  clearPendingDecodes()
                  notifyListening(true)
                  captureThread = thread(name = "v132-continuous-mic") {
                      try { captureLoop() } finally { captureThread = null }
                  }
              }
          
              fun stop() {
                  if (!listening.compareAndSet(true, false)) return
                  runCatching { recorder?.stop() }
                  notifyListening(false)
                  status("■ 同传已停止")
              }
          
              fun startMicSelfTest() {
                  if (context.checkSelfPermission(Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                      status("⚠ 请先允许麦克风权限")
                      return
                  }
                  if (!selfTestBusy.compareAndSet(false, true)) return
                  if (isListening()) stop()
                  notifyMicSelfTest(true, "🎧 麦克风自检：请连续说话 5 秒")
          
                  thread(name = "v132-mic-selftest") {
                      val minBuf = AudioRecord.getMinBufferSize(
                          SAMPLE_RATE,
                          AudioFormat.CHANNEL_IN_MONO,
                          AudioFormat.ENCODING_PCM_16BIT,
                      )
                      if (minBuf <= 0) {
                          selfTestBusy.set(false)
                          notifyMicSelfTest(false, "❌ 无法取得录音缓冲区")
                          return@thread
                      }
          
                      val bufferBytes = max(minBuf * 2, 8192)
                      val sourceOrder = sourceCandidates()
                      var sourceIndex = 0
                      var rec = openRecorder(sourceOrder[sourceIndex], bufferBytes)
                      if (rec == null) {
                          while (++sourceIndex < sourceOrder.size && rec == null) {
                              rec = openRecorder(sourceOrder[sourceIndex], bufferBytes)
                          }
                      }
                      var activeRec: AudioRecord = rec ?: run {
                          selfTestBusy.set(false)
                          notifyMicSelfTest(false, "❌ 三种麦克风输入都无法启动")
                          return@thread
                      }
          
                      val maxSamples = SAMPLE_RATE * 6
                      val captured = ShortArray(maxSamples)
                      val buf = ShortArray(bufferBytes / 2)
                      var capturedCount = 0
                      var totalSamples = 0L
                      var currentSource = sourceOrder[sourceIndex]
                      var sourceStart = System.currentTimeMillis()
                      var sourcePeak = 0f
                      var bestPeak = 0f
                      var bestSource = currentSource
                      var switches = 0
                      var lastTelemetry = 0L
                      val endAt = System.currentTimeMillis() + SELF_TEST_MS
          
                      try {
                          while (System.currentTimeMillis() < endAt) {
                              val n = activeRec.read(buf, 0, buf.size)
                              val now = System.currentTimeMillis()
                              if (n > 0) {
                                  totalSamples += n
                                  val copy = minOf(n, maxSamples - capturedCount)
                                  if (copy > 0) {
                                      System.arraycopy(buf, 0, captured, capturedCount, copy)
                                      capturedCount += copy
                                  }
                                  val level = rms(buf, n)
                                  sourcePeak = maxOf(sourcePeak, level)
                                  if (level > bestPeak) {
                                      bestPeak = level
                                      bestSource = currentSource
                                  }
                                  if (now - lastTelemetry >= 120L) {
                                      lastTelemetry = now
                                      emitMicTelemetry(currentSource, MicSignalLogic.levelPercent(level), totalSamples, n)
                                  }
          
                                  if (MicSignalLogic.shouldSwitch(
                                          elapsedMs = now - sourceStart,
                                          peakRms = sourcePeak,
                                          verified = false,
                                          switches = switches,
                                          maxSwitches = sourceOrder.size - 1,
                                      )
                                  ) {
                                      val old = currentSource
                                      runCatching { activeRec.stop() }
                                      runCatching { activeRec.release() }
                                      switches++
                                      sourceIndex = (sourceIndex + 1).coerceAtMost(sourceOrder.lastIndex)
                                      currentSource = sourceOrder[sourceIndex]
                                      activeRec = openRecorder(currentSource, bufferBytes) ?: run {
                                          selfTestBusy.set(false)
                                          notifyMicSelfTest(false, "❌ ${sourceLabel(currentSource)} 无法启动")
                                          return@thread
                                      }
                                      sourceStart = now
                                      sourcePeak = 0f
                                      status("⚠ ${sourceLabel(old)} 电平过低，自检切换到 ${sourceLabel(currentSource)}")
                                  }
                              } else {
                                  if (now - lastTelemetry >= 250L) {
                                      lastTelemetry = now
                                      emitMicTelemetry(currentSource, 0, totalSamples, n)
                                  }
                                  if (MicSignalLogic.shouldSwitch(
                                          elapsedMs = now - sourceStart,
                                          peakRms = sourcePeak,
                                          verified = false,
                                          switches = switches,
                                          maxSwitches = sourceOrder.size - 1,
                                      )
                                  ) {
                                      val old = currentSource
                                      runCatching { activeRec.stop() }
                                      runCatching { activeRec.release() }
                                      switches++
                                      sourceIndex = (sourceIndex + 1).coerceAtMost(sourceOrder.lastIndex)
                                      currentSource = sourceOrder[sourceIndex]
                                      activeRec = openRecorder(currentSource, bufferBytes) ?: run {
                                          selfTestBusy.set(false)
                                          notifyMicSelfTest(false, "❌ ${sourceLabel(currentSource)} 无法启动")
                                          return@thread
                                      }
                                      sourceStart = now
                                      sourcePeak = 0f
                                      status("⚠ ${sourceLabel(old)} 没有返回有效PCM，自检切换到 ${sourceLabel(currentSource)}")
                                  } else {
                                      Thread.sleep(10)
                                  }
                              }
                          }
                      } catch (t: Throwable) {
                          selfTestBusy.set(false)
                          notifyMicSelfTest(false, "❌ 自检录音异常：${shortMessage(t)}")
                          return@thread
                      } finally {
                          runCatching { activeRec.stop() }
                          runCatching { activeRec.release() }
                      }
          
                      if (bestPeak >= SOURCE_LOCK_RMS) {
                          micPrefs.edit()
                              .putInt("preferred_source", bestSource)
                              .putBoolean("source_verified", true)
                              .apply()
                      }
          
                      val bestPct = MicSignalLogic.levelPercent(bestPeak)
                      if (capturedCount <= 0) {
                          notifyMicSelfTest(false, "❌ 自检完成但没有收到任何 PCM 数据")
                          selfTestBusy.set(false)
                          return@thread
                      }
          
                      val verdict = if (bestPeak >= SOURCE_LOCK_RMS) {
                          "✅ 自检收到声音：${sourceLabel(bestSource)} · 峰值 $bestPct% · PCM $capturedCount samples"
                      } else {
                          "⚠ 自检收到 PCM，但声音电平接近 0：峰值 $bestPct% · PCM $capturedCount samples"
                      }
                      notifyMicSelfTest(true, "$verdict\n▶ 正在回放刚才 5 秒录音…")
                      playPcm(captured, capturedCount)
                      selfTestBusy.set(false)
                      notifyMicSelfTest(false, "$verdict\n✅ 回放结束：能听见自己=麦克风链路正常；听不见=继续查音频输入")
                  }
              }
          
              private fun captureLoop() {
                  val minBuf = AudioRecord.getMinBufferSize(
                      SAMPLE_RATE,
                      AudioFormat.CHANNEL_IN_MONO,
                      AudioFormat.ENCODING_PCM_16BIT,
                  )
                  if (minBuf <= 0) {
                      listening.set(false)
                      notifyListening(false)
                      status("❌ 手机录音初始化失败")
                      return
                  }
          
                  val bufferBytes = max(minBuf * 2, 8192)
                  val sourceOrder = sourceCandidates()
                  val verified = micPrefs.getBoolean("source_verified", false)
                  var sourceIndex = 0
                  var rec = openRecorder(sourceOrder[sourceIndex], bufferBytes)
                  while (rec == null && sourceIndex < sourceOrder.lastIndex) {
                      sourceIndex++
                      rec = openRecorder(sourceOrder[sourceIndex], bufferBytes)
                  }
                  var activeRec: AudioRecord = rec ?: run {
                      listening.set(false)
                      notifyListening(false)
                      status("❌ 麦克风无法启动：MIC / VOICE_RECOGNITION / VOICE_COMMUNICATION 全部失败")
                      return
                  }
          
                  var currentSource = sourceOrder[sourceIndex]
                  recorder = activeRec
                  val buf = ShortArray(bufferBytes / 2)
                  val ring = ShortRing(SAMPLE_RATE * WINDOW_MS / 1000)
          
                  var segmentId = 1L
                  var lastSubmitAt = 0L
                  var lastSignalAt = System.currentTimeMillis()
                  var segmentHasSignal = false
                  var flushedForSilence = false
                  var totalSamples = 0L
                  var lastTelemetryAt = 0L
                  var sourceStartAt = System.currentTimeMillis()
                  var sourcePeak = 0f
                  var switches = 0
                  var sourceLocked = verified
          
                  try {
                      status("🎙 V13.2 连续收音：${sourceLabel(currentSource)} · AEC关闭")
                      while (listening.get()) {
                          val n = activeRec.read(buf, 0, buf.size)
                          val now = System.currentTimeMillis()
                          if (n <= 0) {
                              if (now - lastTelemetryAt >= 300L) {
                                  lastTelemetryAt = now
                                  emitMicTelemetry(currentSource, 0, totalSamples, n)
                              }
                              if (MicSignalLogic.shouldSwitch(
                                      elapsedMs = now - sourceStartAt,
                                      peakRms = sourcePeak,
                                      verified = sourceLocked,
                                      switches = switches,
                                      maxSwitches = sourceOrder.size - 1,
                                  )
                              ) {
                                  val old = currentSource
                                  runCatching { activeRec.stop() }
                                  runCatching { activeRec.release() }
                                  switches++
                                  sourceIndex = (sourceIndex + 1).coerceAtMost(sourceOrder.lastIndex)
                                  currentSource = sourceOrder[sourceIndex]
                                  activeRec = openRecorder(currentSource, bufferBytes) ?: throw IllegalStateException(
                                      "切换到 ${sourceLabel(currentSource)} 失败"
                                  )
                                  recorder = activeRec
                                  sourceStartAt = now
                                  sourcePeak = 0f
                                  ring.clear()
                                  segmentId++
                                  lastSubmitAt = now
                                  status("⚠ ${sourceLabel(old)} 没有返回有效PCM，自动切换到 ${sourceLabel(currentSource)}")
                              } else {
                                  Thread.sleep(8)
                              }
                              continue
                          }
          
                          totalSamples += n
                          ring.append(buf, n)
                          val level = rms(buf, n)
                          sourcePeak = maxOf(sourcePeak, level)
          
                          if (level >= SOURCE_LOCK_RMS) {
                              sourceLocked = true
                              micPrefs.edit()
                                  .putInt("preferred_source", currentSource)
                                  .putBoolean("source_verified", true)
                                  .apply()
                          }
          
                          if (now - lastTelemetryAt >= 120L) {
                              lastTelemetryAt = now
                              emitMicTelemetry(currentSource, MicSignalLogic.levelPercent(level), totalSamples, n)
                          }
          
                          // Only auto-switch while the source is still unverified. Once real speech is seen,
                          // keep the source fixed so ordinary pauses never cause routing changes.
                          if (MicSignalLogic.shouldSwitch(
                                  elapsedMs = now - sourceStartAt,
                                  peakRms = sourcePeak,
                                  verified = sourceLocked,
                                  switches = switches,
                                  maxSwitches = sourceOrder.size - 1,
                              )
                          ) {
                              val old = currentSource
                              runCatching { activeRec.stop() }
                              runCatching { activeRec.release() }
                              switches++
                              sourceIndex = (sourceIndex + 1).coerceAtMost(sourceOrder.lastIndex)
                              currentSource = sourceOrder[sourceIndex]
                              activeRec = openRecorder(currentSource, bufferBytes) ?: throw IllegalStateException(
                                  "切换到 ${sourceLabel(currentSource)} 失败"
                              )
                              recorder = activeRec
                              sourceStartAt = now
                              sourcePeak = 0f
                              ring.clear()
                              segmentId++
                              lastSubmitAt = now
                              status("⚠ ${sourceLabel(old)} 近乎无声，自动切换到 ${sourceLabel(currentSource)}")
                              continue
                          }
          
                          // Energy is only used to decide sentence flush. It never discards captured PCM.
                          if (level >= VERY_LOW_SIGNAL_RMS) {
                              lastSignalAt = now
                              segmentHasSignal = true
                              flushedForSilence = false
                          }
          
                          val bufferedMs = ring.size * 1000 / SAMPLE_RATE
                          if (bufferedMs >= MIN_DECODE_MS && now - lastSubmitAt >= HOP_MS) {
                              lastSubmitAt = now
                              submitDecode(
                                  DecodeRequest(
                                      samples = ring.toFloatArray(),
                                      segmentId = segmentId,
                                      flush = false,
                                  )
                              )
                          }
          
                          if (segmentHasSignal && !flushedForSilence && now - lastSignalAt >= SILENCE_FLUSH_MS) {
                              val snapshot = ring.toFloatArray()
                              if (snapshot.isNotEmpty()) {
                                  submitDecode(DecodeRequest(snapshot, segmentId, flush = true))
                              }
                              flushedForSilence = true
                              segmentHasSignal = false
                              ring.clear()
                              segmentId++
                              lastSubmitAt = now
                              status("🎙 已提交上一句 · ${sourceLabel(currentSource)} 继续收音")
                          }
                      }
          
                      val tail = ring.toFloatArray()
                      if (tail.size * 1000 / SAMPLE_RATE >= 300) {
                          submitDecode(DecodeRequest(tail, segmentId, flush = true))
                      }
                  } catch (t: Throwable) {
                      if (listening.get()) status("❌ 实时录音异常：${shortMessage(t)}")
                  } finally {
                      listening.set(false)
                      runCatching { activeRec.stop() }
                      runCatching { activeRec.release() }
                      recorder = null
                      notifyListening(false)
                  }
              }
          
              private fun sourceCandidates(): IntArray {
                  val preferred = micPrefs.getInt("preferred_source", MediaRecorder.AudioSource.MIC)
                  val base = intArrayOf(
                      preferred,
                      MediaRecorder.AudioSource.MIC,
                      MediaRecorder.AudioSource.VOICE_RECOGNITION,
                      MediaRecorder.AudioSource.VOICE_COMMUNICATION,
                  )
                  val out = ArrayList<Int>()
                  for (s in base) if (!out.contains(s)) out.add(s)
                  return out.toIntArray()
              }
          
              private fun sourceLabel(source: Int): String = when (source) {
                  MediaRecorder.AudioSource.MIC -> "MIC"
                  MediaRecorder.AudioSource.VOICE_RECOGNITION -> "VOICE_RECOGNITION"
                  MediaRecorder.AudioSource.VOICE_COMMUNICATION -> "VOICE_COMMUNICATION"
                  else -> "SOURCE_$source"
              }
          
              private fun openRecorder(source: Int, bufferBytes: Int): AudioRecord? = runCatching {
                  val ar = AudioRecord(
                      source,
                      SAMPLE_RATE,
                      AudioFormat.CHANNEL_IN_MONO,
                      AudioFormat.ENCODING_PCM_16BIT,
                      bufferBytes,
                  )
                  if (ar.state != AudioRecord.STATE_INITIALIZED) {
                      ar.release()
                      null
                  } else {
                      ar.startRecording()
                      if (ar.recordingState != AudioRecord.RECORDSTATE_RECORDING) {
                          ar.release()
                          null
                      } else ar
                  }
              }.getOrNull()
          
              private fun playPcm(samples: ShortArray, count: Int) {
                  if (count <= 0) return
                  val minOut = AudioTrack.getMinBufferSize(
                      SAMPLE_RATE,
                      AudioFormat.CHANNEL_OUT_MONO,
                      AudioFormat.ENCODING_PCM_16BIT,
                  )
                  val track = AudioTrack.Builder()
                      .setAudioAttributes(
                          AudioAttributes.Builder()
                              .setUsage(AudioAttributes.USAGE_MEDIA)
                              .setContentType(AudioAttributes.CONTENT_TYPE_SPEECH)
                              .build()
                      )
                      .setAudioFormat(
                          AudioFormat.Builder()
                              .setSampleRate(SAMPLE_RATE)
                              .setEncoding(AudioFormat.ENCODING_PCM_16BIT)
                              .setChannelMask(AudioFormat.CHANNEL_OUT_MONO)
                              .build()
                      )
                      .setTransferMode(AudioTrack.MODE_STREAM)
                      .setBufferSizeInBytes(max(minOut, 8192))
                      .build()
                  try {
                      track.play()
                      var off = 0
                      while (off < count) {
                          val n = track.write(samples, off, count - off, AudioTrack.WRITE_BLOCKING)
                          if (n <= 0) break
                          off += n
                      }
                  } finally {
                      runCatching { track.stop() }
                      runCatching { track.release() }
                  }
