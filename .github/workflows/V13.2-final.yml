      - name: Verify APK round 1
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK" >/tmp/v132-unzip.txt
          tail -n 2 /tmp/v132-unzip.txt
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/'
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/libwhisper'
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/libsherpa-onnx-jni.so'

      - name: Verify APK round 2 and signing
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          APK=app/build/outputs/apk/debug/app-debug.apk
          OUT=dist/ArabicLiveInterpreter-V13.2-Mic-Diagnostic.apk
          cp "$APK" "$OUT"
          sha256sum "$OUT" | tee dist/SHA256.txt
          test $(stat -c%s "$OUT") -gt 10000000
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$OUT" | tee dist/SIGNATURE.txt
          grep -q 'Verified using v2 scheme' dist/SIGNATURE.txt
          grep -q '21:9b:74:c6:ce:62:e1:e2:bf:38:e4:b0:17:3b:91:0a:99:37:0e:2d:e3:03:29:63:99:eb:fd:c7:6c:5e:cd:40' <(tr '[:upper:]' '[:lower:]' < dist/SIGNATURE.txt)
          echo 'V13.2 APK + native libs + persistent signature verified.'

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ArabicLiveInterpreter-V13.2-Mic-Diagnostic-APK
          path: |
            dist/ArabicLiveInterpreter-V13.2-Mic-Diagnostic.apk
            dist/SHA256.txt
            dist/SIGNATURE.txt
          if-no-files-found: error
          retention-days: 30
