          package com.hansom.arzhv132
          
          import kotlin.math.roundToInt
          
          object MicSignalLogic {
              fun levelPercent(rms: Float): Int =
                  (rms.coerceAtLeast(0f) * 1200f).roundToInt().coerceIn(0, 100)
          
              fun shouldSwitch(
                  elapsedMs: Long,
                  peakRms: Float,
                  verified: Boolean,
                  switches: Int,
                  maxSwitches: Int,
              ): Boolean {
                  if (verified) return false
                  if (switches >= maxSwitches) return false
                  return elapsedMs >= 2200L && peakRms < 0.0012f
              }
          }
          EOFLOGIC

      - name: Give V13.2 a clean package and persistent test signature
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYPKG'
          from pathlib import Path

          # New application id avoids the temporary V13/V13.1 debug-signature collision.
          p = Path('app/build.gradle')
          s = p.read_text(encoding='utf-8')
          s = s.replace("namespace 'com.hansom.arzhv13'", "namespace 'com.hansom.arzhv132'")
          s = s.replace("applicationId 'com.hansom.arzhv13'", "applicationId 'com.hansom.arzhv132'")
          s = s.replace("versionCode 131", "versionCode 132")
          s = s.replace("versionName '13.1'", "versionName '13.2'")

          anchor = "    buildTypes {\n"
          signing = (
              "    signingConfigs {\n"
              "        v132Fixed {\n"
              "            storeFile file('../v132-fixed.jks')\n"
              "            storePassword 'V132TestKey2026!'\n"
              "            keyAlias 'v132dev'\n"
              "            keyPassword 'V132TestKey2026!'\n"
              "        }\n"
              "    }\n\n"
          )
          if anchor not in s:
              raise SystemExit('buildTypes anchor not found')
          s = s.replace(anchor, signing + anchor, 1)
          debug_anchor = "        debug {\n"
          if debug_anchor not in s:
              raise SystemExit('debug buildType anchor not found')
          s = s.replace(debug_anchor, debug_anchor + "            signingConfig signingConfigs.v132Fixed\n", 1)
          p.write_text(s, encoding='utf-8')

          # Move all generated Kotlin sources/tests to the V13.2 namespace.
          for root in [Path('app/src/main/java'), Path('app/src/test/java')]:
              if root.exists():
                  for f in root.rglob('*.kt'):
                      t = f.read_text(encoding='utf-8')
                      if t.startswith('package com.hansom.arzhv13\n'):
                          t = t.replace('package com.hansom.arzhv13\n', 'package com.hansom.arzhv132\n', 1)
                      t = t.replace('com.hansom.arzhv13.', 'com.hansom.arzhv132.')
                      f.write_text(t, encoding='utf-8')

          manifest = Path('app/src/main/AndroidManifest.xml')
          ms = manifest.read_text(encoding='utf-8')
          ms = ms.replace('阿语方言同传 V13.1', '阿语方言同传 V13.2')
          manifest.write_text(ms, encoding='utf-8')
          PYPKG

          echo '' | base64 -d > v132-fixed.jks
          keytool -list -keystore v132-fixed.jks -storepass 'V132TestKey2026!' -alias v132dev >/dev/null

      - name: Add V13.2 regression tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/test/java/com/hansom/arzhv132
          cat > app/src/test/java/com/hansom/arzhv132/MicSignalLogicTest.kt <<'EOFTEST'
          package com.hansom.arzhv132

          import org.junit.Assert.assertEquals
          import org.junit.Assert.assertFalse
          import org.junit.Assert.assertTrue
          import org.junit.Test

          class MicSignalLogicTest {
              @Test fun visibleLevelIsBounded() {
                  assertEquals(0, MicSignalLogic.levelPercent(0f))
                  assertTrue(MicSignalLogic.levelPercent(0.01f) > 0)
                  assertEquals(100, MicSignalLogic.levelPercent(9f))
              }

              @Test fun deadOrNearSilentSourceSwitchesAfterTwoSeconds() {
                  assertFalse(MicSignalLogic.shouldSwitch(1500, 0f, false, 0, 2))
                  assertTrue(MicSignalLogic.shouldSwitch(2300, 0.0002f, false, 0, 2))
              }

              @Test fun verifiedSourceNeverSwitchesDuringNormalPause() {
                  assertFalse(MicSignalLogic.shouldSwitch(9000, 0f, true, 0, 2))
              }

              @Test fun sourceCyclingStopsAtMaximum() {
                  assertFalse(MicSignalLogic.shouldSwitch(9000, 0f, false, 2, 2))
              }
          }
          EOFTEST

