              private class ShortRing(private val capacity: Int) {
                  private val a = ShortArray(max(1, capacity))
                  private var pos = 0
                  private var count = 0
          
                  val size: Int get() = count
          
                  fun clear() { pos = 0; count = 0 }
          
                  fun append(src: ShortArray, n: Int) {
                      for (i in 0 until n) {
                          a[pos] = src[i]
                          pos = (pos + 1) % a.size
                          if (count < a.size) count++
                      }
                  }
          
                  fun toFloatArray(): FloatArray {
                      val out = FloatArray(count)
                      val start = (pos - count + a.size) % a.size
                      for (i in 0 until count) {
                          out[i] = a[(start + i) % a.size] / 32768.0f
                      }
                      return out
                  }
              }
