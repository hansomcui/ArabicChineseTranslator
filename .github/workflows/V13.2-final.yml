                  target.parentFile?.mkdirs()
                  val part = File(target.absolutePath + ".part")
                  var existing = if (part.isFile) part.length() else 0L
                  var conn = openFollowingRedirects(urlText, if (existing > 0) existing else null)
          
                  if (existing > 0 && conn.responseCode != HttpURLConnection.HTTP_PARTIAL) {
                      conn.disconnect()
                      part.delete()
                      existing = 0L
                      conn = openFollowingRedirects(urlText, null)
                  }
          
                  try {
                      val reported = conn.contentLengthLong
                      val total = if (reported > 0) reported + existing else -1L
                      conn.inputStream.use { input ->
                          FileOutputStream(part, existing > 0).use { output ->
                              val buf = ByteArray(256 * 1024)
                              var done = existing
                              var lastUi = 0L
                              while (true) {
                                  val n = input.read(buf)
                                  if (n < 0) break
                                  output.write(buf, 0, n)
                                  done += n
                                  val now = System.currentTimeMillis()
                                  if (now - lastUi > 700) {
                                      lastUi = now
                                      val mb = done / 1024.0 / 1024.0
                                      if (total > 0) {
                                          val pct = (done * 100 / total).coerceIn(0, 100)
                                          status("⬇ $label：$pct% · ${"%.0f".format(mb)} MB")
                                      } else {
                                          status("⬇ $label：${"%.0f".format(mb)} MB")
                                      }
                                  }
                              }
                              output.flush()
                          }
                      }
                      if (part.length() < MIN_MODEL_BYTES) {
                          throw IllegalStateException("模型下载不完整：${part.length() / 1024 / 1024} MB")
                      }
                      if (target.exists()) target.delete()
                      if (!part.renameTo(target)) {
                          part.copyTo(target, overwrite = true)
                          part.delete()
                      }
                  } finally {
                      conn.disconnect()
                  }
              }
          
              private fun openFollowingRedirects(urlText: String, rangeStart: Long?): HttpURLConnection {
                  var current = urlText
                  repeat(10) {
                      val c = (URL(current).openConnection() as HttpURLConnection).apply {
                          instanceFollowRedirects = false
                          connectTimeout = 20000
                          readTimeout = 180000
                          requestMethod = "GET"
                          setRequestProperty("User-Agent", "ArabicLiveInterpreter-V13.2/1.0")
                          setRequestProperty("Accept", "*/*")
                          if (rangeStart != null && rangeStart > 0) setRequestProperty("Range", "bytes=$rangeStart-")
                      }
                      val code = c.responseCode
                      if (code in 200..299) return c
                      if (code in listOf(301, 302, 303, 307, 308)) {
                          val location = c.getHeaderField("Location") ?: error("下载重定向缺少地址")
