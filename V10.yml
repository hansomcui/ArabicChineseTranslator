                  input.setSingleLine(true);
                  if (!voiceServerUrl.isEmpty()) input.setText(voiceServerUrl);

                  new AlertDialog.Builder(this)
                          .setTitle("GPT-SoVITS 免费语音服务器")
                          .setMessage("电脑运行 GPT-SoVITS + MyVoice Gateway 后，填入电脑局域网地址。"
                                  + "没有服务器也能用，App 会自动使用手机系统中文朗读。")
                          .setView(input)
                          .setPositiveButton("保存并检测", (d, w) -> {
                              voiceServerUrl = normalizeServerUrl(input.getText().toString());
                              prefs.edit()
                                      .putString("voice_server_url", voiceServerUrl)
                                      .remove("voice_ref_path")
                                      .apply();
                              voiceRefPath = "";
                              serverButton.setText(voiceServerUrl.isEmpty()
                                      ? "① 设置免费语音服务器"
                                      : "① 免费语音服务器已设置");
                              if (voiceServerUrl.isEmpty()) {
                                  voiceStatusText.setText("🔊 朗读模式：手机系统中文（免费兜底）");
                              } else {
                                  checkVoiceServer();
                              }
                          })
                          .setNegativeButton("取消", null)
                          .show();
              }

              private void checkVoiceServer() {
                  if (voiceServerUrl.isEmpty()) return;
                  voiceStatusText.setText("⏳ 正在检测免费语音服务器…");
                  new Thread(() -> {
                      HttpURLConnection conn = null;
                      try {
                          URL url = new URL(voiceServerUrl + "/health");
                          conn = (HttpURLConnection) url.openConnection();
                          conn.setRequestMethod("GET");
                          conn.setConnectTimeout(3500);
                          conn.setReadTimeout(3500);
                          int code = conn.getResponseCode();
                          if (code >= 200 && code < 300) {
                              runOnUiThread(() -> voiceStatusText.setText(
                                      customVoiceReady()
                                              ? "✅ 我的声音：GPT-SoVITS 已就绪"
                                              : "✅ 服务器已连接，请录制本人声音"
                              ));
                          } else {
                              throw new Exception("HTTP " + code);
                          }
                      } catch (Exception e) {
                          runOnUiThread(() -> voiceStatusText.setText(
                                  "⚠ 服务器暂不可用，已自动使用手机系统中文朗读"
                          ));
                      } finally {
                          if (conn != null) conn.disconnect();
                      }
                  }).start();
              }

              private void toggleVoiceRecording() {
                  if (checkSelfPermission(Manifest.permission.RECORD_AUDIO)
                          != PackageManager.PERMISSION_GRANTED) {
                      requestPermissions(new String[]{Manifest.permission.RECORD_AUDIO}, 1001);
                      return;
                  }

                  if (voiceServerUrl.isEmpty()) {
                      Toast.makeText(this,
                              "先设置免费语音服务器；不设置也可以直接用系统中文朗读",
                              Toast.LENGTH_LONG).show();
                      return;
                  }

                  if (!recordingVoice) {
                      new AlertDialog.Builder(this)
                              .setTitle("请照着读 8–12 秒")
                              .setMessage(VOICE_PROMPT + "\n\n点击“开始”后自然朗读，读完再点停止。")
                              .setPositiveButton("开始", (d, w) -> startVoiceRecording())
                              .setNegativeButton("取消", null)
                              .show();
                  } else {
                      stopVoiceRecordingAndUpload();
                  }
              }

              private void startVoiceRecording() {
                  try {
                      if (recognizer != null) {
                          try { recognizer.cancel(); } catch (Exception ignored) {}
                          recognizerActive = false;
                      }
                      restartPending = false;

                      voiceSampleFile = new File(getCacheDir(), "my_voice_sample.m4a");
                      if (voiceSampleFile.exists()) voiceSampleFile.delete();

                      voiceRecorder = new MediaRecorder();
                      voiceRecorder.setAudioSource(MediaRecorder.AudioSource.MIC);
                      voiceRecorder.setOutputFormat(MediaRecorder.OutputFormat.MPEG_4);
                      voiceRecorder.setAudioEncoder(MediaRecorder.AudioEncoder.AAC);
                      voiceRecorder.setAudioEncodingBitRate(128000);
                      voiceRecorder.setAudioSamplingRate(44100);
                      voiceRecorder.setOutputFile(voiceSampleFile.getAbsolutePath());
                      voiceRecorder.prepare();
                      voiceRecorder.start();

                      recordingVoice = true;
                      voiceRecordStartedAt = System.currentTimeMillis();
                      recordVoiceButton.setText("■ 停止录音并上传到我的电脑");
                      voiceStatusText.setText("🎙 正在录：请读——" + VOICE_PROMPT);
                      statusText.setText("● 正在录制本人音色样本");
                  } catch (Exception e) {
                      recordingVoice = false;
                      voiceStatusText.setText("录音启动失败：" + e.getMessage());
                      try { if (voiceRecorder != null) voiceRecorder.release(); } catch (Exception ignored) {}
                      voiceRecorder = null;
                  }
              }

              private void stopVoiceRecordingAndUpload() {
                  long seconds = Math.max(0L,
                          (System.currentTimeMillis() - voiceRecordStartedAt) / 1000L);
                  try {
                      if (voiceRecorder != null) {
                          voiceRecorder.stop();
                          voiceRecorder.release();
                      }
                  } catch (Exception e) {
                      Toast.makeText(this, "录音太短，请重新录制", Toast.LENGTH_LONG).show();
                  }
                  voiceRecorder = null;
                  recordingVoice = false;
                  recordVoiceButton.setText("② 重新录制我的声音");

                  if (voiceSampleFile == null || !voiceSampleFile.exists()
                          || voiceSampleFile.length() < 1000) {
                      voiceStatusText.setText("录音无效，请重新录制");
                      if (listening) scheduleRecognitionRestart(400L);
                      return;
                  }

                  if (seconds < 4) {
                      Toast.makeText(this,
                              "录音只有 " + seconds + " 秒，建议重新录 8–12 秒",
                              Toast.LENGTH_LONG).show();
                  }

                  voiceStatusText.setText("⏳ 正在把声音样本上传到你的免费语音服务器…");
                  uploadVoiceSample(voiceSampleFile);
              }

              private void uploadVoiceSample(File audioFile) {
                  new Thread(() -> {
                      HttpURLConnection conn = null;
                      try {
                          String boundary = "----FreeMyVoice" + System.currentTimeMillis();
                          URL url = new URL(voiceServerUrl + "/upload_ref");
                          conn = (HttpURLConnection) url.openConnection();
                          conn.setRequestMethod("POST");
                          conn.setConnectTimeout(10000);
                          conn.setReadTimeout(60000);
                          conn.setDoOutput(true);
                          conn.setRequestProperty(
                                  "Content-Type", "multipart/form-data; boundary=" + boundary);

                          try (DataOutputStream out =
                                       new DataOutputStream(conn.getOutputStream())) {
                              writeFormField(out, boundary, "prompt_text", VOICE_PROMPT);
                              out.writeBytes("--" + boundary + "\r\n");
                              out.writeBytes(
                                      "Content-Disposition: form-data; name=\"file\"; "
                                              + "filename=\"my_voice_sample.m4a\"\r\n");
                              out.writeBytes("Content-Type: audio/mp4\r\n\r\n");
                              try (InputStream fis =
                                           new java.io.FileInputStream(audioFile)) {
                                  byte[] buf = new byte[8192];
                                  int n;
                                  while ((n = fis.read(buf)) >= 0) out.write(buf, 0, n);
                              }
                              out.writeBytes("\r\n--" + boundary + "--\r\n");
                              out.flush();
                          }

                          int code = conn.getResponseCode();
                          InputStream is = code >= 200 && code < 300
                                  ? conn.getInputStream() : conn.getErrorStream();
                          String body = readAllText(is);
                          if (code >= 200 && code < 300) {
                              String ref = new JSONObject(body)
                                      .optString("ref_audio_path", "");
                              if (ref.isEmpty()) {
                                  throw new Exception("服务器没有返回 ref_audio_path");
                              }
                              voiceRefPath = ref;
                              prefs.edit().putString("voice_ref_path", ref).apply();
                              runOnUiThread(() -> {
                                  voiceStatusText.setText(
                                          "✅ 我的声音已就绪，翻译后会自动用本人音色朗读");
                                  Toast.makeText(this,
                                          "本人音色设置成功",
                                          Toast.LENGTH_LONG).show();
                                  if (listening) scheduleRecognitionRestart(450L);
                              });
                          } else {
                              throw new Exception("HTTP " + code + " " + body);
                          }
                      } catch (Exception e) {
                          String msg = e.getMessage() == null
                                  ? e.toString() : e.getMessage();
                          runOnUiThread(() -> {
                              voiceStatusText.setText(
                                      "⚠ 上传失败：" + msg + "；仍可使用系统中文朗读");
                              if (listening) scheduleRecognitionRestart(450L);
                          });
                      } finally {
                          if (conn != null) conn.disconnect();
                      }
                  }).start();
              }

              private void writeFormField(DataOutputStream out, String boundary,
                                          String name, String value) throws Exception {
                  out.writeBytes("--" + boundary + "\r\n");
                  out.writeBytes(
                          "Content-Disposition: form-data; name=\"" + name + "\"\r\n\r\n");
                  out.write(value.getBytes(StandardCharsets.UTF_8));
                  out.writeBytes("\r\n");
              }

              private String readAllText(InputStream is) throws Exception {
                  if (is == null) return "";
                  StringBuilder sb = new StringBuilder();
                  try (BufferedReader br = new BufferedReader(
                          new InputStreamReader(is, StandardCharsets.UTF_8))) {
                      String line;
                      while ((line = br.readLine()) != null) sb.append(line);
                  }
                  return sb.toString();
              }

              private void enqueueMyVoice(String chinese) {
                  if (chinese == null || chinese.trim().isEmpty()) return;
                  while (voiceQueue.size() >= 3) voiceQueue.poll();
                  voiceQueue.offer(chinese.trim());
                  synthesizeNextMyVoice();
              }

              private void synthesizeNextMyVoice() {
                  if (!voiceBusy.compareAndSet(false, true)) return;
                  String text = voiceQueue.poll();
                  if (text == null) {
                      voiceBusy.set(false);
                      return;
                  }

                  if (customVoiceReady()) {
                      requestCustomVoice(text);
                  } else {
                      speakSystemVoice(text);
                  }
              }

              private void requestCustomVoice(String text) {
                  new Thread(() -> {
                      HttpURLConnection conn = null;
                      try {
                          URL url = new URL(voiceServerUrl + "/tts");
                          conn = (HttpURLConnection) url.openConnection();
                          conn.setRequestMethod("POST");
                          conn.setConnectTimeout(7000);
                          conn.setReadTimeout(120000);
                          conn.setDoOutput(true);
                          conn.setRequestProperty(
                                  "Content-Type", "application/json; charset=UTF-8");

                          JSONObject body = new JSONObject();
                          body.put("text", text);
                          body.put("ref_audio_path", voiceRefPath);
                          body.put("prompt_text", VOICE_PROMPT);

                          try (OutputStream os = conn.getOutputStream()) {
                              os.write(body.toString().getBytes(StandardCharsets.UTF_8));
                          }

                          int code = conn.getResponseCode();
                          if (code < 200 || code >= 300) {
                              String err = readAllText(conn.getErrorStream());
                              throw new Exception("HTTP " + code + " " + err);
                          }

                          File wav = new File(
                                  getCacheDir(),
                                  "myvoice_" + System.currentTimeMillis() + ".wav");
                          try (InputStream in = conn.getInputStream();
                               FileOutputStream fos = new FileOutputStream(wav)) {
                              byte[] buf = new byte[8192];
                              int n;
                              while ((n = in.read(buf)) >= 0) fos.write(buf, 0, n);
                          }

                          runOnUiThread(() -> playMyVoiceFile(wav));
                      } catch (Exception e) {
                          runOnUiThread(() -> {
                              voiceStatusText.setText(
                                      "⚠ 本人音色服务器不可用，已自动切到系统中文声音");
                              speakSystemVoice(text);
                          });
                      } finally {
                          if (conn != null) conn.disconnect();
                      }
                  }).start();
              }

              private void prepareForSpeaking() {
                  speakingVoice = true;
                  restartPending = false;
                  if (recognizer != null) {
                      try { recognizer.cancel(); } catch (Exception ignored) {}
                      recognizerActive = false;
                  }
              }

              private void speakSystemVoice(String text) {
                  if (!systemTtsReady || systemTts == null) {
                      voiceBusy.set(false);
                      voiceStatusText.setText("⚠ 手机没有可用的中文TTS引擎");
                      if (listening) scheduleRecognitionRestart(250L);
                      synthesizeNextMyVoice();
                      return;
                  }

                  prepareForSpeaking();
                  String id = "myvoice-" + UUID.randomUUID();
                  int result = systemTts.speak(
                          text, TextToSpeech.QUEUE_FLUSH, null, id);
                  if (result == TextToSpeech.ERROR) {
                      finishVoicePlayback("⚠ 系统中文朗读启动失败");
                  } else {
                      voiceStatusText.setText(
                              customVoiceReady()
                                      ? "⚠ 本人音色不可用，正在用系统中文声音朗读"
                                      : "🔊 正在用手机系统中文声音朗读");
                  }
              }

              private void playMyVoiceFile(File wav) {
                  try {
                      prepareForSpeaking();
                      if (voicePlayer != null) {
                          try { voicePlayer.release(); } catch (Exception ignored) {}
                      }
                      voicePlayer = new MediaPlayer();
                      voicePlayer.setDataSource(wav.getAbsolutePath());
                      voicePlayer.setOnCompletionListener(mp -> {
                          try { mp.release(); } catch (Exception ignored) {}
                          voicePlayer = null;
                          if (wav.exists()) wav.delete();
                          finishVoicePlayback("✅ 我的声音已就绪");
                      });
                      voicePlayer.setOnErrorListener((mp, what, extra) -> {
                          try { mp.release(); } catch (Exception ignored) {}
                          voicePlayer = null;
                          if (wav.exists()) wav.delete();
                          finishVoicePlayback("⚠ 本人音色播放失败");
                          return true;
                      });
                      voicePlayer.prepare();
                      voicePlayer.start();
                      voiceStatusText.setText("🔊 正在用我的声音朗读中文");
                  } catch (Exception e) {
                      if (wav.exists()) wav.delete();
                      finishVoicePlayback("⚠ 本人音色播放失败");
                  }
              }

              private void finishVoicePlayback(String status) {
                  speakingVoice = false;
                  voiceBusy.set(false);
                  if (voiceStatusText != null) voiceStatusText.setText(status);
                  if (listening) scheduleRecognitionRestart(250L);
                  synthesizeNextMyVoice();
              }

              private void processQueue() {
                  if (!translating.compareAndSet(false, true)) return;
                  translateNext();
              }

              private void translateNext() {
                  String text = queue.poll();

                  if (text == null) {
                      translating.set(false);
                      if (listening) {
                          statusText.setText("● 正在听阿语 (" + speechLanguages[languageIndex] + ")");
                      } else {
                          statusText.setText("● 待机");
                      }
                      return;
                  }

                  String direct = exactPhraseHit(text);
                  if (direct != null) {
                      appendChinese(direct);
                      previousArabic = text;
                      previousChinese = direct;
                      rememberContext(text, direct);
                      translateNext();
                      return;
                  }

                  onlineTranslate(text, "", (onlineZh, online) -> {
                      if (online && onlineZh != null && !onlineZh.trim().isEmpty()) {
                          String finalZh = smartPostCorrect(text, onlineZh);
                          appendChinese(finalZh);
                          previousArabic = text;
                          previousChinese = finalZh;
                          rememberContext(text, finalZh);
                          statusText.setText("● 在线高精度 · 上下文已启用");
                          translateNext();
                          return;
                      }

                      if (modelReady) {
                          translator.translate(text)
                                  .addOnSuccessListener(localResult -> {
                                      String finalZh = smartPostCorrect(text, localResult);
                                      appendChinese(finalZh);
                                      previousArabic = text;
                                      previousChinese = finalZh;
                                      rememberContext(text, finalZh);
                                      statusText.setText("● 本地备用翻译");
                                      translateNext();
                                  })
                                  .addOnFailureListener(e -> {
                                      appendChinese("[暂时无法翻译]");
                                      statusText.setText("● 翻译服务暂不可用");
                                      translateNext();
                                  });
                      } else {
                          appendChinese("[在线翻译暂不可用]");
                          statusText.setText("● 在线翻译暂不可用");
                          translateNext();
                      }
                  });
              }

              @Override
              protected void onDestroy() {
                  listening = false;

                  if (recognizer != null) {
                      recognizer.destroy();
                  }

                  if (translator != null) {
                      translator.close();
                  }

                  try { if (voiceRecorder != null) voiceRecorder.release(); } catch (Exception ignored) {}
                  try { if (voicePlayer != null) voicePlayer.release(); } catch (Exception ignored) {}
                  try {
                      if (systemTts != null) {
                          systemTts.stop();
                          systemTts.shutdown();
                      }
                  } catch (Exception ignored) {}

                  super.onDestroy();
              }
          }
          EOF

      - name: Static sanity checks
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s = Path('app/src/main/java/com/hansom/arzhv10/MainActivity.java').read_text(encoding='utf-8')
          checks = {
              'Kuwait Arabic locale': '"ar-KW"' in s,
              'Saudi fallback locale': '"ar-SA"' in s,
              'Generic Arabic fallback': '"ar"' in s,
              'Mic permission handler': 'onRequestPermissionsResult' in s,
              'Recognizer state guard': 'recognizerActive' in s,
              'Restart de-duplication': 'restartPending' in s,
              'No 8 second forced minimum': 'EXTRA_SPEECH_INPUT_MINIMUM_LENGTH_MILLIS' not in s,
              'Speech not blocked by model': 'if (!modelReady) return;\n                  if (!translating' not in s,
              'Online-first final translation': 'onlineTranslate(text, "",' in s,
              'Context window enabled': 'MAX_CONTEXT = 3' in s and 'recentArabic' in s,
              'Queue anti-lag enabled': 'MAX_QUEUE = 2' in s and 'enqueueLatest' in s,
              'Free MyVoice server endpoint': 'voiceServerUrl + "/tts"' in s,
              'Free MyVoice upload endpoint': 'voiceServerUrl + "/upload_ref"' in s,
              'MyVoice recording': 'MediaRecorder' in s and 'toggleVoiceRecording' in s,
              'System TTS fallback': 'TextToSpeech' in s and 'speakSystemVoice' in s,
              'Auto voice after translation': 'enqueueMyVoice' in s and 'appendChinese' in s,
              'No ElevenLabs dependency': 'elevenlabs' not in s.lower() and 'xi-api-key' not in s.lower(),
              'Partial Chinese flicker removed': 'partial 只显示阿语字幕' in s,
              'Single error restart path': s.count('handler.postDelayed(() -> startRecognition(), delay);') == 0,
          }
          bad = [k for k,v in checks.items() if not v]
          for k,v in checks.items():
              print(('PASS ' if v else 'FAIL ') + k)
          if bad:
              raise SystemExit('Sanity checks failed: ' + ', '.join(bad))
          PY

