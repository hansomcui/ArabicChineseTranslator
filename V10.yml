              private void initSystemTts() {
                  systemTts = new TextToSpeech(this, status -> {
                      if (status == TextToSpeech.SUCCESS) {
                          int r = systemTts.setLanguage(Locale.CHINA);
                          systemTts.setSpeechRate(1.0f);
                          systemTts.setPitch(1.0f);
                          systemTtsReady = r != TextToSpeech.LANG_MISSING_DATA
                                  && r != TextToSpeech.LANG_NOT_SUPPORTED;
                          systemTts.setOnUtteranceProgressListener(new UtteranceProgressListener() {
                              @Override
                              public void onStart(String utteranceId) {}

                              @Override
                              public void onDone(String utteranceId) {
                                  runOnUiThread(() -> finishVoicePlayback(
                                          "✅ 系统中文朗读已就绪"
                                  ));
                              }

                              @Override
                              public void onError(String utteranceId) {
                                  runOnUiThread(() -> finishVoicePlayback("⚠ 系统中文朗读失败"));
                              }
                          });
                      } else {
                          systemTtsReady = false;
                      }
                  });
              }

              private boolean customVoiceReady() {
                  return voiceServerUrl != null && !voiceServerUrl.trim().isEmpty()
                          && voiceRefPath != null && !voiceRefPath.trim().isEmpty();
              }

              private String normalizeServerUrl(String s) {
                  if (s == null) return "";
                  s = s.trim();
                  while (s.endsWith("/")) s = s.substring(0, s.length() - 1);
                  return s;
              }

              private void showVoiceServerDialog(Button serverButton) {
                  EditText input = new EditText(this);
